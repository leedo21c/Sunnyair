    CH.forEach(function(c){
      var list = byCh[c.n] || [], d = doneCount(list);
      h += '<li><a class="chcard" href="#ch-' + String(c.n).padStart(2,'0') + '" style="text-decoration:none;color:inherit"><span class="tab">' + c.code + '<small>' + String(c.n).padStart(2,'0') + '</small></span><span class="cb"><b>' + esc(c.name) + '</b><span class="d">' + esc(c.blurb) + '</span>' +
        '<span class="mini"><span class="meter"><i style="width:' + pct(d,list.length) + '%"></i></span>' + d + '/' + list.length + '</span></span></a></li>';
    });
    return h + '</ul></div>';
  }
  function vChapter(n){
    var c = chOf(n), list = byCh[n] || [], d = doneCount(list);
    var h = top(esc(c.name), '') + '<div class="pad view"><div class="chhead"><span class="tab">' + c.code + '</span><div><p>' + esc(c.blurb) + '</p><p>' + list.length + '개 항목 · 완료 ' + d + '</p></div></div><ul class="slist">';
    list.forEach(function(s){ h += srow(s); });
    return h + '</ul></div>';
  }
  function vSection(s){
    var c = chOf(s.ch), list = byCh[s.ch], prev = S[s.i-1], next = S[s.i+1];
    st.last = s.id; save();
    var right = '<button class="ib star' + (st.star[s.id] ? ' on' : '') + '" id="bStar" aria-label="북마크" aria-pressed="' + !!st.star[s.id] + '">' + (st.star[s.id] ? I.starF : I.star) + '</button>' +
      '<button class="ib" id="bFs" aria-label="글자 크기">' + I.aa + '</button>';
    var h = top(c.code + ' · ' + s.num, 'ch-' + String(s.ch).padStart(2,'0'), right) + '<article class="pad view" id="reader">' +
      '<header class="rhead"><div class="crumb"><span class="tab">' + c.code + '</span>' + esc(c.name) + ' · ' + s.num + ' / ' + list.length + '</div>' +
      '<h2>' + esc(s.title) + '</h2><div class="src">' + (s.merged ? '<span class="merged">통합</span>' : '') + '원본 ' + s.pages.map(function(p){return 'p.'+p;}).join(' · ') + '</div></header>' +
      '<div class="body">' + s.html + '</div>' +
      '<button class="donebtn' + (st.done[s.id] ? ' on' : '') + '" id="bDone">' + (st.done[s.id] ? '✓ 학습 완료' : '학습 완료로 표시') + '</button>' +
      '<nav class="rnav"><button id="bPrev"' + (prev ? '' : ' disabled') + '><small>이전</small><span>' + (prev ? prev.num + ' ' + esc(prev.title) : '') + '</span></button>' +
      '<button id="bNext"' + (next ? '' : ' disabled') + '><small>다음</small><span>' + (next ? next.num + ' ' + esc(next.title) : '') + '</span></button></nav></article>';
    return {html:h, after:function(){
      document.getElementById('bPrev').onclick = function(){ if(prev) go(prev.id); };
      document.getElementById('bNext').onclick = function(){ if(next) go(next.id); };
      document.getElementById('bDone').onclick = function(){
        if(st.done[s.id]) delete st.done[s.id]; else st.done[s.id] = 1; save();
        this.classList.toggle('on', !!st.done[s.id]); this.textContent = st.done[s.id] ? '✓ 학습 완료' : '학습 완료로 표시';
        if(st.done[s.id]) toast('완료로 표시했어요');
      };
      document.getElementById('bStar').onclick = function(){
        if(st.star[s.id]) delete st.star[s.id]; else st.star[s.id] = Date.now(); save();
        var on = !!st.star[s.id]; this.classList.toggle('on', on); this.innerHTML = on ? I.starF : I.star; this.setAttribute('aria-pressed', on);
        toast(on ? '북마크에 추가했어요' : '북마크에서 뺐어요');
      };
      document.getElementById('bFs').onclick = function(){ st.fs = st.fs >= 18 ? 13 : st.fs + 1; save(); applyFs(); toast('글자 크기 ' + st.fs); };
      swipe(document.getElementById('reader'), prev, next);
    }};
  }
  var lastQ = '';
  function vSearch(){
    var h = top('검색', null) + '<div class="pad view"><div class="sbox"><label for="q" class="sr" style="position:absolute;left:-9999px">검색어</label><input id="q" type="search" enterkeyhint="search" placeholder="예: RVSM, 교체공항, V1, 안개" autocomplete="off" value="' + esc(lastQ) + '">' +
      '<div class="chips">' + ['V1','교체공항','RVSM','METAR','GPWS','Holding','EDTO','준사고'].map(function(w){ return '<button type="button" data-w="' + w + '">' + w + '</button>'; }).join('') + '</div><p class="qmeta" id="qm"></p></div><ul class="slist" id="res"></ul></div>';
    return {html:h, after:function(){
      var q = document.getElementById('q');
      q.oninput = function(){ lastQ = q.value; runSearch(); };
      document.querySelectorAll('.chips button').forEach(function(b){ b.onclick = function(){ q.value = lastQ = b.dataset.w; runSearch(); }; });
      runSearch();
      if(!lastQ) setTimeout(function(){ q.focus({preventScroll:true}); }, 60);
    }};
  }
  var plain = null;
  function runSearch(){
    if(!plain){ var div = document.createElement('div'); plain = S.map(function(s){ div.innerHTML = s.html; return (s.title + ' ' + div.textContent).replace(/\s+/g,' '); }); }
    var res = document.getElementById('res'), qm = document.getElementById('qm');
    var terms = lastQ.trim().toLowerCase().split(/\s+/).filter(Boolean);
    if(!terms.length){ res.innerHTML = ''; qm.textContent = '용어, 숫자, 약어 모두 찾을 수 있어요.'; return; }
    var out = [];
    S.forEach(function(s, i){
      var low = plain[i].toLowerCase();
      if(!terms.every(function(t){ return low.indexOf(t) > -1; })) return;
      var score = terms.reduce(function(a,t){ return a + (s.title.toLowerCase().indexOf(t) > -1 ? 10 : 0); }, 0);
      var at = low.indexOf(terms[0]), a = Math.max(0, at - 30), seg = plain[i].slice(a, at + terms[0].length + 50);
      var sn = (a ? '…' : '') + esc(seg).replace(new RegExp('(' + terms.map(function(t){ return t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }).join('|') + ')','gi'), '<em>$1</em>') + '…';
      out.push({s:s, score:score, sn:sn});
    });
    out.sort(function(x,y){ return y.score - x.score || x.s.i - y.s.i; });
    qm.textContent = out.length ? out.length + '개 항목' : '일치하는 항목이 없어요';
    res.innerHTML = out.slice(0, 80).map(function(o){ return srow(o.s, {chname:true, snip:o.sn}); }).join('');
  }
  function vMarks(){
    var list = S.filter(function(s){ return st.star[s.id]; });
    var h = top('북마크', null) + '<div class="pad view">';
    if(!list.length) h += '<div class="empty"><b>아직 북마크가 없어요</b>항목을 열고 위쪽 별을 누르면 여기에 모여요. 시험 전에 다시 볼 것만 골라두세요.</div>';
    else h += '<ul class="slist">' + list.map(function(s){ return srow(s, {chname:true}); }).join('') + '</ul>';
    return h + '</div>';
  }
  function vMore(){
    var h = top('설정 · 안내', null) + '<div class="pad view">' +
      '<div class="card"><h3>본문 글자 크기</h3><div class="seg">' + [13,15,16,18].map(function(n){ return '<button type="button" data-fs="' + n + '" aria-pressed="' + (st.fs===n) + '">' + n + '</button>'; }).join('') + '</div></div>' +
      '<div class="card"><h3>표시 안내</h3><dl class="legend">' +
      '<div><dt><b class="k">빨간 글씨</b></dt><dd>원본에서 빨갛게 강조한 부분</dd></div>' +
      '<div><dt><mark>형광 표시</mark></dt><dd>원본에서 형광펜 칠한 부분</dd></div>' +
      '<div><dt><span class="merged">통합</span></dt><dd>원본 여러 곳의 중복 내용을 합친 항목</dd></div>' +
      '<div><dt><span class="fix">✎ 수정</span></dt><dd>사실관계를 바로잡거나 원본 표기를 남긴 곳</dd></div></dl>' +
      '<p class="note">표가 화면보다 넓으면 표 안에서 좌우로 밀어서 보세요. 항목 화면에서 좌우로 넘기면 이전·다음 항목으로 이동해요.</p></div>' +
      '<div class="card"><h3>학습 기록</h3><p class="note" style="margin:0 0 10px">완료 표시와 북마크는 지금 쓰는 기기의 브라우저에만 저장돼요. 다른 기기와는 공유되지 않아요.</p>' +
      '<button class="danger" id="reset" type="button">완료 표시 모두 지우기</button></div>' +
      '<p class="note" style="margin:16px 0 0">원본 : 공채과외정리_ver13.pdf (1–91p)</p></div>';
    return {html:h, after:function(){
      document.querySelectorAll('[data-fs]').forEach(function(b){ b.onclick = function(){ st.fs = +b.dataset.fs; save(); applyFs(); render(); }; });
      var r = document.getElementById('reset'), armed = false;
      r.onclick = function(){ if(!armed){ armed = true; r.textContent = '한 번 더 누르면 지워져요'; return; } st.done = {}; save(); toast('완료 표시를 지웠어요'); render(); };
    }};
  }

  function swipe(el, prev, next){
    var x0, y0, t0, skip;
    el.addEventListener('touchstart', function(e){ var t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; t0 = Date.now(); skip = !!e.target.closest('.tbl,pre,figure'); }, {passive:true});
    el.addEventListener('touchend', function(e){
      if(skip || x0 == null) return; var t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0;
      if(Date.now() - t0 < 600 && Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 2){ if(dx < 0 && next) go(next.id); if(dx > 0 && prev) go(prev.id); }
      x0 = null;
    }, {passive:true});
  }
  var tt;
  function toast(m){ var o = document.querySelector('.toast'); if(o) o.remove(); var d = document.createElement('div'); d.className = 'toast'; d.setAttribute('role','status'); d.textContent = m; document.body.appendChild(d); clearTimeout(tt); tt = setTimeout(function(){ d.remove(); }, 1600); }
  function go(h){ location.hash = h; }

  function render(){
    var h = location.hash.replace(/^#/, ''), v, tab = 'home', m;
    if(h === 'search'){ v = vSearch(); tab = 'search'; }
    else if(h === 'marks'){ v = vMarks(); tab = 'marks'; }
    else if(h === 'more'){ v = vMore(); tab = 'more'; }
    else if((m = h.match(/^ch-(\d+)$/)) && chOf(+m[1])){ v = vChapter(+m[1]); }
    else if(byId[h]){ v = vSection(byId[h]); }
    else { v = vHome(); }
    if(typeof v === 'string') v = {html:v};
    app.innerHTML = v.html;
    if(v.after) v.after();
    tabs.querySelectorAll('button').forEach(function(b){ if(b.dataset.tab === tab) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
    window.scrollTo(0, 0);
  }
  tabs.innerHTML = '<div class="tabs-in">' +
    [['home','목차',I.book,''],['search','검색',I.search,'search'],['marks','북마크',I.star,'marks'],['more','설정',I.gear,'more']].map(function(t){
      return '<button type="button" data-tab="' + t[0] + '" data-h="' + t[3] + '">' + t[2] + '<span>' + t[1] + '</span></button>'; }).join('') + '</div>';
  tabs.addEventListener('click', function(e){ var b = e.target.closest('button'); if(!b) return; if(location.hash.replace('#','') === b.dataset.h) { window.scrollTo(0,0); return; } go(b.dataset.h); });
  window.addEventListener('hashchange', render);
  render();
})();
</script>

<script>if('serviceWorker' in navigator){addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</body></html>
