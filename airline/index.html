e를 입을 수 있기 때문에\n- Engine 내부 가장 뜨거운 곳은 Combustion Chamber 직후 / But 여기 온도를 측정할 수 없기 때문에 EGT를 측정하여 limitation\n- 외기온도가 높으면 들어가는 공기가 뜨겁기 때문에 나가는 공기도 뜨거워진다 → 항공기 스스로 추력을 감소 / 연료분사량을 줄여서 추력을 감소시킨다.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>구분<\/th>\n<th>내용<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Derated<\/strong><\/td>\n<td>최대 추력 자체가 낮아지기 때문에 ATM과 다름 — ATM의 경우 최대추력은 변하지 않음<\/td>\n<\/tr>\n<tr>\n<td><strong>FADEC<\/strong><\/td>\n<td>Full Authority Digital Engine Control — 전체 Engine 담당<\/td>\n<\/tr>\n<tr>\n<td><strong>EEC<\/strong><\/td>\n<td>Electronic Engine Control — 각 Engine 마다 담당<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>ATM 사용금지 조건 — <mark>CAS W MT<\/mark> (카스 마시고 W 모텔)<\/strong> (댄공FOM 400p)<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>분류<\/th>\n<th><\/th>\n<th>조건<\/th>\n<th>비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>제동거리 증가<\/td>\n<td><strong>C<\/strong><\/td>\n<td>Contaminated RWY<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><strong>A<\/strong><\/td>\n<td>Anti-skid INOP.<\/td>\n<td>미끄러짐 방지기능 작동안됨<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><strong>S<\/strong><\/td>\n<td>Slippery RWY<\/td>\n<td>*감소된 추력이지만 최대추력으로 뜨는게 좋으니깐<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><strong>W<\/strong><\/td>\n<td>Wind shear 예상시<\/td>\n<td>상승률 안나올 수도 있음<\/td>\n<\/tr>\n<tr>\n<td>Derated 금지 only<\/td>\n<td><strong>M<\/strong><\/td>\n<td>MEL 상 불가시<\/td>\n<td>FADEC, EEC fail일 경우<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><strong>T<\/strong><\/td>\n<td>T/O Performance 계산 못할 경우<\/td>\n<td>안전하지 못함<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>※ Reduced Thrust Procedure : 30일 주기로 Full T/O Thrust를 실시해야함 (Full Rated Thrust, 최대 정격 추력)<\/li>\n<li>※ Derated과 ATM 동시에 사용(X) → ATM은 최대 추력의 25%까지만 감소가능<\/li>\n<\/ul>"}, {"id": "s05-13", "ch": 5, "num": "5.13", "title": "V Speed (→ Calibrated A/S : Instrument Error & Installation Error, 계기오차 & 설치오차 보정)", "pages": [24], "merged": false, "html": "<div class=\"figs\"><figure><img src=\"img/i-025-008.webp\" alt=\"V Speed 순서 — Vmcg ≤ Vef ≤ V1 ≤ Vmbe / Vmca · Vr · Vlof · V2 (Rejected vs Continue Takeoff)\" loading=\"lazy\"><figcaption>V Speed 순서 — Vmcg ≤ Vef ≤ V1 ≤ Vmbe / Vmca · Vr · Vlof · V2 (Rejected vs Continue Takeoff)<\/figcaption><\/figure><\/div>\n<p><strong>V1<\/strong>\n- ※ V1 낮음 → ASD감소 / 더 저속에서 Full Stop 할 수 있음\n- V1↑ ASD↑ : <b class=\"k\">같은<\/b> 방향성 — 저속에서 E.F Stop Distance\n- V1↑ AGD↓ : 다른 방향성 — 더 고속에서 C.E.F\n- <mark><b class=\"k\">Vmcg ≤ V1 ≤ Vmbe<\/b><\/mark> · <mark><b class=\"k\">V1 ≤ Vr<\/b><\/mark> — <b class=\"k\">V1과 Vr은 같을 수도 있다 / Vmbe 와 Vmca는 순서가 아님<\/b>\n  - Vmcg전, C.E.F directional control 불가 → V1이 더 작을 수 없음.\n  - Vmbe후, Max Brake 브레이크 밟지 못함 → V1이 초과할 수 없음.<\/p>\n<p><strong>V2<\/strong>\n- <mark><b class=\"k\">V1 1초전<\/b> C.E.F 시 <b class=\"k\">T/O SFC<\/b> 35ft 상공 도달 시 얻어야 하는 최소속도<\/mark> — RWY + Clearway / 최악의 경우\n- <mark><b class=\"k\">Engine Fail<\/b><\/mark>시, Continue T/O 후, <mark><b class=\"k\">Gross T/O path<\/b><\/mark>의 1st <mark><b class=\"k\">2nd Segment<\/b><\/mark>에서 유지해야하는 <b class=\"k\">최소 속도<\/b>\n- <b class=\"k\">V2 유지 → 30° Bank 보장<\/b> / <b class=\"k\">V2+15kt → 40° Bank 보장<\/b> — 고도손실없이\n- Ex) V1 2초 후라면 더 높은 속도를 얻을 수도 있음 V2 + @ / <b class=\"k\">V2 유지 못하면, 퍼포먼스 측면에서 위험할 수 있음<\/b><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>조건<\/th>\n<th>비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>V2 ≥ 1.1V<b class=\"k\">mca<\/b><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>V2 ≥ 1.2Vs<\/td>\n<td>현실적 Stall spd (Vs) — 0.07차이<\/td>\n<\/tr>\n<tr>\n<td>V2 ≥ 1.13Vs1g(Vsr) 특정 항공기<\/td>\n<td>이론적 Stall spd (1g상태 유지)<\/td>\n<\/tr>\n<tr>\n<td>Vs <b class=\"k\">≤<\/b> Vsr<\/td>\n<td>고도손실 후 Stall spd<\/td>\n<\/tr>\n<tr>\n<td>Vsr ≥ Vs1g<\/td>\n<td>약간 크다<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Vr<\/strong>\n- (최악의 상황) E.F후에도, <b class=\"k\">T/O SFC 35ft 상공 도달 시 최소 V2를 얻도록 설정해야 함<\/b>\n- <b class=\"k\">V1 이후 Windshear / Vr 이전에도 뜰 수 있음<\/b>\n  1. Vlof ≥ 1.1Vmu (1.05Vmu (OEI)) — 실제 뜨는 속도는 언스틱보다 커야지 / Minimum Unstick 최소속도\n  2. Vr ≥ V1\n  3. Vr ≥ 1.05V<b class=\"k\">mca<\/b>\n- Vr ≥ Vmu — V1과는 비교할 수 없다.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>속도<\/th>\n<th>정의<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Vmu<\/strong><\/td>\n<td><b class=\"k\">Lift off<\/b> 가능한 <b class=\"k\">최소속도<\/b> — Tail skid를 일으키지 않고 Maximum Pitch를 유지 상태로 뜰 수 있는 최소속도<\/td>\n<\/tr>\n<tr>\n<td><strong>Vlof<\/strong><\/td>\n<td><b class=\"k\">실제 뜨는 속도<\/b><\/td>\n<\/tr>\n<tr>\n<td><strong>Vfto<\/strong><\/td>\n<td>Final T/O speed — ≥ 1.25Vs / ≥ 1.18Vs1g (0.07차이)<\/td>\n<\/tr>\n<tr>\n<td><strong>Vat<\/strong><\/td>\n<td><mark>1.3Vso = 1.23Vs1g<\/mark> (0.07차이) — 1g유지하면서 Stall Speed / 더 높은 Stall speed<\/td>\n<\/tr>\n<tr>\n<td><strong>Vmc (Vmca)<\/strong><\/td>\n<td><b class=\"k\">~~공중에서~~ C.E.F시, 150pound 이하의 Rudder와 5° 이내의 Bank를 사용해서 Heading 유지가능한 최저속도<\/b><br><b class=\"k\">(Directional control)<\/b> → maintain straight flight / 저속 fail시 R/D effectiveness 감소<br>※ 초기 좌우 20° 이내 유지 (특별한 조치하지 않아도)<br>V2 ≥ 1.1Vmc / Vr ≥ 1.05Vmc / 1.13Vs1g(SR) ≥ Vmc<\/td>\n<\/tr>\n<tr>\n<td><strong>Vmcg<\/strong><\/td>\n<td><b class=\"k\">지상에서 (C.)E.F시, 150pound 이하의 Rudder로 Centerline 좌우 30ft이내 유지할 수 있는 최소속도<\/b><br>※ Vmcg이상이면 유리 / Steering wheel 사용 X / Vmcg 이전, Differential Brake 사용<br><b class=\"k\">Forward CG<\/b> → Arm이 길다 → R/D ↑ → <b class=\"k\">Vmcg ↓<\/b><br>Thrust ↑ → 확 틀어짐 → R/D ↓ → Vmcg ↑<br><b class=\"k\">Derate<\/b> → 최대 추력 낮게 인식 → <b class=\"k\">Vmcg ↓ → V1 ↓<\/b><br><b class=\"k\">Weight ↑<\/b> → 많이 안 틀어진다 → <b class=\"k\">Vmcg ↓<\/b><br>속도가 <b class=\"k\">빨라야<\/b> Directional Control이 가능해진다<\/td>\n<\/tr>\n<tr>\n<td><strong>VFE<\/strong><\/td>\n<td><b class=\"k\">Flap Extended<\/b> — Flap 펼친 상태 최고속도<\/td>\n<\/tr>\n<tr>\n<td><strong>VLE<\/strong><\/td>\n<td><b class=\"k\">Landing gear Extended<\/b> — Landing gear Extend 상태 최고속도<\/td>\n<\/tr>\n<tr>\n<td><strong>VLO<\/strong><\/td>\n<td><b class=\"k\">Landing gear Operation<\/b> — Landing gear Operation 최고속도<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s05-14", "ch": 5, "num": "5.14", "title": "V Speed 용어 한눈에 정리 & Gross TO Flight Path Takeoff Segment", "pages": [27], "merged": false, "html": "<p><strong>Gross TO flight path Takeoff Segment<\/strong> (Climb Limited Weight의 Segment 기준과 함께 볼 것)<\/p>\n<div class=\"figs\"><figure><img src=\"img/i-028-015.webp\" alt=\"Takeoff Segment 요약 — Ground roll / 1st~4th segment, 엔진수별 요구 상승률\" loading=\"lazy\"><figcaption>Takeoff Segment 요약 — Ground roll / 1st~4th segment, 엔진수별 요구 상승률<\/figcaption><\/figure><\/div>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Segment<\/th>\n<th>구간<\/th>\n<th>속도<\/th>\n<th>비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1st Segment<\/td>\n<td>Lift off ~ Gear up<\/td>\n<td>VLOF ~ V2<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>2nd Segment<\/td>\n<td>Gear-up ~ Flap Retraction<\/td>\n<td>최소 V2 이상 유지<\/td>\n<td>~Acceleration Height — 최소 400ft<\/td>\n<\/tr>\n<tr>\n<td>3rd Segment<\/td>\n<td>Flap Retract ~ Acceleration ALT<\/td>\n<td>V2 ~ VFTO<\/td>\n<td>안정 상승 / Level-off / Cleanup / MCT / VFTO<\/td>\n<\/tr>\n<tr>\n<td>4th Segment<\/td>\n<td>Acceleration ALT ~ Climb 1500<\/td>\n<td>VFTO<\/td>\n<td>플랩/기어 Retraction / 1,500ft까지 유지<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>V Speed<\/th>\n<th>명칭<\/th>\n<th>정의 / 조건<\/th>\n<th>비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>VFTO<\/strong><\/td>\n<td>Final T/O Speed<\/td>\n<td>Gross T/O Flight Path 에서 Final Segment에서 유지해야하는 속도<\/td>\n<td>VFTO ≥ 1.25Vs / VFTO ≥ 1.18Vs1g<\/td>\n<\/tr>\n<tr>\n<td><strong>VMCG<\/strong><\/td>\n<td>Minimum Control Speed in the Ground<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>VEF<\/strong><\/td>\n<td><\/td>\n<td>Engine Fail 될 것으로 예상(Assume)되는 속도<\/td>\n<td>V1 1초전 — 가장 최악<\/td>\n<\/tr>\n<tr>\n<td><strong>V1<\/strong><\/td>\n<td>1) T/O Decision Speed (이륙 결심 속도)<br>2) RTO Action Speed<\/td>\n<td>V1 ≤ Vr / V1 ≤ V2<\/td>\n<td>Ex. Both Eng failure → STOP<\/td>\n<\/tr>\n<tr>\n<td><strong>VMBE<\/strong><\/td>\n<td>Maximum Brake Energy Speed<\/td>\n<td>Brake Apply 할 수 있는 최대 속도<\/td>\n<td>무거울수록 VMBE 감소 / 가벼우면 증가<\/td>\n<\/tr>\n<tr>\n<td><strong>VMCA<\/strong><\/td>\n<td>Minimum Control Speed<\/td>\n<td>Vmca ≤ 1.13Vs1g(sr) = 1.13Vsr<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>VMU<\/strong><\/td>\n<td>Minimum unstick<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>VR<\/strong><\/td>\n<td>Rotation Speed — Rotate를 시작하는 속도<\/td>\n<td>1) Vr ≥ V1 / 2) Vr ≥ 1.05Vmca / 3) 35ft 상공 V2 얻을 수 있도록 설정 해야한다. / 4) Vlof ≥ 1.1Vmu<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>VLOF<\/strong><\/td>\n<td>Lift-off Speed<\/td>\n<td>Vlof ≥ 1.1Vmu / Vlof ≥ 1.05Vmu (OEI시)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>V2<\/strong><\/td>\n<td>T/O Safety Speed (이륙 속도) — OEI시, 양력과 조종성 유지 최소 속도<\/td>\n<td>V2 ≥ 1.13Vs1g / V2 ≥ 1.2Vs : 장애물 회피 성능 보장 / V2 ≥ 1.1Vmca : Turning 안전마진 보장<\/td>\n<td>15° Bank<\/td>\n<\/tr>\n<tr>\n<td><strong>VS<\/strong> (작)<\/td>\n<td>Stall speed<\/td>\n<td>Minimum steady flight speed in L/D configuration<\/td>\n<td>고도손실이 동반(전체 스톨)<\/td>\n<\/tr>\n<tr>\n<td><strong>VS1G<\/strong> (큰) = <strong>VSR<\/strong><\/td>\n<td>1G Stall speed / Reference Stall Speed (기준 실속 속도)<\/td>\n<td>1G 상태에서의 Stall Speed<\/td>\n<td>모든 V-Speed의 기준점<\/td>\n<\/tr>\n<tr>\n<td><strong>VNO<\/strong><\/td>\n<td>Maximum Structural Cruising Speed <span class=\"fix\" title=\"정리하면서 확인·수정한 부분\">✎ 원본 “Maximum Structure Holding Speed”<\/span><\/td>\n<td>Smooth Air + Turbulent Air / Normal Operating Range<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>VREF<\/strong><\/td>\n<td>Landing Reference Speed (FAA) — Straight in Approach<\/td>\n<td>Vref ≥ 1.3Vso / Vref ≥ 1.23Vs1g<\/td>\n<td>MLDW / L/D Config<\/td>\n<\/tr>\n<tr>\n<td><strong>VAT<\/strong><\/td>\n<td>Landing Reference Speed (ICAO)<\/td>\n<td>Vat = 1.3Vso / Vat = 1.23Vs1g<\/td>\n<td>MLDW / L/D Config<\/td>\n<\/tr>\n<tr>\n<td><strong>VA<\/strong><\/td>\n<td>Maneuvering Speed — 무게에 따라 달라짐<\/td>\n<td>Va(actual) = Max Gross Weight Va × √(Actual Weight / Max Gross Weight)<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s05-15", "ch": 5, "num": "5.15", "title": "VMCG / VMCA 영향 요인", "pages": [24], "merged": false, "html": "<p><strong>VMCG<\/strong> — (정의는 위 V Speed 표 참고)\n- ※ VMCG 속도 이상에서 Nose Wheel Steering 없이 Rudder만으로 Directional Control 이 유리하게 작용함\n- ※ VMCG ↑ → V1 ↑ / VMCG ↓ → V1 ↓ / VMCG ≤ V1 ≤ VMBE<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>요인<\/th>\n<th>과정<\/th>\n<th><\/th>\n<th><\/th>\n<th>결과<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>L/D Configuration — Flap Down↓<\/td>\n<td>영향이 적음<\/td>\n<td><\/td>\n<td><\/td>\n<td>→ VMCG 증가<\/td>\n<\/tr>\n<tr>\n<td>Pressure ↑<\/td>\n<td>→ 저고도(SFC)<\/td>\n<td>→ Performance 좋음<\/td>\n<td><\/td>\n<td>→ VMCG 증가<\/td>\n<\/tr>\n<tr>\n<td>Pressure ALT↑<\/td>\n<td>→ 낮은 기압<\/td>\n<td>→ Max Thrust↓<\/td>\n<td>→ Performance ↓<\/td>\n<td>→ VMCG 감소<\/td>\n<\/tr>\n<tr>\n<td>DA — Density ALT↑<\/td>\n<td>→ Warm Air<\/td>\n<td>→ Max Thrust↓<\/td>\n<td>→ R/D 덜 필요함<\/td>\n<td>→ VMCG 감소<\/td>\n<\/tr>\n<tr>\n<td>Thrust 증가↑ (살아있는 엔진 Yawing moment 증가)<\/td>\n<td>→ Yawing 발생<\/td>\n<td>→ 더 빠른 속도로 R/D 효과 보상<\/td>\n<td><\/td>\n<td>→ VMCG 증가<\/td>\n<\/tr>\n<tr>\n<td>CG (Forward)<\/td>\n<td>→ Arm 길다<\/td>\n<td><\/td>\n<td>→ R/D 효과 증가<\/td>\n<td>→ VMCG 감소<\/td>\n<\/tr>\n<tr>\n<td>중량 — Weight 증가↑<\/td>\n<td>→ 접지력 상승<\/td>\n<td>→ 지면 마찰 증가<\/td>\n<td>→ 방향유지에 유리<\/td>\n<td>→ VMCG 감소<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>EX.<\/th>\n<th><\/th>\n<th><\/th>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>TOGA Thrust<\/td>\n<td>Aft CG<\/td>\n<td>Light Weight<\/td>\n<td>Ex) VMCG 115kt<\/td>\n<td>R/D 효과 감소<\/td>\n<\/tr>\n<tr>\n<td>Derated Thrust<\/td>\n<td>Forward CG<\/td>\n<td>Heavy Weight<\/td>\n<td>Ex) VMCG 100kt<\/td>\n<td>방향제어 유리<\/td>\n<\/tr>\n<tr>\n<td>ATM<\/td>\n<td>VMCG 영향 없음<\/td>\n<td>최대 추력이 같기 때문에(변함없음)<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>VMCA<\/strong> — (정의는 위 V Speed 표 참고) ※ VMCA 속도 이하에서 R/D Effectiveness 감소<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>요인<\/th>\n<th>과정<\/th>\n<th><\/th>\n<th>결과<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>L/D Configuration — Flap Down↓<\/td>\n<td>영향이 적음<\/td>\n<td><\/td>\n<td>→ VMCA 증가<\/td>\n<\/tr>\n<tr>\n<td>Gear Down↓<\/td>\n<td>영향이 적음<\/td>\n<td><\/td>\n<td>→ VMCA 증가<\/td>\n<\/tr>\n<tr>\n<td>Power/Thrust<\/td>\n<td>→ Yawing 발생<\/td>\n<td>→ 더 빠른 속도로 R/D 효과 보상<\/td>\n<td>→ VMCA 증가<\/td>\n<\/tr>\n<tr>\n<td>CG (Forward)<\/td>\n<td>→ Arm 길다<\/td>\n<td>→ R/D 효과 증가<\/td>\n<td>→ VMCA 감소<\/td>\n<\/tr>\n<tr>\n<td>Weight 증가↑<\/td>\n<td>→ 방향안정성 증가<\/td>\n<td>→ 방향유지에 유리<\/td>\n<td>→ VMCA 감소<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>Heavy → 5° bank → Horizontal component ↑ / Sideslip ↑ — 무거울수록 Bank 효과가 큰데 5°까지 사용가능하기 때문에 유리<\/li>\n<li>표준교재 : 무게 감소시 Vmc 감소로 나옴<\/li>\n<\/ul>"}, {"id": "s05-16", "ch": 5, "num": "5.16", "title": "Vref", "pages": [24], "merged": false, "html": "<ul>\n<li>Approach 시 50ft까지는 유지해야 하는 최소 속도<\/li>\n<li>FCOM에 등재되어 있는 속도 — A/C Configuration &amp; MLDW에 따라 달라짐<\/li>\n<li>Approach시, Final Approach Segment에서 유지해야 하는 최소속도<\/li>\n<li>최소 Vref +5kt → 설정되어 있기 때문에 → Deviation +10knot / -5kt 허용됨 / 최대 Vref + 15kt<\/li>\n<li><strong>Vref = Vat<\/strong> AT Threshold ≥ 1.23Vsr = 1.23Vs1g = 1.3Vso<\/li>\n<li>※ Stabilized Approach, Calibrated A/S(ISA) / must be maintained 50ft (Threshold)<\/li>\n<li><strong>ALD<\/strong> (Actual L/D Distance) : 착륙시단을 50ft 통과해서 Thrust Reversal 사용하지 않고 Full stop 이를 때 까지의 거리<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Straight App CAT<\/th>\n<th>FAA<\/th>\n<th>ICAO<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>기준 속도<\/td>\n<td>Vref<\/td>\n<td>Vat<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>이상<\/td>\n<td>동일<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s05-17", "ch": 5, "num": "5.17", "title": "성능계산 고려사항 (운기기 315p)", "pages": [75], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>비행 모든 단계<\/th>\n<th>이착륙시<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>중량에 따른 <b class=\"k\">연료 오일<\/b> 소모<\/td>\n<td><b class=\"k\">오염<\/b>(물, 진창, 눈, 얼음)된 <b class=\"k\">이륙활주로<\/b> 상태<\/td>\n<\/tr>\n<tr>\n<td><b class=\"k\">바람<\/b>, <b class=\"k\">외형변동<\/b>에 따른 연료 소모<\/td>\n<td>활주로 <b class=\"k\">경사도<\/b> 및 <b class=\"k\">길이<\/b> / <b class=\"k\">개방구역, 정지로<\/b><\/td>\n<\/tr>\n<tr>\n<td>중량 및 연료 잔량에 대한 <b class=\"k\">연료방출(덤핑)<\/b><\/td>\n<td>이착륙 <b class=\"k\">활주로 기압고도<\/b> / 정풍(50%) / 배풍(150%)<\/td>\n<\/tr>\n<tr>\n<td><b class=\"k\">방빙장치<\/b> 사용 영향(Anti-icing) ~~제빙(De-icing)~~<\/td>\n<td><b class=\"k\">이륙<\/b>시/<b class=\"k\">도착<\/b>지/<b class=\"k\">교체<\/b>공항 <b class=\"k\">외기 온도 및 바람<\/b> ~~(무풍기준)~~<\/td>\n<\/tr>\n<tr>\n<td>회항 항로상 <b class=\"k\">외기 온도<\/b> 및 바람<\/td>\n<td>형식별 <b class=\"k\">지상운용 특성<\/b>(<b class=\"k\">제동력<\/b> 등)<\/td>\n<\/tr>\n<tr>\n<td>장애물 통과 위한 <b class=\"k\">비행경로 및 최저고도<\/b><\/td>\n<td>이륙<b class=\"k\">경로<\/b>, 착륙<b class=\"k\">경로<\/b> 및 <b class=\"k\">착륙활주<\/b>에 미치는 시설/지형<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s06-01", "ch": 6, "num": "6.1", "title": "Adequate VIS REF (Adequate Visual Reference) — 이륙 최저치", "pages": [3], "merged": false, "html": "<p><strong>정의 : Standard Takeoff Minimum<\/strong> — <strong>부기장<\/strong>이 Takeoff 할 수 있는 minimum<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>2Eng<\/th>\n<th><mark><b class=\"k\">RVR 1,500m<\/b><\/mark><\/th>\n<th><mark>VIS 1,600m<\/mark><\/th>\n<th>둘 다 보고될 경우 RVR 기준이 우선임<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>→ 미니멈 아래일 경우 (<strong>Lower than Standard minima<\/strong>) : 기장이 Takeoff 할 수 있는지 확인해야 함 → 이 경우 반드시 <strong>Standing Takeoff<\/strong><\/li>\n<li>Use Mid if TDZ RVR is inoperative — TDZ RVR 필수(X)<\/li>\n<\/ul>\n<p><strong><b class=\"k\">기장 TO / Standing TO<\/b><\/strong> — Lower than Standard minima / Use Mid if TDZ RVR is inoperative / TDZ RVR 필수(X)<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>조건<\/th>\n<th>RVR<\/th>\n<th>VIS<\/th>\n<th>ft<\/th>\n<th>SM<\/th>\n<th>비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Adequate VIS REF<\/strong> (가장 불리한 기준)<br>활주로만 눈에 보일 때 (<b class=\"k\">Day<\/b>time only)<\/td>\n<td><mark><b class=\"k\">RVR 500m<\/b><\/mark> (1/3)<\/td>\n<td>VIS 400m (1/4)<\/td>\n<td><mark>1,600ft<\/mark><\/td>\n<td>1/4 SM<\/td>\n<td>Directional control 가능 / *1SM = 1,609m<\/td>\n<\/tr>\n<tr>\n<td><strong>CL or RL or RCLM<\/strong> (Night Operation)<\/td>\n<td><mark><b class=\"k\">RVR 300m<\/b><\/mark><\/td>\n<td>VIS 300m<\/td>\n<td><mark>1,000ft<\/mark><\/td>\n<td><\/td>\n<td>*CL : Centerline Lights<br>*RL : Runway Lights<br>*RCLM : Runway Centerline Marking<\/td>\n<\/tr>\n<tr>\n<td><strong>1<\/strong> — RL &amp; CL<\/td>\n<td><mark><b class=\"k\">RVR 200m<\/b><\/mark><\/td>\n<td>VIS 200m<\/td>\n<td><mark>600ft<\/mark><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>1,2<\/strong> — HIRL &amp; CL<\/td>\n<td><mark><b class=\"k\">RVR 125m<\/b><\/mark><\/td>\n<td>X<\/td>\n<td><mark>400ft<\/mark><\/td>\n<td><\/td>\n<td><b class=\"k\">H<\/b>igh <b class=\"k\">I<\/b>ntensity <b class=\"k\">R<\/b>unway <b class=\"k\">L<\/b>ight and <b class=\"k\">C<\/b>enterline <b class=\"k\">L<\/b>ights<\/td>\n<\/tr>\n<tr>\n<td><strong>1,2<\/strong> — HIRL &amp; CL &amp; <b class=\"k\">HUD<\/b><\/td>\n<td><mark><b class=\"k\">RVR 75m<\/b><\/mark><\/td>\n<td>X<\/td>\n<td><mark>300ft<\/mark><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>RVR조건<\/strong>\n1. 2개 설치시 — TDZ &amp; Rollout RVR 필요함\n2. 3개 설치시 — 하나가 Fail이라도 나머지 2개가 미니멈 이상이면 OK<\/p>"}, {"id": "s06-02", "ch": 6, "num": "6.2", "title": "LVO (Low Visibility Operation)", "pages": [3], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><b class=\"k\">L<\/b>ow <b class=\"k\">V<\/b>isibility <b class=\"k\">O<\/b>peration<\/th>\n<th><\/th>\n<th><\/th>\n<th>Annex 6. 47p<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Takeoff<\/td>\n<td><mark><b class=\"k\">RVR 400m 미만<\/b><\/mark><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Approach<\/td>\n<td><mark><b class=\"k\">RVR 550m 미만<\/b><\/mark><\/td>\n<td><mark>DH 200ft 미만<\/mark><\/td>\n<td>CAT II/III<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s06-03", "ch": 6, "num": "6.3", "title": "Standing T/O (댄공FOM 401p / FCTM 107p)", "pages": [27], "merged": false, "html": "<ul>\n<li>Directional Control을 유리하게 가져가기 위해서 사용<\/li>\n<li>Engine Stabilized 될 때까지 브레이크를 밟고 있다가 이후에 T/O — Uniform Eng Acceleration(균등한)<\/li>\n<li>N1 · EPR(Engine Pressure Ratio) 일정수치 안정 확인 후 → TOGA<\/li>\n<\/ul>\n<p><strong>사용 조건 — <mark>I.L.S<\/mark><\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>조건<\/th>\n<th>비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>I<\/strong><\/td>\n<td>Icing Condition, Static Engine Run-up 필요한 경우 (Bleed air 사용)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>L<\/strong><\/td>\n<td>Lower than Standard T/O minima<\/td>\n<td>→ 시정이 낮을 경우, Directional control 용이해짐<br>Standard T/O Minima 2ENG : RVR 1,500m / VIS 1,600m<br>LVO ; Low Visibility Operation RVR 400m미만 (TO시)<br>이륙교체공항이 필요할 경우가 발생할 수 있음<\/td>\n<\/tr>\n<tr>\n<td><strong>S<\/strong><\/td>\n<td>Slippery Wet Runway<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s06-04", "ch": 6, "num": "6.4", "title": "Rolling T/O", "pages": [27], "merged": false, "html": "<ul>\n<li>기본적으로 Rolling T/O 추천<\/li>\n<li>Engine Stabilized 되는 동안 바퀴가 움직이고 있으면서 T/O — Line up and wait일 경우에도 가능<\/li>\n<\/ul>\n<p><strong>장점<\/strong>\n- 승객 편함\n- FOD 위험성 감소 → 정지상태 추력을 올리면 Damage 가능\n- Tail wind, Cross wind로 부터 Engine Surge 혹은 Stall Damage 위험성 감소\n- Expedite T/O 가능 — Takeoff Roll Distance 감소(X)<\/p>"}, {"id": "s06-05", "ch": 6, "num": "6.5", "title": "Turning Departure (에프FOM 341p)", "pages": [20], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>SID<\/th>\n<th><b class=\"k\">S<\/b>tandard <b class=\"k\">I<\/b>nstrument <b class=\"k\">D<\/b>eparture<\/th>\n<th>SID first waypoint에서 끝남<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>15°이하의 Turn<\/td>\n<td>Straight SID<\/td>\n<td>20km 까지 Turn이 시작도 하지 않았으면<\/td>\n<\/tr>\n<tr>\n<td>15°초과할때<\/td>\n<td>Turning SID<\/td>\n<td>10km 이내에서 Turn이 <b class=\"k\">완료<\/b>되어야 함.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong><mark>400ft<\/mark> 이상에서 Turning<\/strong> — 400ft 전에서 Turn 할 수 있는 경우\n1. ATC 지시가 있을 경우\n2. Departure Procedure 명시되어 있을 경우\n3. Engine out 절차로 요구되는 경우<\/p>"}, {"id": "s06-06", "ch": 6, "num": "6.6", "title": "SID Climb Gradient", "pages": [27], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>구분<\/th>\n<th>%<\/th>\n<th>ft/NM<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Climb Gradient<\/td>\n<td>3.3%<\/td>\n<td>200ft/NM<\/td>\n<td>0.8% margin<\/td>\n<\/tr>\n<tr>\n<td>Obstacle Clearance<\/td>\n<td>2.5%<\/td>\n<td>152ft/NM<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>1NM = 6,076ft → 200/6076 = 1/30<\/li>\n<li>Chart minimum climb gradient — GS Ground Speed<\/li>\n<\/ul>"}, {"id": "s06-07", "ch": 6, "num": "6.7", "title": "Noise Abatement Departure Procedure (NADP1 / NADP2)", "pages": [30], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>NADP1 — <b class=\"k\">근거리 소음감소<\/b> / <b class=\"k\">Work Load 감소<\/b> / 복잡한 공항 / 시간여유있을 때<\/th>\n<th>Altitude<\/th>\n<th>Thrust<\/th>\n<th>Speed<\/th>\n<th>Flap/Slat<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>이륙<\/td>\n<td>SFC<\/td>\n<td><b class=\"k\">T/O Thrust<\/b> 이륙<\/td>\n<td><b class=\"k\">V2 + 10 to 20kt<\/b><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Thrust Reduction<\/td>\n<td>최소 800ft (댄공1,500ft)<\/td>\n<td>Climb Thrust Reduction<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>증속 · Clean-up<\/td>\n<td>3,000ft<\/td>\n<td><b class=\"k\">Clean-up<\/b><\/td>\n<td>En-route Climb speed — 증속 후 스케줄에 따라<\/td>\n<td>Flap/slat Retract<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>→ NADP1은 근거리 소음감소에 효과적인 절차로서, Work Load 감소에 효과적이다.\n초기에 <b class=\"k\">T/O Thrust<\/b>로 이륙해서 <b class=\"k\">V2 + 10 to 20kt<\/b>를 3,000ft AFE 까지 유지한다. (minimum V2+10kt)\n그 사이에 1,500ft(<b class=\"k\">Minimum 800ft AFE<\/b> 이상)에서 <b class=\"k\">Climb Thrust<\/b>로 Reduction을 해주고 (Aero-K 1,000ft) <b class=\"k\">V2 + 10 to 20kt 유지<\/b>\n3,000ft에서 Normal <b class=\"k\">En-route Climb Speed<\/b>로 <b class=\"k\">증속<\/b>하면서 스케줄에 따라 Flap과 Slat을 Retraction 하는 절차이다.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>NADP2 — <b class=\"k\">원거리 소음감소<\/b> / <b class=\"k\">Fuel Efficient<\/b> / 초기상승 안 좋지만 장기적 상승 좋음<\/th>\n<th>Altitude<\/th>\n<th>Thrust<\/th>\n<th>Speed<\/th>\n<th>Flap/Slat<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>이륙<\/td>\n<td>SFC<\/td>\n<td><b class=\"k\">T/O Thrust<\/b> 이륙<\/td>\n<td><b class=\"k\">V2 + 10 to 20kt 유지<\/b><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Clean-up<\/td>\n<td>최소 800ft (댄공1,500ft)<\/td>\n<td><b class=\"k\">Clean-up<\/b><\/td>\n<td>Vzf 증속후 →<\/td>\n<td>For Flap/slat Retract<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>증속후 Flap/slat Retract →<\/td>\n<td>Thrust Reduction<\/td>\n<td>V2 + 10 to 20kt 유지<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>3,000ft<\/td>\n<td><\/td>\n<td>En-route Climb speed<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>→ NADP2는 원거리 소음감소에 효과적인 절차로서 연료 효율적입니다. (Clean up 시점이 빠르기 때문에 장기 상승률 좋음)\n초기에 <b class=\"k\">T/O Thrust<\/b>로 이륙해서 <b class=\"k\">V2 + 10 to 20kt<\/b>를 1,000ft( <b class=\"k\">Minimum 800ft AFE<\/b> )까지 유지한다.\n1,000ft(<b class=\"k\">800ft 이상<\/b>)에서 <b class=\"k\">Vzf (+10 to 20kt)<\/b>으로 <b class=\"k\">증속<\/b>하면서 스케줄에 따라 Flap과 Slat을 Retract하고 첫번째 Retract 이후 Thrust Reduction이 가능합니다. (<b class=\"k\">현실적으로는 정해진 고도 1,000ft에서 Thrust Reduction<\/b>)\n( Initiation of first Flaps / Slats Retraction부터 Climb Thrust Reduction 할 수 있다)\n3,000ft 까지는 <b class=\"k\">Vzf + 10 to 20kt<\/b> 유지하고, 3,000ft에서 Normal En-route Climb Speed로 증속한다.<\/p>\n<ul>\n<li>※ 증속시키는 이유는 Flap/Slat Retract<\/li>\n<li>※ Flap/Slat retract한 이후에 Thrust Reduction 할 수 있음<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>※ 소음감소의 본질적인 이유<\/th>\n<th><mark><b class=\"k\">증속 시점<\/b><\/mark><\/th>\n<th><mark><b class=\"k\">Clean up<\/b><\/mark><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>NADP1<\/td>\n<td>3,000ft<\/td>\n<td>증속을 위해서 기수를 Down<\/td>\n<td>초기 상승률 좋으나, 늦게 Clean up<\/td>\n<\/tr>\n<tr>\n<td>NADP2<\/td>\n<td>Minimum 800ft<\/td>\n<td>일찍 증속 → Clean up<\/td>\n<td>장기적 상승률 좋음<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td>Clean up → Drag 감소 → Rate of Climb 증가<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s06-08", "ch": 6, "num": "6.8", "title": "IFR 최저안전고도 (Jepp 984p)", "pages": [17], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>기준<\/th>\n<th>범위<\/th>\n<th>비산악<\/th>\n<th>산악<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>FAA<\/strong><\/td>\n<td>좌우 4NM<\/td>\n<td>1,000ft<\/td>\n<td>2,000ft<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>ICAO<\/strong> 시계비행<\/td>\n<td>항공기 반경 600m<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>가장 높은 장애물<\/td>\n<td>300m<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>지면, 수면, 장애물<\/td>\n<td>150m<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>ICAO En-route<\/strong><\/td>\n<td>좌우 8km<\/td>\n<td>300m (1,000ft)<\/td>\n<td>450m<\/td>\n<td>10nm 지날 동안 필드고도변화 900m<b class=\"k\">초과<\/b>~1,500m <b class=\"k\">이하<\/b> — 덜 심한 산악지형 (3,000~5,000ft 사이)<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td>600m (2,000ft)<\/td>\n<td>10nm 지날 동안 필드고도변화 <b class=\"k\">1,500m 초과시<\/b> — 더 심한 산악지형 (5,000ft 초과시)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>ICAO 접근 구간 MOC<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Initial Approach Segment<\/td>\n<td>300m<\/td>\n<\/tr>\n<tr>\n<td>Intermediate Segment<\/td>\n<td>150m<\/td>\n<\/tr>\n<tr>\n<td>비정밀접근 Final Approach Fix 있는 경우<\/td>\n<td>75m<\/td>\n<\/tr>\n<tr>\n<td>비정밀접근 Final Approach Fix 없는 경우<\/td>\n<td>90m<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>Man-made (지형지물) = <strong>Obstacles<\/strong> / 지형 = <strong>Terrain<\/strong><\/li>\n<li>*Mountainous Area : 10nm 지날 동안 Terrain Elevation의 변화<\/li>\n<li>*Primary Area : Total width의 절반을 차지하는 중심부 / Primary Area에서 Obstacle Clearance를 제공함<\/li>\n<li>항공기가 <b class=\"k\">95%<\/b>이상을 유지하는 구역(Primary Area) / <b class=\"k\">99.7%<\/b>를 유지하는 고도(Secondary Area)<\/li>\n<\/ul>"}, {"id": "s06-09", "ch": 6, "num": "6.9", "title": "MEA / MVA / MCA / MRA / MOCA / MORA / OROCA", "pages": [17], "merged": false, "html": "<p><strong>MOCA는 위의 MOC를 보장해주는 고도<\/strong> — Obstacle 보장해주며, ~~NAV Signal~~(X) / <mark><b class=\"k\">VOR<\/b><\/mark>로 부터 <b class=\"k\">22nm<\/b>반경 이내에서 Signal 보장<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>고도<\/th>\n<th>정의<\/th>\n<th>기준<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>MEA<\/strong><\/td>\n<td><b class=\"k\">NAV aid<\/b> Signal + <b class=\"k\">ATS<\/b> Communication + <b class=\"k\">Obstruction Clearance<\/b><\/td>\n<td>전구간 보장<\/td>\n<\/tr>\n<tr>\n<td><strong>MVA<\/strong><\/td>\n<td>ATC의해 사용<\/td>\n<td>비산악지형 1,000ft / 산악지형 2,000ft<\/td>\n<\/tr>\n<tr>\n<td><strong>MCA<\/strong><\/td>\n<td>더 <b class=\"k\">높은<\/b> MEA 진행할 때 Crossing Altitude<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>MRA<\/strong><\/td>\n<td>2개 이상의 NAV aid<b class=\"k\">s<\/b> signal 수신가능 최저고도<\/td>\n<td><b class=\"k\">Intersection<\/b>을 정의하기 위한 최저고도<\/td>\n<\/tr>\n<tr>\n<td><strong>MOCA<\/strong> (모카<strong>T<\/strong>)<\/td>\n<td>Minimum Obstacle Clearance Altitude<\/td>\n<td>1,000ft (5,000ft이하) / 2,000ft (5,000ft <b class=\"k\">MSL<\/b> 초과)<\/td>\n<\/tr>\n<tr>\n<td><strong>MORA<\/strong> (모라<strong>A<\/strong>)<\/td>\n<td>Minimum Off-Route Altitude<\/td>\n<td>1,000ft / 2,000ft — <b class=\"k\">좌우 10NM 보장<\/b><\/td>\n<\/tr>\n<tr>\n<td>Grid MORA<\/td>\n<td>위도1 / 경도1 가장 높은 장애물로부터 고도<\/td>\n<td>1,000ft (5,000ft 이하) / 2,000ft (5,000ft <b class=\"k\">MSL<\/b> 초과)<\/td>\n<\/tr>\n<tr>\n<td><strong>OROCA<\/strong> (AIM)<\/td>\n<td>Off Route Obstacle Clearance Area<\/td>\n<td>1,000ft (비산악) / 2,000ft (산악) – MORA와 유사함<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>MORA 상세<\/strong> (Minimum OFF Route Altitude)<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>구분<\/th>\n<th>차트 표기<\/th>\n<th>내용<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>MORA<\/strong><\/td>\n<td>@1,000<\/td>\n<td>좌우 각각 10NM이내 Obstacle Clearance 보장 / 1,000ft / 2,000ft(Terrain 5,000ft MSL 초과시)<\/td>\n<\/tr>\n<tr>\n<td><strong>Grid MORA<\/strong><\/td>\n<td>77 120 — Green / Maroon (두자리 / 세자리)<\/td>\n<td>위도/경도 각 1°의 격자구역에서 가장 높은 장애물로부터 Obstacle Clearance 보장 / 1,000ft / 2,000ft(Terrain 5,000ft MSL 초과시)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<blockquote>\n<p>*차트에 표기된 고도는 모두 MSL이다.<\/p>\n<\/blockquote>"}, {"id": "s06-10", "ch": 6, "num": "6.10", "title": "MSA (Minimum Safe Altitude) / TAA / CAVOK", "pages": [17], "merged": false, "html": "<ul>\n<li>최대 <b class=\"k\">4개 Sector<\/b> (각 섹터 최소 90°)로 나눌 수 있음<\/li>\n<li>각 <b class=\"k\">Sector<\/b>의 MSA는 Minimum Sector Altitude (ICAO)<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th>내용<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>SID/STAR Chart<\/td>\n<td>Plan view 확인가능 (위에서 본) <strong>MSA<\/strong> / Approach Chart 따로 표시<br>Airport Reference Point / NAVAID / Fix 가능<\/td>\n<\/tr>\n<tr>\n<td>Significant Cloud<\/td>\n<td>운항 상 중요한 구름 — 5,000ft or 가장 높은 MSA(각 sector마다 MSA존재) 둘 중 더 높은 고도 아래 Cloud Base가 있는 구름 / <b class=\"k\">운저 관계없이 CB / TCU<\/b><\/td>\n<\/tr>\n<tr>\n<td><strong>MSA<\/strong> (복잡한 공항)<\/td>\n<td><b class=\"k\">1,000ft Obstacle Clearance 보장하지만, NAV aid signal 보장 X<\/b><br>Airport Reference 기준으로 설정되기도 하기 때문에<\/td>\n<\/tr>\n<tr>\n<td><strong>TAA<\/strong> (한가한 공항)<\/td>\n<td><b class=\"k\">Terminal Arrival Altitude<\/b><br>IAF or IF 중심을 기준으로 반경 25NM 이내, 1,000ft Obstacle Clearance 보장<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>CAVOK<\/strong>\n1. <strong>운항상 중요한 구름<\/strong> 없어야 함\n2. 시정이 <strong>10km<\/strong> 이상\n3. <strong>중요 일기 현상<\/strong>이 없어야 함<\/p>"}, {"id": "s06-11", "ch": 6, "num": "6.11", "title": "고도 (QFE / QNE / QNH, 고도의 종류)", "pages": [20], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>무엇을 세팅해서<\/th>\n<th>어떤 고도를 얻는지<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>QFE<\/strong><\/td>\n<td>FE 부터의 고도<\/td>\n<td>고도계 높은 값을 세팅하면 고도는 높아진다 / 착륙시 0ft<\/td>\n<\/tr>\n<tr>\n<td><strong>QNE<\/strong><\/td>\n<td>ISA MSL 부터의 고도<\/td>\n<td>29.92inHg / 1,013.25hPa / 29.92 세팅시 PA표시하는 세팅방법<\/td>\n<\/tr>\n<tr>\n<td><strong>QNH<\/strong><\/td>\n<td>Local MSL 부터의 고도<\/td>\n<td>1hpa = 27ft(30ft) / 착륙시 공항표고를 표시하는 세팅방법 / 1 inHg = 920ft(1,000ft)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>ex. 992hpa vs 29.92inHg : 1,013.25 - 992 = 21.25hpa x 27ft = 573.75ft<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>고도<\/th>\n<th>정의 / 공식<\/th>\n<th>비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>True ALT<\/strong><\/td>\n<td>IALT 대비 ISA 기준 1° 낮을 때마다 → 0.4% 낮음 / 실제 항공기 위치한 고도<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Indicated ALT<\/strong><\/td>\n<td>Ex. 8000ft (ISA Temp. -1°) / OAT -11° / 10° 낮으니깐 4%낮음 / 실제고도 7,680ft<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Pressure ALT<\/strong><\/td>\n<td>FE + 1,000ft(29.92 - QNH) / FE + 30(27)ft(1013.25 - QNH)<\/td>\n<td>현재 기압이 높다면, PA 낮아진다 → 퍼포먼스 좋아진다<\/td>\n<\/tr>\n<tr>\n<td><strong>Density ALT<\/strong><\/td>\n<td>PA + 120(OAT – ISAT)<\/td>\n<td>Non-standard Temperature (현재온도) 반영 / *OAT 높아질수록 DA 증가 / 퍼포먼스 안 좋아짐<\/td>\n<\/tr>\n<tr>\n<td><strong>Absolute ALT<\/strong><\/td>\n<td>AGL<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s06-12", "ch": 6, "num": "6.12", "title": "Transition Layer (Jepp 1075)", "pages": [20], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>구분<\/th>\n<th>한국 기준<\/th>\n<th><\/th>\n<th>사용<\/th>\n<th>표시고도<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Transition Level<\/td>\n<td>FL140<\/td>\n<td>QNE<\/td>\n<td>내려갈 때 여기에서<\/td>\n<td>29.92 setting시 표시고도<\/td>\n<\/tr>\n<tr>\n<td>Transition layer<\/td>\n<td>약 300m<\/td>\n<td>1,000ft<\/td>\n<td>국가별 상이<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Transition Altitude<\/td>\n<td>14,000ft<\/td>\n<td>QNH<\/td>\n<td>올라갈 때 여기에서<\/td>\n<td>QNH setting시 표시고도<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s06-13", "ch": 6, "num": "6.13", "title": "저고도 온도보정 — Cold Temperature Corrections (댄공FOM 222p)", "pages": [20], "merged": false, "html": "<blockquote>\n<p>*실행시, Table을 바탕으로 Approach Chart에 명시된 고도보다 더 높여서 ATC에 통보하여야 한다.<\/p>\n<\/blockquote>\n<ul>\n<li>기온 하강 / 기압 하강 → 실제 고도 더 낮아 위험함 → 충분한 MOC 확보 필요<\/li>\n<li><strong>Chart 고도 + 온도보정 고도<\/strong><\/li>\n<li>Chart 고도 – FE 고도 = XXX ft (From HAT) → Table 가로(고도)-세로(온도) 값을 Match 시켜 값(고도)를 더한다.<\/li>\n<li><strong>ROC<\/strong>(Required Obstacle Clearance) : ex. Procedure Turn, IA Segment, IAF to FAF, FAF to MAP, Circling 등 구간별로 보정해주어야 한다. / IAF ~ MAP 까지 Correction 해줘야 함<\/li>\n<li>TA는 IA보다 낮다. — ISA 기준 1° 낮을 때마다 → 0.4% 낮음(4ft/1,000ft) / H → L / T low<\/li>\n<li>DA = PA + 120(OAT – ISAT) — Warm → DA 높다<\/li>\n<li>PA = FE + 1,000ft(29.92 - QNH)<\/li>\n<\/ul>"}, {"id": "s06-14", "ch": 6, "num": "6.14", "title": "Approach Chart Index Number (Jeppesen)", "pages": [17], "merged": false, "html": "<div class=\"figs\"><figure><img src=\"img/i-019-004.webp\" alt=\"Jeppesen 차트 헤더 — Index Number 46-1\" loading=\"lazy\"><figcaption>Jeppesen 차트 헤더 — Index Number 46-1<\/figcaption><\/figure><\/div>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Index <strong>46-1<\/strong><\/th>\n<th>의미<\/th>\n<th>Approach Type 번호<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>4<\/strong><\/td>\n<td>그 도시의 4번째 공항<\/td>\n<td>1<\/td>\n<td>ILS(LOC)<\/td>\n<\/tr>\n<tr>\n<td><strong>6<\/strong><\/td>\n<td>Approach Type<\/td>\n<td>2<\/td>\n<td>RNP<\/td>\n<\/tr>\n<tr>\n<td><strong>1<\/strong><\/td>\n<td>위 Type의 몇 번째<\/td>\n<td>3<\/td>\n<td>VOR<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td>9<\/td>\n<td>Visual<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>차트 브리핑 순서 — <b class=\"k\">H CAM / PP C ICON M<\/b><\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>항목<\/th>\n<th>내용<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>H<\/strong><\/td>\n<td><b class=\"k\">H<\/b>eading<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>C<\/strong><\/td>\n<td><b class=\"k\">C<\/b>ommunication<\/td>\n<td>주파수 사용하는 순서<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>A<\/strong><\/td>\n<td><b class=\"k\">A<\/b>pp Briefing<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>M<\/strong><\/td>\n<td><b class=\"k\">MSA<\/b><\/td>\n<td>MSA – <b class=\"k\">Bearing<\/b><\/td>\n<td>RWY Elevation / 1hpa = 약 27ft<\/td>\n<\/tr>\n<tr>\n<td><strong>P<\/strong><\/td>\n<td><b class=\"k\">P<\/b>lan<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>P<\/strong><\/td>\n<td><b class=\"k\">P<\/b>rofile<\/td>\n<td>Obstacle 표시<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>C<\/strong><\/td>\n<td><b class=\"k\">C<\/b>onversions Table<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>ICON<\/strong><\/td>\n<td><b class=\"k\">ICON<\/b><\/td>\n<td>Airport Chart 50ft 이상 / Approach Chart <b class=\"k\">400ft<\/b> 이상<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>M<\/strong><\/td>\n<td><b class=\"k\">M<\/b>inimum<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"figs\"><figure><img src=\"img/i-019-003.webp\" alt=\"Jeppesen Approach Chart 예시 — RKSI ILS Z or LOC Z Rwy 15L (21-1)\" loading=\"lazy\"><figcaption>Jeppesen Approach Chart 예시 — RKSI ILS Z or LOC Z Rwy 15L (21-1)<\/figcaption><\/figure><\/div>"}, {"id": "s06-15", "ch": 6, "num": "6.15", "title": "Approach Segment (IAF → IF → FAF → MAP)", "pages": [32], "merged": false, "html": "<p>Ex) MOC 300m — Primary 95% 유지 / Secondary 99.7% 유지 점점 to zero<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Fix / 구간<\/th>\n<th>내용<\/th>\n<th>MOC<\/th>\n<th>목적<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>IAF<\/strong> (Initial Approach Fix)<\/td>\n<td>Maximum Angle of Interception TO IAF : 90°(precision) ~ 120°(non-precision)<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>↓ Initial Approach Segment<\/td>\n<td><\/td>\n<td>MOC 300m<\/td>\n<td>En-route 에서 IF로 Maneuvering 하기 위한 구간<\/td>\n<\/tr>\n<tr>\n<td><strong>IF<\/strong><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>↓ Intermediate Approach Segment<\/td>\n<td><\/td>\n<td>MOC 150m<\/td>\n<td>Speed and Configuration Adjustment<\/td>\n<\/tr>\n<tr>\n<td><strong>FAF<\/strong><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>↓ Final Approach Segment<\/td>\n<td><\/td>\n<td><\/td>\n<td>Alignment and Descent for Landing<\/td>\n<\/tr>\n<tr>\n<td><strong>MAP<\/strong> (Missed Approach Point)<\/td>\n<td>JEPP 1015p — Missed Approach Segment Climb Gradient 2.5% (152ft/NM)<\/td>\n<td><\/td>\n<td>3.3% = 200ft/NM<\/td>\n<\/tr>\n<tr>\n<td>↓ Initial Phase<\/td>\n<td>Missed Approach Point ~ Start of Climb<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>SOC<\/strong> (Start of Climb)<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>↓ Intermediate Phase<\/td>\n<td>Start of Climb ~ 50m Obstacle Clearance 보장될 때까지<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>50m Obstacle Clearance<\/strong><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>↓ Final Phase<\/td>\n<td>50m Obstacle Clearance ~ End of Missed Approach<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>End of Missed App<\/strong><\/td>\n<td>For new Approach, Holding, Return to en-route<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s06-16", "ch": 6, "num": "6.16", "title": "Final Approach Fix / FAP / VDP", "pages": [83], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>기호<\/th>\n<th><\/th>\n<th>의미<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Maltese Cross Symbol ✠<\/td>\n<td>FAA<\/td>\n<td><b class=\"k\">Non-precision Approach FAF<\/b><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Lightning Bolt ϟ<\/td>\n<td>ICAO — Feather 시작점<\/td>\n<td><b class=\"k\">Precision Approach FAF<\/b><\/td>\n<td><b class=\"k\">Final Approach Point<\/b><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td>정밀접근<\/td>\n<td>Glide <b class=\"k\">Slope Intercept<\/b> 지점<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td>APV<\/td>\n<td>Glide <b class=\"k\">Path Intercept<\/b> 지점<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>용어<\/th>\n<th>의미<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong><b class=\"k\">Final Approach Point<\/b><\/strong><\/td>\n<td>Course Reversal — Procedure Turn이 필요할 때<\/td>\n<td>FAF 없을 때<\/td>\n<\/tr>\n<tr>\n<td><strong><b class=\"k\">VDP<\/b><\/strong><\/td>\n<td>Visual Descent Point — Step down 시<\/td>\n<td>하강 시작해야 하는 지점<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s06-17", "ch": 6, "num": "6.17", "title": "HAA / MDA / DH / HAT (JEPP 85p)", "pages": [32], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>용어<\/th>\n<th>정의<\/th>\n<th>비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>HAA<\/strong><\/td>\n<td>Height Above Airport(Aerodrome) — 활주로 중 가장 높은 지점에서의 고도<\/td>\n<td>Circling minimum MDH — Circling 은 무조건 Airport<\/td>\n<\/tr>\n<tr>\n<td><strong>MDA(MSL)<\/strong><\/td>\n<td>시각참조물 없이 하강 못하도록 지정된 고도<\/td>\n<td>CDFA 제외 비정밀 / CDFA → DDA<\/td>\n<\/tr>\n<tr>\n<td><strong>MDH<\/strong><\/td>\n<td>Airport Elevation or Threshold elevation 기준<\/td>\n<td>Threshold Elev. 가 Airport Elev. 보다 2m(7ft) 초과해서 낮을 때 Threshold 기준<\/td>\n<\/tr>\n<tr>\n<td><strong>DH<\/strong><\/td>\n<td>결심고도 — 정밀(또는 APV) Continue Approach or Go-Around 할지 결심하는 최저고도<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>HAT<\/strong><\/td>\n<td>Height Above Threshold — Straight in (non-precision)<\/td>\n<td>ICAO<\/td>\n<\/tr>\n<tr>\n<td><strong>HAT<\/strong><\/td>\n<td>Height Above Touchdown — Straight in minimum (M)DH / 3000ft에서 가장 높은 Touchdown zone<\/td>\n<td>미국 기준<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s06-18", "ch": 6, "num": "6.18", "title": "CAT2 Approach / 정밀접근 CAT별 최저치 (댄공FOM-WX minima P.186)", "pages": [20], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>CAT<\/th>\n<th>RVR 요구<\/th>\n<th><\/th>\n<th><\/th>\n<th>비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>CAT1<\/td>\n<td>TDZ RVR<\/td>\n<td>MID RVR<\/td>\n<td>END RVR<\/td>\n<td>Use MID if TDZ inoperative<\/td>\n<\/tr>\n<tr>\n<td>CAT2<\/td>\n<td>TDZ RVR (<strong>필수<\/strong>)<\/td>\n<td>MID RVR<\/td>\n<td>END RVR<\/td>\n<td>둘 중 하나만 보고되고 있을 때, 하나만 만족 시 충족되는 걸로 간주<br>둘 다 보고되고 있을 때, 모두 만족해야함(즉, 셋 다 만족해야 함)<\/td>\n<\/tr>\n<tr>\n<td>CAT3<\/td>\n<td>TDZ RVR<\/td>\n<td>MID RVR<\/td>\n<td>END RVR<\/td>\n<td>Far-end RVR : 활주로 긴 경우<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>결심고도<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>CAT<\/th>\n<th>ICAO DH 이상-미만<\/th>\n<th>ICAO RVR<\/th>\n<th>FAA DH<\/th>\n<th>FAA RVR<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>CAT1<\/td>\n<td>60m 이상<\/td>\n<td>550m 이상<\/td>\n<td>200ft 이상<\/td>\n<td>2400ft 이상<\/td>\n<td>항공기 A/P or HUD or FD → 1800ft : 활주로 CL &amp; TDZL<\/td>\n<\/tr>\n<tr>\n<td>CAT2<\/td>\n<td>30-60m<\/td>\n<td>300-550m<\/td>\n<td>100-200ft미만<\/td>\n<td>1200ft 이상<\/td>\n<td>→ 1000ft : HUD or Auto Land 또는 승인받은 경우<\/td>\n<\/tr>\n<tr>\n<td>CAT3 a<\/td>\n<td>No DH / 30m<\/td>\n<td>175-300m<\/td>\n<td>No DH / 100ft<\/td>\n<td>700ft 이상<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>CAT3 b<\/td>\n<td>No DH / 15m<\/td>\n<td>50-175m<\/td>\n<td>No DH / 50ft<\/td>\n<td>150-700ft<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>CAT3 c<\/td>\n<td>No DH<\/td>\n<td>제한 없음<\/td>\n<td>No DH<\/td>\n<td>제한 없음<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Type<\/th>\n<th>정의<\/th>\n<th>해당<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Type A<\/strong> (비정밀)<\/td>\n<td>MDH 또는 DH가 250ft 이상인 접근절차<\/td>\n<td>비정밀(MDH), APV(DH), LOC 3도 이내 offset<br>정밀접근이지만 Type A + CAT1 : LOC 3도 이내 offset<\/td>\n<\/tr>\n<tr>\n<td><strong>Type B<\/strong> (정밀접근)<\/td>\n<td>DH가 250ft 미만일 경우<\/td>\n<td>Type B CAT1 : 200-250ft / SBAS CAT1 (Type A or B) — *Jepp 1014p<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s06-19", "ch": 6, "num": "6.19", "title": "Lighting In-operation (댄공FOM 189p)", "pages": [20], "merged": false, "html": "<ul>\n<li>Facilities 부족하다면, 더 빡센 minimum을 적용하겠다는 의미<\/li>\n<li>단, 다음 조건 충족시 Autopilot or FD or HUD + remain DA(H) → 항공사에서 정한 기준으로 충족을 판단<\/li>\n<li><strong>ALS-out : minimum RVR 1,200m<\/strong><\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Lighting Facilities<\/th>\n<th>CAT 1 ILS minima<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Full Facilities<\/td>\n<td>RVR 550m (1,800ft)<\/td>\n<td>VIS 800m(1/2SM)<\/td>\n<\/tr>\n<tr>\n<td>TDZ or CL inop. or not installed<\/td>\n<td>RVR 750m (2,400ft)<\/td>\n<td>VIS 800m(1/2SM)<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>RVR 550m<\/td>\n<td>Auto-Pilot or FD or HUD 하나라도 있으면<\/td>\n<\/tr>\n<tr>\n<td>ALS inop.<\/td>\n<td>RVR 1,200m (4,000ft)<\/td>\n<td>VIS 1,200m(3/4SM)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s06-20", "ch": 6, "num": "6.20", "title": "Approach Ban (댄공 FOM 413p)", "pages": [37], "merged": false, "html": "<blockquote>\n<p><strong>구술용<\/strong>\n“국가마다 기준이 다르지만, 운항기술기준으로 설명드리겠습니다. / 해당 국가의 규정을 숙지해야 함\n보고된 기상치가 착륙최저치 미만일 경우, 최종접근구간을 통과하거나 1,000ft AFE(HAT) 이하로 강하를 금지 절차\n그 지점에서 Go-Around 해야한다.(핵심) (Beginning of the Final Approach Segment)\n(이미 강하한 경우) 지난 이후 기상이 악화될 경우, DH(MDH) 즉 MAP까지 접근을 계속 할 수 있다(두번째 디시전)\n※ 활주로 표면상태의 정보가 안전하게 착륙할 수 없다면 1,000ft미만으로 접근하면 안된다\n1,2,3번이 만족된다면 Continue Approach 할 수 있다.\n1. Flight visibility / 2. 정상적인 강하위치 / 3. 시각참조물(PARRTT)\n충족되지 않을 경우 그때 Go-Around”<\/p>\n<\/blockquote>\n<ul>\n<li>보고된 기상치가 착륙최저치 미만일 경우 — 최종접근구간 시작시점에서 Approach 자체를 미리 금지<\/li>\n<li>DH(MDH)가 1,000ft 초과일 경우가 있음 → Decision point 2개가 됨 / 국가별 상이함<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>국내항공법 (운항기술기준)<\/th>\n<th>조건<\/th>\n<th>조치<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Beginning of FA Segment 진입전<\/td>\n<td>보고된 기상이 착륙최저치 미만일 경우<\/td>\n<td>Go Around<\/td>\n<\/tr>\n<tr>\n<td>기상이 나빠져도 DA, MDA까지 갈 수 있다.<\/td>\n<td>보고된 기상이 착륙최저치 미만일 경우<\/td>\n<td>Go Around<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>1,2,3 모두 만족하면 continue approach 할 수 있다.<\/strong> (CAT1 모두 만족해야함)\n1. Flight visibility(비행시정) Approach L/D minima 이상\n2. 정상적인 강하 위치\n3. 시각참조물을 볼 수 있어야 함 — PARRTT<\/p>\n<p><strong>CAT2,3<\/strong> : 2,3 중 하나만 만족하면 됨 / ATT는 참고해야함 — 2. 정상적인 강하 / 3. 시각참조물(ATT) — CAT2,3의 경우 Red series 100ft는 적용됨<\/p>\n<ul>\n<li>※댄공FOM : Decision point 1. 계기접근의 시점 / 2. Beginning of FAS 시점 or 1,000ft AFE / 3. DA(MDA)<\/li>\n<li>※JEPP : EASA규정 / PIC 계기접근 시작해도 됨 / 1. FAF 진입시점 또는 DA(MDA) 1,000ft 초과일때 1,000ft<\/li>\n<\/ul>"}, {"id": "s06-21", "ch": 6, "num": "6.21", "title": "시각참조물 PARRTT", "pages": [37], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>시각참조물<\/th>\n<th>내용<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>P<\/strong><\/td>\n<td>PAPI / VASI<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>A<\/strong><\/td>\n<td>ALS<\/td>\n<td>CAT2 : ALSF2 → SSALR(기상조건이 좋으면) — ▲ Sequenced Flashing light<\/td>\n<\/tr>\n<tr>\n<td><strong>R<\/strong><\/td>\n<td>REIL<\/td>\n<td>Runway End Identifier Light — 주변 불빛보다 더 빠르게 확인하기 위한 항공 등화<\/td>\n<\/tr>\n<tr>\n<td><strong>R<\/strong><\/td>\n<td>Runway<\/td>\n<td>Runway / Runway light / Runway Marking<\/td>\n<\/tr>\n<tr>\n<td><strong>T<\/strong><\/td>\n<td>Threshold<\/td>\n<td>Threshold / Threshold light / Threshold Marking<\/td>\n<\/tr>\n<tr>\n<td><strong>T<\/strong><\/td>\n<td>Touchdown<\/td>\n<td>Touchdown zone / Touchdown zone light / Touchdown zone Marking<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>용어<\/th>\n<th>의미<\/th>\n<th>비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>ALSF2 (알스F2)<\/td>\n<td>Approach Light system with Sequenced Flashing Lights<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>SSALR (쌀알)<\/td>\n<td>Simplified Short Approach Light System RAIL (Runway Alignment Indicator Light)<\/td>\n<td>더 짧음<\/td>\n<\/tr>\n<tr>\n<td>Red side row light<\/td>\n<td>붉은색 측면등<\/td>\n<td>이거 안보이면 100ft(30m) 미만으로 내려갈 수 없음<\/td>\n<\/tr>\n<tr>\n<td>Red Terminating light<\/td>\n<td>붉은색 최종진입등<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>CAT 2,3 시각참조물 : ATT<\/strong><\/td>\n<td>A(위의 Red형제) 와 TT<\/td>\n<td>오직 TT안보이고 ALS만 보인다면, Red 형제 보여야 100ft 아래 가능<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s06-22", "ch": 6, "num": "6.22", "title": "Stabilized Approach (안정적 접근) Criteria — LLAST M", "pages": [17], "merged": false, "html": "<ul>\n<li><strong>Criteria(기준)<\/strong> VMC : 3SM / 1,000ft / Runway in sight<\/li>\n<li>Before IMC (1,000ft HAT) / VMC (500ft HAT) 미만에서 Stabilized 아니라면 → <strong>Go around<\/strong><\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>기준<\/th>\n<th>비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>L<\/strong><\/td>\n<td>Landing Briefing / Configuration / Checklist 완료<\/td>\n<td>IMC (1,000ft HAT) / VMC (500ft HAT) 전<\/td>\n<\/tr>\n<tr>\n<td><strong>L<\/strong><\/td>\n<td>올바른 Lateral / Vertical Flight path 상 in Trim 상태 위치<\/td>\n<td>ILS경우, 1dot이내<\/td>\n<\/tr>\n<tr>\n<td><strong>A<\/strong><\/td>\n<td>Target Airspeed in tolerance 이내 유지 / 올바른 Power set<br>Windshear 경우, thrust 다를 수 있음<\/td>\n<td>Min Vref -5kt / Max Vref +10kt (FCTM 44page, B737기준)<\/td>\n<\/tr>\n<tr>\n<td><strong>S<\/strong><\/td>\n<td>Sink rate 1,000fpm 미만 유지<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>T<\/strong><\/td>\n<td>Touchdown zone or Runway 1/3 적은 길이 이내 접지<\/td>\n<td>Vref + HWC/2 + Gust factor (HWC = Head wind Component)<\/td>\n<\/tr>\n<tr>\n<td><strong>M<\/strong><\/td>\n<td>Maneuvering이 필요한 경우 — 즉, Circling시 300ft 전에는 RWY alignment 완료되어야 함<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>AS<\/strong> (Airspeed / Sink-rate) : Momentary Deviation 경우 → 지속적이지만 않다면, Correcting 가능<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>구분<\/th>\n<th>특성<\/th>\n<th>결과<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Jet Plane<\/td>\n<td>Thrust 반응속도 느림 / Imminent(즉각적인) lack of lift<\/td>\n<td>→ Stall 회복이 더 어렵다.<\/td>\n<\/tr>\n<tr>\n<td>Prop<\/td>\n<td>Relative wind의 즉각적 Lift<\/td>\n<td>Power up → CAOA도 증가<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s06-23", "ch": 6, "num": "6.23", "title": "CFIT / CDFA", "pages": [32], "merged": false, "html": "<p><strong>CFIT — Controlled Flight Into Terrain<\/strong> : 조종사의 실수로 Obstacle or Terrain Contact — 예방장비 <strong>GPWS<\/strong>\n- un-stabilized Approach 때문에 많이 발생\n- 예방하기 위해 CDFA 가 도입됨 — non-precision에서 un-stabilized를 하지 않기 위해서<\/p>\n<p><strong>CDFA — Continuous Descent Final Approach<\/strong>\n- “non-precision의 Final Approach Segment에서 적용할 수 있는 CFIT 예방 테크닉” — 비정밀 접근의 Final Approach Segment에서 Continue Descent할 수 있는 테크닉 (Step down이 아닌)\n- FAS 혹은 그 이전부터 50ft 또는 Flare 시작되는 지점까지 쓸 수 있는 테크닉\n- <strong>DDA(Derived DA)<\/strong> : MDA 아래 비행 대비하여 MDA 이상 설정 / 보통 MDA/H + 50ft\n  - 차트에 나온 경우 “CDFA” → +50ft 더할 필요없이 그대로 적용\n- <strong>키워드<\/strong> : 비정밀접근 / 최종접근구간 / For Stabilized Approach<\/p>\n<p><strong>장점 — SAC CFIT 예방 (AC참고)<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>장점<\/th>\n<th>비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td>SAC (Stabilized Approach Criteria) / CFIT 예방<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>SA<\/strong><\/td>\n<td>Situation Awareness 증대<\/td>\n<td>Work Load 감소<\/td>\n<\/tr>\n<tr>\n<td><strong>SA<\/strong><\/td>\n<td>Similar Approach<\/td>\n<td>정밀접근, APV와 유사<\/td>\n<\/tr>\n<tr>\n<td><strong>N<\/strong><\/td>\n<td>Noise Abatement 효과<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>F<\/strong><\/td>\n<td>Fuel Efficiency 증대<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>R<\/strong><\/td>\n<td>ROC 침범확률 감소<\/td>\n<td>Required Obstacle Clearance<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s06-24", "ch": 6, "num": "6.24", "title": "Straight in Approach", "pages": [20], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Course 차이<\/th>\n<th>구분<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>30° 이하<\/td>\n<td>Straight in Approach<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>30° 초과<\/td>\n<td>Circling Approach<\/td>\n<td>→ Category 바뀌면 → Minimum이 바뀜<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s06-25", "ch": 6, "num": "6.25", "title": "Circling MDA / Circling Approach", "pages": [30], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>기준<\/th>\n<th>명칭<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>TERPS<\/strong><\/td>\n<td><b class=\"k\">TER<\/b>minal <mark>Instrument<\/mark> Procedure<b class=\"k\">S<\/b> / US<\/td>\n<\/tr>\n<tr>\n<td><strong>PANS OPS<\/strong><\/td>\n<td>Procedures for <b class=\"k\">A<\/b>ir <b class=\"k\">N<\/b>avigation <b class=\"k\">S<\/b>ervices <mark>aircraft<\/mark> <b class=\"k\">OP<\/b>eration<b class=\"k\">S<\/b><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Circling 보호구역 반경 (NM)<\/strong> — Straight in은 동일 / Circling 다름<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>TERPS Ⓒ Expand circling Approach<br>(<b class=\"k\">Circling MDA가 1,000 ~ 3,000ft 사이<\/b>)<\/th>\n<th><\/th>\n<th><\/th>\n<th>Original Approach<\/th>\n<th><\/th>\n<th><\/th>\n<th>ICAO 기준<\/th>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>91미만<\/td>\n<td>A<\/td>\n<td>1.3<\/td>\n<td>91미만<\/td>\n<td>A<\/td>\n<td>1.3<\/td>\n<td>100이하<\/td>\n<td>A<\/td>\n<td>1.7<\/td>\n<\/tr>\n<tr>\n<td>121미만<\/td>\n<td>B<\/td>\n<td>1.8<\/td>\n<td>121미만<\/td>\n<td>B<\/td>\n<td>1.5<\/td>\n<td>135이하<\/td>\n<td>B<\/td>\n<td>2.7<\/td>\n<\/tr>\n<tr>\n<td>141미만<\/td>\n<td>C<\/td>\n<td>2.8<\/td>\n<td>141미만<\/td>\n<td>C<\/td>\n<td>1.7<\/td>\n<td><b class=\"k\">180이하<\/b><\/td>\n<td><b class=\"k\">C<\/b><\/td>\n<td><b class=\"k\">4.2<\/b><\/td>\n<\/tr>\n<tr>\n<td><b class=\"k\">166미만<\/b><\/td>\n<td><b class=\"k\">D<\/b><\/td>\n<td><b class=\"k\">3.7<\/b><\/td>\n<td>166미만<\/td>\n<td>D<\/td>\n<td>2.3<\/td>\n<td>205이하<\/td>\n<td>D<\/td>\n<td>5.3<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td>240이하<\/td>\n<td>E<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>Category가 높을 수록 Maneuvering Speed가 빠르니깐 보호구역이 넓어져야 하므로 Radius가 커짐<\/li>\n<\/ul>\n<p><strong>Q. Circling MDA 아래로 내려갈 수 있는 조건?<\/strong>\n- A. Descent Profile을 유지할 수 있을 때 (정상적인 강하 위치에 있을 때)\n- B. 시각참조물 (PARRTT) 필요\n- C. 시각기동 구역 내에 있어야 함 — Visual Maneuvering Area (Obstruction Clearing Area) / 구역내에서 Minimum – Obstruction clear 제공받음<\/p>\n<p><strong>Circling 중 Missed Approach<\/strong> : <b class=\"k\">RWY 방향으로 상승선회<\/b> → MAP <b class=\"k\">Altitude<\/b>까지 → <b class=\"k\">MA Procedure 를 따라간다<\/b>\n- 무조건 Runway H/D을 유지하는 것은 아니며, Missed Approach Procedure를 Follow한다.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Circling Minimum<\/th>\n<th>기준<\/th>\n<th>Straight in Minimum<\/th>\n<th>기준<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><b class=\"k\">HAA Height Above Airport<\/b><\/td>\n<td>Airport<\/td>\n<td>HAT Height Above Threshold<\/td>\n<td>Threshold<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>※ 737기준 Straight in “C” / Circling “D” 속도가 더 높기 때문에<\/li>\n<li><b class=\"k\">FAA기준 Vref / 1.3Vso + MLDW<\/b> — Max LDW + L/D Configuration<\/li>\n<li><b class=\"k\">ICAO기준 Vat<\/b> — 1.3Vso + MLDW / 1.23Vs1g + MLDW + L/D configuration<\/li>\n<li>실제 속도가 빠르면, Category 올릴 수는 있지만, 내릴 수는 없음<\/li>\n<\/ul>"}, {"id": "s06-26", "ch": 6, "num": "6.26", "title": "Contact Approach vs Visual Approach (AIM 429p)", "pages": [17], "merged": false, "html": "<p><strong>공통점<\/strong> : IFR Flight Plan 상 항공기가 사용 / Clear of Cloud / Obstacle Clearance 조종사 책임<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Contact Approach<\/th>\n<th>Visual Approach<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>조종사만 제안<\/strong><\/td>\n<td><strong>둘 다 제안 (조종사/관제사)<\/strong><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>AA (Airport / 전방 Aircraft) 둘 중 하나<\/td>\n<\/tr>\n<tr>\n<td>1SM (Ground/Flight) 보고기상 및 비행시정<\/td>\n<td>1,000ft / 3SM(Ground) 보고된 기상조건<\/td>\n<\/tr>\n<tr>\n<td>Instrument Approach 있는 공항에서만 사용 가능<\/td>\n<td>*관제에서 traffic 계속 물어봄<\/td>\n<\/tr>\n<tr>\n<td>*AA안보이는데 여길 따라가면 공항이 확실하다.<\/td>\n<td>*Work Load 많고, 떠 넘기고 싶을 때<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>*IFR cancel X → VMC상황에서 수행<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>*NAVAID 사용가능하면 적극 사용하라. ex. ILS signal<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<blockquote>\n<p>*CDFA는 Non-precision에서만 사용하는 개념<\/p>\n<\/blockquote>"}, {"id": "s06-27", "ch": 6, "num": "6.27", "title": "CVFP (Charted Visual Flight Procedure)", "pages": [20], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th>내용<\/th>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>CVFP<\/strong><\/td>\n<td><b class=\"k\">C<\/b>harted <b class=\"k\">V<\/b>isual <b class=\"k\">F<\/b>light <b class=\"k\">P<\/b>rocedure<\/td>\n<td>Index No. 09<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>이유<\/td>\n<td>Environmental / Noise consideration<\/td>\n<td><mark>For <b class=\"k\">Turbojet<\/b><\/mark><\/td>\n<td>골짜기 사이로 가는 경우<\/td>\n<\/tr>\n<tr>\n<td>조건<\/td>\n<td><b class=\"k\">Aircraft<\/b><\/td>\n<td>선행항공기<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><b class=\"k\">Landmark<\/b><\/td>\n<td>Prominent Landmarks<\/td>\n<td><b class=\"k\">Night not Visual<\/b> → <b class=\"k\">NOT AUTHORIZED<\/b><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>Operating<\/td>\n<td><b class=\"k\">Control Tower<\/b><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>20NM 안에서 시작<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s06-28", "ch": 6, "num": "6.28", "title": "Simultaneous Independent PRM Approach — Parallel 평행활주로 간격 2,500~4,300ft (AIM 401p)", "pages": [15], "merged": false, "html": "<p><strong>Simultaneous 동시접근<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>구분<\/th>\n<th>활주로 간격<\/th>\n<th>분리<\/th>\n<th>기준<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>동시종속접근 Dependent<\/strong><br>교통량 적을 때 / 인접항공기 봐야함<\/td>\n<td><mark><b class=\"k\">2,500ft ~ 9,000ft<\/b><\/mark><\/td>\n<td>Diagonal Separation<\/td>\n<td>2,500 ~ 3,600ft → Min. <b class=\"k\">1NM<\/b>이상<br>3,600 ~ 8,300ft → Min. <b class=\"k\">1.5NM<\/b>이상<br>8,300 ~ 9,000ft → Min. <b class=\"k\">2NM<\/b>이상<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td>In-trail Separation<\/td>\n<td>활주로 시단으로부터 10NM이내 있는 항공기<br><b class=\"k\">3NM<\/b>(줄어든 경우에도 2.5NM) — 2.5NM : 8,600 ~ 9,000ft<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td>Turning A/C Separation<\/td>\n<td>Vertical <b class=\"k\">1,000ft<\/b> or Lateral <b class=\"k\">3NM<\/b><br>2 Frequency X / NTZ X / final monitor X<\/td>\n<\/tr>\n<tr>\n<td><strong>동시독립접근 Independent<\/strong><br>교통량 많을 때 / 안보고 평행하게 / NTZ 침범시 Break out<\/td>\n<td><mark><b class=\"k\">4,300ft이상<\/b><\/mark><\/td>\n<td><\/td>\n<td>9,000ft까지는 NTZ + final monitor controller 필요 — <b class=\"k\">Widely<\/b><br>9,200ft (공항표고가 5,000ft이상 일때)<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td>Turning A/C Separation<\/td>\n<td>Vertical <b class=\"k\">1,000ft<\/b> or Lateral <b class=\"k\">3NM<\/b> — 30°미만의 Vectoring 받는다<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong><b class=\"k\">P<\/b>recision <b class=\"k\">R<\/b>unway <b class=\"k\">M<\/b>onitor<\/strong> 지상감시시스템<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>구분<\/th>\n<th>활주로 간격<\/th>\n<th>조건 <b class=\"k\">PFACT<\/b><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Independent PRM<\/strong><br><b class=\"k\">2주파수 동시청취<\/b> / 간격이 좁음<\/td>\n<td><mark><b class=\"k\">2,500ft ~ 4,300ft<\/b><\/mark> (3,000 ~ 4,300ft)<\/td>\n<td><mark><strong>P<\/strong><\/mark> PRM system (high update rate PRM Surveillance system)<\/td>\n<td><b class=\"k\">Close Parallel<\/b><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><mark><strong>F<\/strong><\/mark> 2 Frequency 동시청취<\/td>\n<td>Tower &amp; Final monitor controller<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><mark><strong>A<\/strong><\/mark> AAUP (Attention All Users Page)<\/td>\n<td>All breakout – hand flown 즉시<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><mark><strong>C<\/strong><\/mark> Chart 상 PRM title 필요<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><mark><strong>T<\/strong><\/mark> Pilot Training 필요<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>Turning 항공기<\/td>\n<td>Vertical <b class=\"k\">1,000ft<\/b> or Lateral <b class=\"k\">3NM<\/b><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>S<\/strong>imultaneous <strong>O<\/strong>ffset <mark>Instrument Approach<\/mark> / <b class=\"k\">Independent X<\/b><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>구분<\/th>\n<th>활주로 간격<\/th>\n<th>조건<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>SOIA<\/strong> (PRM에 포함)<\/td>\n<td><mark><b class=\"k\">750ft ~ 3,000ft<\/b><\/mark><\/td>\n<td>한쪽은 Straight in / <b class=\"k\">한쪽은 offset(3°이내)<\/b><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td>조건 <b class=\"k\">PFACT<\/b> — NTZ폭(2,000ft) / SOIA(750ft 가능) / NTZ : Course와의 간격이 3,000ft일때 끝남<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td>조건 <b class=\"k\">AAA<\/b> — <mark><strong>A<\/strong><\/mark> <b class=\"k\">A<\/b>ircraft / Offset 항공기 DA(NTZ가 끝나는 부분)에서 <b class=\"k\">straight in 항공기 확인<\/b><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><mark><strong>A<\/strong><\/mark> <b class=\"k\">A<\/b>TC에게 “Traffic in sight” 보고<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><mark><strong>A<\/strong><\/mark> <b class=\"k\">A<\/b>irport Runway<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>Turning 항공기<\/td>\n<td>Vertical <b class=\"k\">1,000ft<\/b> or Lateral <b class=\"k\">3NM<\/b><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>*<strong>NTZ<\/strong>(No Transgression Zone, 불가침구역) : <b class=\"k\">폭 2,000ft<\/b> / 침범시 <b class=\"k\">Break-out<\/b> (잘 가던 항공기가 피해줘야 함)<\/li>\n<li>*Break-out : 방향 NTZ 반대방향 / ATC 지시 우선 / ATC-TCAS동시 <mark>Turn 방향은 ATC<\/mark>, Climb/Descent TCAS따름)<\/li>\n<li>*Auto Pilot 사용 중일 경우, Manual로 전환 / Break-out '초당 3°'는 Standard Rate Turn(표준선회율)<\/li>\n<\/ul>"}, {"id": "s06-29", "ch": 6, "num": "6.29", "title": "Side Step Maneuver (JEPP 95p)", "pages": [37], "merged": false, "html": "<ul>\n<li>활주로 간격 <strong>1,200ft 이하<\/strong> 평행활주로<\/li>\n<\/ul>\n<ol>\n<li>계기접근을 종료하고 발견 즉시<\/li>\n<li>인접활주로 눈에 보여야 함 — Visual maneuver / Minimum Altitude 지켜야 함<\/li>\n<\/ol>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>기준<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>HAT<\/td>\n<td>항공사 500ft HAT<\/td>\n<\/tr>\n<tr>\n<td>AFE<\/td>\n<td>제작사 300ft AFE 전 RWY Alignment 필수<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s06-30", "ch": 6, "num": "6.30", "title": "Go-Around / Missed Approach / Rejected · Balked Landing", "pages": [32], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>용어<\/th>\n<th>정의<\/th>\n<th>비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Go-Around<\/strong><\/td>\n<td>계기접근, 시계접근을 모두 포함하는 용어<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Missed Approach<\/strong><\/td>\n<td>계기접근 절차를 종료하고 일반적으로 MAP에서 시작하여 Go-Around<br>Lateral은 MAP까지 가야하고 Vertical은 미리 상승할 수 있음<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Rejected Landing<\/strong><\/td>\n<td>(M)DA 아래에서 혹은 MAP를 지나서 Go-Around를 하는 것을 의미<\/td>\n<td>Touchdown 전까지<\/td>\n<\/tr>\n<tr>\n<td><strong>Balked Landing<\/strong><\/td>\n<td>1. Touchdown 후 Thrust Reversal 사용하기 전 Go-Around<\/td>\n<td>Boeing<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>(Annex 정의) 2. OCA/H 아래에서 Touchdown 전 — Obstacle Clearance Height<\/td>\n<td>Annex 8168<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>OCA/H + margin = → (M)DA/H — 즉, 상당히 낮은 고도에서 Go-around<\/li>\n<\/ul>\n<p><strong>Circling 중 Missed Approach<\/strong> — Climbing turn to L/D RWY and then intercept MAP<\/p>"}, {"id": "s06-31", "ch": 6, "num": "6.31", "title": "Discontinue Approach", "pages": [32], "merged": false, "html": "<ul>\n<li>TO-GA를 사용하지 않고 Level change, VS mode 등을 사용하여 Go-around 수행 (강하가 필요한 경우)<\/li>\n<\/ul>\n<ol>\n<li>Missed approach ALT가 현격히 낮은 경우 — Ex. 1200ft<\/li>\n<li>현재 고도보다 Missed approach ALT 낮은 경우<\/li>\n<li>현재 고도보다 Missed approach ALT 가 높으나 인접한 경우<\/li>\n<li>RNP-AR (RF segment)곡선구간에서 Go-around하는 경우<\/li>\n<\/ol>"}, {"id": "s06-32", "ch": 6, "num": "6.32", "title": "Auto LAND — CAT별 Max Wind (에프 POM 105p)", "pages": [80], "merged": false, "html": "<blockquote>\n<p>Auto LAND 일 경우 기준 / Manual일 경우, 초과해도 내릴 수 있음<\/p>\n<\/blockquote>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Wind<\/th>\n<th>CAT 1<\/th>\n<th>CAT 2/3<\/th>\n<th>Braking Good<\/th>\n<th>G to M<\/th>\n<th>Medium<\/th>\n<th>M to P<\/th>\n<th>Poor<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Head Wind<\/td>\n<td>25kt<\/td>\n<td>25kt<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Cross Wind<\/td>\n<td>25kt<\/td>\n<td>15kt<\/td>\n<td>30kt<\/td>\n<td>20 kt<\/td>\n<td>20 kt<\/td>\n<td>10 kt<\/td>\n<td>10 kt<\/td>\n<\/tr>\n<tr>\n<td>Tail Wind<\/td>\n<td>15kt<\/td>\n<td>10kt<\/td>\n<td>15 kt<\/td>\n<td>5 kt<\/td>\n<td>5 kt<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s06-33", "ch": 6, "num": "6.33", "title": "Crosswind Landing (Crab / De-crab / Wing-low)", "pages": [32], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>방법<\/th>\n<th>접근<\/th>\n<th>접지<\/th>\n<th>비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Crab<\/strong><\/td>\n<td>H/D(R/D) in to the wind<\/td>\n<td>그대로 접지 후 R/D 정대 — 기수가 틀어진 상태로 접지<\/td>\n<td>Slippery RWY only<\/td>\n<\/tr>\n<tr>\n<td><strong>De-crab<\/strong><\/td>\n<td>H/D(R/D) in to the wind / X-wind 강할 때 불가<\/td>\n<td>Touch down 직전 R/D 정대 — 양쪽 바퀴 동시 접지 가능<\/td>\n<td>Aileron in to the Wind<\/td>\n<\/tr>\n<tr>\n<td><strong>Wing-low<\/strong><\/td>\n<td>H/D(R/D) in to the wind<\/td>\n<td>Flare 직전 R/D 정대 — 기울어진 상태 내려간 날개(upwind) 바퀴 먼저 접지<\/td>\n<td>Aileron in to the Wind / 한쪽 바퀴 먼저 접지<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s06-34", "ch": 6, "num": "6.34", "title": "HOLDING Entry", "pages": [70], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>기준<\/th>\n<th>방법<\/th>\n<th>기준<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><b class=\"k\">Radial<\/b> 그대로 사용<\/td>\n<td>Bearing TO일 경우 180 반전<\/td>\n<td>CDI ↑제외 To/From ▲제외 NE<\/td>\n<\/tr>\n<tr>\n<td>표준 <b class=\"k\">우<\/b>선회<\/td>\n<td><\/td>\n<td>비표준 <b class=\"k\">좌<\/b>선회<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>표준 우선회<\/th>\n<th><\/th>\n<th>비표준 좌선회<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>좌측 −110<\/td>\n<td>우측 +70<\/td>\n<td>좌측 −70<\/td>\n<td>우측 +110<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"figs\"><figure><img src=\"img/i-070-039.webp\" alt=\"Holding Entry — 표준 우선회 (Outbound Course 기준 Parallel / Teardrop / Direct)\" loading=\"lazy\"><figcaption>Holding Entry — 표준 우선회 (Outbound Course 기준 Parallel / Teardrop / Direct)<\/figcaption><\/figure>\n<figure><img src=\"img/i-070-040.webp\" alt=\"Holding Entry — 비표준 좌선회\" loading=\"lazy\"><figcaption>Holding Entry — 비표준 좌선회<\/figcaption><\/figure>\n<figure><img src=\"img/i-070-041.webp\" alt=\"Draw Holding Patterns\" loading=\"lazy\"><figcaption>Draw Holding Patterns<\/figcaption><\/figure><\/div>"}, {"id": "s06-35", "ch": 6, "num": "6.35", "title": "Holding Speed", "pages": [70], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>ICAO 1st Edition — ALT<\/th>\n<th>Normal<\/th>\n<th>Turbulence<\/th>\n<th>ICAO 2nd Edition — ALT<\/th>\n<th>Normal<\/th>\n<th>Turbulence<\/th>\n<th>FAA — ALT<\/th>\n<th>MAX Speed<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>34,000ft 초과<\/td>\n<td>M 0.83<\/td>\n<td>Max M 0.83<\/td>\n<td>14,000ft 초과<\/td>\n<td>240kt<\/td>\n<td>280kt or <b class=\"k\">M0.8<\/b> 중 낮은 것<\/td>\n<td>14,000초과<\/td>\n<td>265kt<\/td>\n<\/tr>\n<tr>\n<td>34,000ft 이하<\/td>\n<td>265kt<\/td>\n<td>280kt or <b class=\"k\">M0.8<\/b> <b class=\"k\">중 낮은 것<\/b><\/td>\n<td>14,000ft 이하<
