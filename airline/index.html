/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong><b class=\"k\">Resume Normal Speed<\/b><\/strong> : ATC 지시는 종료 / Chart Published 속도는 지켜야 한다.<\/li>\n<\/ul>"}, {"id": "s07-04", "ch": 7, "num": "7.4", "title": "비행고도 (동홀서짝)", "pages": [70], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>규칙<\/th>\n<th>구분<\/th>\n<th>FL<\/th>\n<th>RVSM 1000ft간격<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>동홀서짝<\/strong> / VFR +500ft<\/td>\n<td>동 <b class=\"k\">계<\/b>기<\/td>\n<td>FL290<\/td>\n<td>동<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>동 <b class=\"k\">시<\/b>계<\/td>\n<td>FL300<\/td>\n<td>서<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><b class=\"k\">서<\/b> <b class=\"k\">계<\/b>기<\/td>\n<td>FL310<\/td>\n<td>동<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>서 <b class=\"k\">시<\/b>계<\/td>\n<td>FL320<\/td>\n<td>서<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>서(WEST)<\/th>\n<th>동(EAST)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>180° ~ 359°<\/td>\n<td>0° ~ 179°<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s07-05", "ch": 7, "num": "7.5", "title": "Position Report — IPTATPP / SES MACH", "pages": [39], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>항목<\/th>\n<th>비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>I<\/strong><\/td>\n<td>Identification<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>P<\/strong><\/td>\n<td>Position<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>T<\/strong><\/td>\n<td>Time (UTC)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>A<\/strong><\/td>\n<td>ALT (FL)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>T<\/strong><\/td>\n<td>Type of plan (IFR/VFR)<\/td>\n<td>IFR 항공기 항로관제/접근관제기관 보고시 생략가능<\/td>\n<\/tr>\n<tr>\n<td><strong>P<\/strong><\/td>\n<td>Next Reporting Point NAME/ETA<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>P<\/strong><\/td>\n<td>Next Next Point NAME<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>Remarks<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>All time Report — <mark>SES MACH<\/mark><\/strong> (Additional REPORT / 관제기관 요구안하더라도)<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>항목<\/th>\n<th>내용<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>S<\/strong><\/td>\n<td>Safety<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>E<\/strong><\/td>\n<td>Equipment fail<\/td>\n<td>Communication, Navigation, Approach Aid (VOR, GPS, ILS) — Plan item 10a<br>Fail, 부분손상 : 보고시 A/C ID, 어떤 장비 영향, IFR비행상 어느정도 손상, ATC의 어떤 도움 필요<\/td>\n<\/tr>\n<tr>\n<td><strong>S<\/strong><\/td>\n<td>Speed<\/td>\n<td>TAS 기준 5% 또는 10Kt 둘 중 큰 값의 Flight Plan과 변동(차이)<\/td>\n<\/tr>\n<tr>\n<td><strong>M<\/strong><\/td>\n<td>Missed Approach<\/td>\n<td>Missed Approach할 때 next intention (Divert or other APP)<\/td>\n<\/tr>\n<tr>\n<td><strong>A<\/strong><\/td>\n<td>ALT change<\/td>\n<td>VFR on top 포함 Altitude change할 때<\/td>\n<\/tr>\n<tr>\n<td><strong>C<\/strong><\/td>\n<td>Climb/Descent<\/td>\n<td>Performance 500fpm불가시<\/td>\n<\/tr>\n<tr>\n<td><strong>H<\/strong><\/td>\n<td>Holding fix<\/td>\n<td>홀딩 In-out시, TIME/ALT 포함해서<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Non-Radar 추가보고 — FEP<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>항목<\/th>\n<th>내용<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>F<\/strong><\/td>\n<td>FAF<\/td>\n<td>Beginning of FA Segment 지날 때 (FAF 또는 OM)<\/td>\n<\/tr>\n<tr>\n<td><strong>E<\/strong><\/td>\n<td>ETA<\/td>\n<td>ETA 2분 초과할 경우 (NAT공역 3분, North Atlantic, 북대서양)<\/td>\n<\/tr>\n<tr>\n<td><strong>P<\/strong><\/td>\n<td>PIREP<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s07-06", "ch": 7, "num": "7.6", "title": "Transponder Code", "pages": [39], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Code<\/th>\n<th>의미<\/th>\n<th>Code<\/th>\n<th>의미<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>7500<\/strong><\/td>\n<td>Hi-jacking<\/td>\n<td><strong>7777<\/strong><\/td>\n<td>Military Interceptor Operation (군작전)<\/td>\n<\/tr>\n<tr>\n<td><strong>7600<\/strong><\/td>\n<td>Lost Communication<\/td>\n<td><strong>0000<\/strong><\/td>\n<td>North America<\/td>\n<\/tr>\n<tr>\n<td><strong>7700<\/strong><\/td>\n<td>Emergency<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s07-07", "ch": 7, "num": "7.7", "title": "Radar Contact & 통신두절 절차", "pages": [27], "merged": false, "html": "<p><strong>“관제기관의 Radar 화면에 내 항공기가 식별되고 있음”<\/strong>\n- SID : Radar contact 필수 아님\n- → Chart 상 ( R ) : Radar Service 제공여부<\/p>\n<p><strong>통신두절<\/strong>\n1. 관제비행장 근처라면 → 빛총신호를 주시할 것\n2. VMC 라면 → VMC 유지한 상태에서 가까운 공항에 착륙 후 관제기관에 보고할 것\n3. Radar Contact 여부 → 초기 대응방법<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>VMC<\/th>\n<th>구름<\/th>\n<th><\/th>\n<th>시정<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>VMC<\/td>\n<td>Cloud base 위 아래 300m<\/td>\n<td>수평 1,500m<\/td>\n<td>Flight visibility 10,000 / 8km<\/td>\n<\/tr>\n<tr>\n<td>ICAO 보고된 기상치<\/td>\n<td>시정 5km이상<\/td>\n<td>Ceiling 1,500ft 이상<\/td>\n<td>5km<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>ATC 중 가장 늦은 시간 기준점<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>항목<\/th>\n<th>기준 시간<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>A<\/strong><\/td>\n<td>Altitude<\/td>\n<td>최저비행고도 혹은 최종지정고도 중 높은 고도 도달 시간<\/td>\n<\/tr>\n<tr>\n<td><strong>T<\/strong><\/td>\n<td>Transponder<\/td>\n<td>7600 set 한 시간<\/td>\n<\/tr>\n<tr>\n<td><strong>C<\/strong><\/td>\n<td>Compulsory<\/td>\n<td>필수보고지점 위치보고 실패한 시간<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>상황<\/th>\n<th>절차<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1. <strong>Radar Contact<\/strong><\/td>\n<td>ATC 중 가장 늦은 시간부터 최종 지시받은 고도와 속도를 <strong>7분간<\/strong> 유지하고 Flight Plan상 고도와 속도로 변경 (다만, 최저 비행고도 고려)<\/td>\n<\/tr>\n<tr>\n<td>2. <strong>Non-Radar Contact<\/strong><\/td>\n<td>ATC 중 가장 늦은 시간부터 최종 지시받은 고도와 속도를 <strong>20분간<\/strong> 유지하고 Flight Plan상 고도와 속도로 변경 (다만, 최저 비행고도 고려)<br>Non-Radar : 접근관제소로부터 벗어난 공역 — TMA(접근관제소 관할구역)<\/td>\n<\/tr>\n<tr>\n<td>3. <strong>항로를 벗어난 비행<\/strong><\/td>\n<td>다음 Reporting Point 전까지 최저 비행고도를 고려하여 Flight Plan상 항로로 합류할 것<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>순서<\/strong>\n1. 지정된 비행로 / 최저비행고도\n2. 지정이 예정되거나 Flight Plan 상에 명시된 비행로\n3. 목적공항 또는 Fix에서 체공할 것<\/p>\n<p><strong>내려가는 시간<\/strong><\/p>\n<ol start=\"4\">\n<li>지정 접근 예정시간(EFC) 또는 Flight Plan 상 명시된 도착 예정시간(ETA) Fix로 부터 강하 및 접근을 시작할 것<\/li>\n<li>지정된 접근 예정시간(EFC) 또는 Flight Plan 상에 명시된 도착 예정시간(ETA) 둘 중 늦은 시간부터 30분 내 착륙할 것<\/li>\n<\/ol>"}, {"id": "s07-08", "ch": 7, "num": "7.8", "title": "교신실패 간주 시간 (Radar Approach)", "pages": [73], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>상황<\/th>\n<th>교신실패 간주<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>일반상황<\/td>\n<td>1분<\/td>\n<\/tr>\n<tr>\n<td>ASR<\/td>\n<td>15초<\/td>\n<\/tr>\n<tr>\n<td>PAR<\/td>\n<td>5초<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s07-09", "ch": 7, "num": "7.9", "title": "빛총신호 (Light Gun Signal)", "pages": [83], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>신호<\/th>\n<th>비행중<\/th>\n<th>지상<\/th>\n<th>차량, 기계, 인원<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>깜빡 적색<\/td>\n<td>불안하니 착륙금지<\/td>\n<td>착륙지역에서 벗어나라<\/td>\n<td>활주로, 유도로 벗어나라<\/td>\n<\/tr>\n<tr>\n<td>연속 적색<\/td>\n<td>진로양보 계속선회<\/td>\n<td>정지<\/td>\n<td>정지<\/td>\n<\/tr>\n<tr>\n<td>깜빡 녹색<\/td>\n<td>착륙준비<\/td>\n<td>지상이동 허가<\/td>\n<td>X<\/td>\n<\/tr>\n<tr>\n<td>연속 녹색<\/td>\n<td>착륙허가<\/td>\n<td>이륙허가<\/td>\n<td>통과 진행<\/td>\n<\/tr>\n<tr>\n<td>깜빡 백색<\/td>\n<td>착륙 후 계류장<\/td>\n<td>출발지로 돌아가라<\/td>\n<td>출발지로 돌아가라<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s07-10", "ch": 7, "num": "7.10", "title": "Clearance VOID Time (무효시간) / EDCT / Gate Hold", "pages": [39], "merged": false, "html": "<p>※ IFR Departure / Non-tower airport<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>용어<\/th>\n<th>의미<\/th>\n<th>비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Release time<\/strong><\/td>\n<td>이륙 가장 빠른 시간<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Void time<\/strong><\/td>\n<td>이륙 가장 늦은 시간<\/td>\n<td>30분 내 이륙 X → 통보필요 → Search and Rescue<br>IFR flight plan이 Cancel이 되는 것은 아님<\/td>\n<\/tr>\n<tr>\n<td><strong>Hold for release<\/strong><\/td>\n<td>일단 대기 + release time<\/td>\n<td>Cause 기상, Traffic<br>※ IFR Cancel하고 VFR로는 나갈 수 있다.<\/td>\n<\/tr>\n<tr>\n<td><strong>EDCT<\/strong><\/td>\n<td>Expect Departure Clearance Time<\/td>\n<td>±5분 내로 Clear받을 예정<\/td>\n<\/tr>\n<tr>\n<td><strong>Gate Hold<\/strong> (ACDM 운용하지 않는 공항)<\/td>\n<td>15분 초과 Delay 예상되는 경우 Eng start 전에 Clear 필요 / 호출순서에 따라서<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Warm-up Block<\/strong><\/td>\n<td>RWY끝단, Warm-up Block에 도달 시, 이륙준비로 간주된다.<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s07-11", "ch": 7, "num": "7.11", "title": "Wake Turbulence Category / Separation", "pages": [83], "merged": false, "html": "<ul>\n<li><strong>Wake Turbulence<\/strong> : <b class=\"k\">Wingtip 아래(고)에서 위(저)로 흘러가는 와류<\/b> — <b class=\"k\">Heavy / Clean / Low Speed<\/b><\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Category<\/th>\n<th>MTOW (kg)<\/th>\n<th>MTOW (lbs)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Super / Heavy<\/td>\n<td><strong>136,000kg<\/strong> 이상<\/td>\n<td>136,000lbs 이상<\/td>\n<\/tr>\n<tr>\n<td>Medium<\/td>\n<td><mark><b class=\"k\">7,000kg 초과<\/b> <b class=\"k\">136,000kg 미만<\/b><\/mark><\/td>\n<td>15,000lbs 초과 136,000lbs 미만<\/td>\n<\/tr>\n<tr>\n<td>Light<\/td>\n<td><strong>7,000Kg<\/strong> 이하<\/td>\n<td>15,000lbs 이하<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Radar Separation<\/strong> — 거리로 분리 (357 / 346)<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>선행 → 후행<\/th>\n<th>거리<\/th>\n<th><\/th>\n<th>선행 → 후행<\/th>\n<th>거리<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>M → M<\/td>\n<td>최소 3NM<\/td>\n<td><\/td>\n<td>M → H<\/td>\n<td>3NM<\/td>\n<\/tr>\n<tr>\n<td><b class=\"k\">H →<\/b> <b class=\"k\">M<\/b><\/td>\n<td><b class=\"k\">최소 5NM<\/b><\/td>\n<td><\/td>\n<td>H → H<\/td>\n<td>4NM<\/td>\n<\/tr>\n<tr>\n<td><b class=\"k\">J →<\/b> M<\/td>\n<td>최소 7NM<\/td>\n<td><\/td>\n<td>J → H<\/td>\n<td>6NM<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ol>\n<li>동일 활주로 / <b class=\"k\">2,500ft 미만(750m)<\/b> 평행활주로 이륙 또는 어프로치<\/li>\n<li>바로 뒤에서 <b class=\"k\">1,000ft 미만<\/b> 고도로 아래쪽으로<\/li>\n<li>발생된 wake turbulence 기준 / 동일고도 또는 <b class=\"k\">1,000ft미만<\/b>의 고도로<\/li>\n<\/ol>\n<p><strong>Non-radar Separation<\/strong> — 분으로 분리<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>단계<\/th>\n<th>시간<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1단계<\/td>\n<td><b class=\"k\">2분<\/b><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>2단계<\/td>\n<td>3분<\/td>\n<td>S → M<\/td>\n<\/tr>\n<tr>\n<td>Intersection Takeoff<\/td>\n<td>1분 추가<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"figs\"><figure><img src=\"img/i-084-044.webp\" alt=\"Arriving / Departing Aircraft Time Separation\" loading=\"lazy\"><figcaption>Arriving / Departing Aircraft Time Separation<\/figcaption><\/figure>\n<figure><img src=\"img/i-084-045.webp\" alt=\"Departing Aircraft Time Separation\" loading=\"lazy\"><figcaption>Departing Aircraft Time Separation<\/figcaption><\/figure>\n<figure><img src=\"img/i-084-046.webp\" alt=\"Arrival &amp; Departure Distance Based Separation (Heavy-Heavy 4.0NM / Heavy-Medium 5.0NM / Heavy-Light 6.0NM / Medium-Light 5.0NM)\" loading=\"lazy\"><figcaption>Arrival &amp; Departure Distance Based Separation (Heavy-Heavy 4.0NM / Heavy-Medium 5.0NM / Heavy-Light 6.0NM / Medium-Light 5.0NM)<\/figcaption><\/figure><\/div>"}, {"id": "s07-12", "ch": 7, "num": "7.12", "title": "A-CDM (Airport Collaborative Decision Making)", "pages": [80], "merged": false, "html": "<ul>\n<li><strong><b class=\"k\">A-CDM<\/b><\/strong> : <b class=\"k\">A<\/b>irport <b class=\"k\">C<\/b>ollaborative <b class=\"k\">D<\/b>ecision <b class=\"k\">M<\/b>aking — 항공기 출도착 흐름 효율적으로 관리<\/li>\n<li>효과 : <b class=\"k\">지연 최소화<\/b> / <b class=\"k\">연료 절감<\/b> / <b class=\"k\">운항 예측성 향상<\/b><\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>용어<\/th>\n<th>의미<\/th>\n<th><\/th>\n<th>비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>TOBT<\/strong><\/td>\n<td>Target Off Block Time<\/td>\n<td>Push-back 준비 완료<\/td>\n<td>TOBT 수정으로 지연가능성을 알려줄 수 있음<\/td>\n<\/tr>\n<tr>\n<td><strong>CTOT<\/strong><\/td>\n<td>Calculated T/O<\/td>\n<td>조정이륙시간<\/td>\n<td><b class=\"k\">항로<\/b>교통통제센터 발부 추천시간<\/td>\n<\/tr>\n<tr>\n<td><strong>TTOT<\/strong><\/td>\n<td>Target T/O<\/td>\n<td><\/td>\n<td><b class=\"k\">Tower<\/b>에서 목표로 하는 시간<\/td>\n<\/tr>\n<tr>\n<td><strong>TSAT<\/strong><\/td>\n<td>Target Start Approved<\/td>\n<td><\/td>\n<td><b class=\"k\">Tower<\/b>에서 생성 / TOBT-TTOT 고려 → Pushback and Startup을 늦게 주면 연료 낭비 X<\/td>\n<\/tr>\n<tr>\n<td><strong><b class=\"k\">VDGS<\/b><\/strong><\/td>\n<td>Visual Docking Guidance System<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>EOBT<\/strong><\/td>\n<td>Estimated Off Block Time<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>AOBT<\/strong><\/td>\n<td>Actual Off Block Time<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>기준<\/th>\n<th>허용<\/th>\n<th>받아야 하는 것<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>TSAT<\/td>\n<td>+-5분<\/td>\n<td>Pushback and Startup 받아야 함<\/td>\n<\/tr>\n<tr>\n<td>TOBT<\/td>\n<td>−10분 / +5분<\/td>\n<td>Departure Clearance 받아야 함<\/td>\n<\/tr>\n<tr>\n<td>EOBT<\/td>\n<td><b class=\"k\">15분<\/b> 변동예상시<\/td>\n<td>변경<\/td>\n<\/tr>\n<tr>\n<td>TOBT<\/td>\n<td><b class=\"k\">5분<\/b> 변동예상시<\/td>\n<td>변경<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s07-13", "ch": 7, "num": "7.13", "title": "ATC 용어사용 (Jepp 1332p)", "pages": [78], "merged": false, "html": "<ul>\n<li>관제 기관의 모국어 / English 사용가능<\/li>\n<\/ul>"}, {"id": "s07-14", "ch": 7, "num": "7.14", "title": "KAIM 146p ATC 숫자 읽기", "pages": [80], "merged": false, "html": "<ul>\n<li>(원본에 제목만 정리되어 있음 — KAIM 146p 참고)<\/li>\n<\/ul>"}, {"id": "s08-01", "ch": 8, "num": "8.1", "title": "Runway Design Standard (Criteria)", "pages": [10], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>거리<\/th>\n<th>구성<\/th>\n<th>설명<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>TODA<\/strong><\/td>\n<td>TORA(RWY) + Clearway<\/td>\n<td>잔여활주로 + 개방구역<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>RWY보다 TORA가 <b class=\"k\">적은<\/b> 경우<\/td>\n<td>RWY 200ft 후 사다리꼴 모양의 보호구역이 들어와 있는 경우<\/td>\n<\/tr>\n<tr>\n<td><strong>ASDA<\/strong><\/td>\n<td>TORA(RWY) + Stopway<\/td>\n<td>LDA / ASDA — RWY 보다 짧아질 수 있음<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>Displaced Threshold<\/td>\n<td>RWY 보다 짧아질 수 있음<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>구역<\/th>\n<th>명칭<\/th>\n<th>설명<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><mark><strong>RPZ<\/strong><\/mark><\/td>\n<td><b class=\"k\">R<\/b>unway <b class=\"k\">P<\/b>rotection <b class=\"k\">Z<\/b>one<\/td>\n<td>착륙 경로 하방의 지표면 보호 구역 / 활주로 끝 200~1,000ft 부터 시작 / 사다리꼴 구역<\/td>\n<\/tr>\n<tr>\n<td><mark><strong>RSA<\/strong><\/mark><\/td>\n<td><b class=\"k\">R<\/b>unway <b class=\"k\">S<\/b>afety <b class=\"k\">A<\/b>rea — 좌우 1,000ft<\/td>\n<td>활주로 끝과 양측 가장자리 바깥 완충 구역 / 통상 활주로 끝에서 240m 길이와 150m 폭 이상 확보<\/td>\n<\/tr>\n<tr>\n<td><mark><strong>ROFA<\/strong><\/mark><\/td>\n<td><b class=\"k\">R<\/b>unway <b class=\"k\">O<\/b>bject <b class=\"k\">F<\/b>ree <b class=\"k\">A<\/b>rea<\/td>\n<td>구조물이 존재해서는 안되는 구역 / 활주로 중심선 좌우 250ft 이상 확보<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"figs\"><figure><img src=\"img/i-012-002.webp\" alt=\"Runway Protection Zone (RPZ), Runway Object Free Area (ROFA), Runway Safety Area (RSA)\" loading=\"lazy\"><figcaption>Runway Protection Zone (RPZ), Runway Object Free Area (ROFA), Runway Safety Area (RSA)<\/figcaption><\/figure><\/div>"}, {"id": "s08-02", "ch": 8, "num": "8.2", "title": "Runway Threshold Stripes", "pages": [80], "merged": false, "html": "<ul>\n<li><strong>Vmcg<\/strong> : <b class=\"k\">CL 30ft<\/b> 이내 유지<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>활주로 폭<\/th>\n<th>Stripes<\/th>\n<th>개수<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>2-2<\/td>\n<td>4 개<\/td>\n<td><b class=\"k\">60ft<\/b><\/td>\n<\/tr>\n<tr>\n<td>3-3<\/td>\n<td>6 개<\/td>\n<td><b class=\"k\">75ft<\/b><\/td>\n<\/tr>\n<tr>\n<td>4-4<\/td>\n<td>8 개<\/td>\n<td><b class=\"k\">100ft<\/b><\/td>\n<\/tr>\n<tr>\n<td>6-6<\/td>\n<td>12 개<\/td>\n<td><b class=\"k\">150ft<\/b><\/td>\n<\/tr>\n<tr>\n<td>8-8<\/td>\n<td>16 개<\/td>\n<td><b class=\"k\">200ft<\/b><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s08-03", "ch": 8, "num": "8.3", "title": "ACN/PCN → ACR/PCR", "pages": [39], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>약어<\/th>\n<th>명칭<\/th>\n<th>기준<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>ACR<\/strong><\/td>\n<td><b class=\"k\">A<\/b>ircraft <b class=\"k\">C<\/b>lassification <b class=\"k\">R<\/b>ating N(Number)<\/td>\n<td><mark><b class=\"k\">PCR ≥ ACR<\/b><\/mark><\/td>\n<\/tr>\n<tr>\n<td><strong>PCR<\/strong><\/td>\n<td><b class=\"k\">P<\/b>avement <b class=\"k\">C<\/b>lassification <b class=\"k\">R<\/b>ating<\/td>\n<td>10,000kg → “200” 으로 표현<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>어떤 항공기가 어떤 포장재질에 <b class=\"k\">영향을 미치는 정도<\/b>를 <b class=\"k\">숫자<\/b>로 표현 — Single wheel <b class=\"k\">1/50<\/b>로 영향<\/li>\n<li>5,700kg 이상의 항공기에 적용 — 단, Tire Pressure 제한 받지만, Weight은 영향이 있을 수 있음<\/li>\n<\/ul>\n<p><strong>예) 662/F/B/X/T — <mark>NTS PM<\/mark><\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th>코드<\/th>\n<th>의미<\/th>\n<th>비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><b class=\"k\">N<\/b>umber : 662<\/td>\n<td>PCR<\/td>\n<td><\/td>\n<td><b class=\"k\">하나의 바퀴<\/b>가 가할 수 있는 <b class=\"k\">최대중량<\/b> X50배<\/td>\n<\/tr>\n<tr>\n<td>Pavement <b class=\"k\">T<\/b>ype<\/td>\n<td><strong>R<\/strong><\/td>\n<td><b class=\"k\">R<\/b>igid : concrete<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><strong>F<\/strong><\/td>\n<td><b class=\"k\">F<\/b>lexible : Asphalt<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><b class=\"k\">S<\/b>ubgrade <b class=\"k\">S<\/b>trength Category<\/td>\n<td><strong>A<\/strong><\/td>\n<td>High strength<\/td>\n<td>포장면 아래의 토양의 특성<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><strong>B<\/strong><\/td>\n<td>Medium strength<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><strong>C<\/strong><\/td>\n<td>Low strength<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><strong>D<\/strong><\/td>\n<td>Ultra-low strength<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Allowable Tire <b class=\"k\">P<\/b>ressure<\/td>\n<td><strong>W<\/strong><\/td>\n<td>Unlimited<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><strong>X<\/strong><\/td>\n<td>1.75 MPa<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><strong>Y<\/strong><\/td>\n<td>1.25 MPa<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><strong>Z<\/strong><\/td>\n<td>0.5 MPa<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Evaluation <b class=\"k\">M<\/b>ethod<\/td>\n<td><strong>T<\/strong><\/td>\n<td><b class=\"k\">T<\/b>echnical Evaluation <span class=\"fix\" title=\"정리하면서 확인·수정한 부분\">✎ 원본 “Evacuation”<\/span><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><strong>U<\/strong><\/td>\n<td><b class=\"k\">U<\/b>sing A/C Experience<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s08-04", "ch": 8, "num": "8.4", "title": "Contaminated RWY (오염된 활주로)", "pages": [43], "merged": false, "html": "<ul>\n<li>활주로의 일정부분(<b class=\"k\">25% 이상<\/b>) 3mm 이상의 수분, 눈, 얼음, 진창(Slush) 또는 기타 물질로 덮여 있어 활주 및 제동 성능에 부정적 영향을 미칠 수 있는 상태<\/li>\n<\/ul>"}, {"id": "s08-05", "ch": 8, "num": "8.5", "title": "Runway CC (Condition Code) / RCAM", "pages": [61], "merged": false, "html": "<p><strong>활주로 표면 25% 초과하는 표면이 아래 상태<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>RWYCC<\/th>\n<th>활주로 상태<\/th>\n<th>비고<\/th>\n<th>PIREP 기준<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>6<\/strong><\/td>\n<td>DRY<\/td>\n<td>RWY 25%(1/3)이하가 뭐든<\/td>\n<td>X 없음<\/td>\n<\/tr>\n<tr>\n<td><strong>5<\/strong><\/td>\n<td><b class=\"k\">FROST<\/b> 또는 / <b class=\"k\">3mm 이하<\/b>의 Water, Slush, Dry SN/Wet SN / Wet Runway<\/td>\n<td>RWY 25%초과가 <b class=\"k\">3mm이하 Water<\/b> 덮혀있음<\/td>\n<td>Good<\/td>\n<\/tr>\n<tr>\n<td><strong>4<\/strong><\/td>\n<td>-15° 이하의 CS(Compacted Snow)<\/td>\n<td><\/td>\n<td>Good to Medium<\/td>\n<\/tr>\n<tr>\n<td><strong>3<\/strong><\/td>\n<td>-15° <b class=\"k\">초과<\/b>의 CS(Compacted Snow) 따듯한 / CS 위의 SN(Snow) / SN 인데 <b class=\"k\">3mm 초과<\/b>의 Snow / SW Slippery Wet Runway / <b class=\"k\">마찰계수 안좋음<\/b><\/td>\n<td>*SW : 마찰계수가 일정기준 떨어진 Wet RWY<br>*Wet RWY : RWY 25% 초과가 3mm 이하의 water로 덮여있음 (마찰계수가 떨어졌기 때문에 홈이 메워져버림)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>2<\/strong><\/td>\n<td>3mm 초과의 Water, Slush (Standing Water, Slush)<\/td>\n<td><\/td>\n<td>Medium to Poor<\/td>\n<\/tr>\n<tr>\n<td><strong>1<\/strong><\/td>\n<td>ICE<\/td>\n<td><\/td>\n<td>Poor<\/td>\n<\/tr>\n<tr>\n<td><strong>0<\/strong><\/td>\n<td>Wet ICE or Dry SN, Wet SN on TOP ICE / Water on CS(Compacted Snow)<\/td>\n<td>Ice 위의 Water or Snow / CS 위의 Water<\/td>\n<td>Less than Poor (Nil)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s08-06", "ch": 8, "num": "8.6", "title": "Hydroplaning", "pages": [61], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>종류<\/th>\n<th>원인<\/th>\n<th>내용<\/th>\n<th>비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Dynamic hydroplaning<\/strong><\/td>\n<td>항공기<\/td>\n<td><b class=\"k\">고속<\/b>으로 인한 접지 — 조종사가 고속으로 내려서<\/td>\n<td>8.73 × √(tire Pressure) 초과시<\/td>\n<\/tr>\n<tr>\n<td><strong>Viscous hydroplaning<\/strong><\/td>\n<td>활주로 표면<\/td>\n<td>Slippery Wet RWY — 얇은 필름같은 물, 느린 속도에서도 발생<\/td>\n<td><b class=\"k\">활주로 관리 미흡<\/b><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td>RWY <b class=\"k\">25%<\/b> 초과 <b class=\"k\">3mm 이하<\/b>의 Water + <b class=\"k\">마찰계수<\/b> 일정계수 <b class=\"k\">이하<\/b><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><b class=\"k\">예방<\/b> : <b class=\"k\">저속 접지<\/b> / <b class=\"k\">Into the wind L/D<\/b> / <b class=\"k\">Full Flap L/D<\/b><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Reverted Rubber<\/strong><\/td>\n<td>고무변형<\/td>\n<td>홈의 물이 끓어서 기화 → 팽창<\/td>\n<td>지면 접착력 약화<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s08-07", "ch": 8, "num": "8.7", "title": "EMAS (Engineered Material Arresting System)", "pages": [39], "merged": false, "html": "<ul>\n<li><b class=\"k\">E<\/b>ngineered <b class=\"k\">M<\/b>aterial <b class=\"k\">A<\/b>rresting <b class=\"k\">S<\/b>ystem (PHAK 370p)<\/li>\n<li>Stopway / Blastpad / Reject T/O / Landing → <b class=\"k\">Overrun 방지<\/b> — 설치할 수도 있다.<\/li>\n<li><strong><b class=\"k\">RSA<\/b><\/strong> (Runway Safe Area) 1,000ft<b class=\"k\">미만<\/b> 일경우 설치할 수도 있다. — 설치하지 않을 경우, <b class=\"k\">LDA<\/b> 혹은 <b class=\"k\">ASDA<\/b>가 활주로보다 짧아질 수 있다. TORA도 짧아질 수 있다.<\/li>\n<li><b class=\"k\">Runway Protection Zone Requirement<\/b>를 충족하지 못했을 때 → Runway 부터 200m 떨어진 곳 사다리꼴 모양 — 뒤로 밀렸을 경우<\/li>\n<li>통칭해서 <b class=\"k\">Runway Design Criteria (Standard)<\/b><\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>단위 환산<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1inch = 2.54cm<\/td>\n<td>1ft = 12 inches = 30.48cm<\/td>\n<\/tr>\n<tr>\n<td>400m x <mark>3.28<\/mark> = 1,312ft<\/td>\n<td>10,000ft = 3,048m<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s08-08", "ch": 8, "num": "8.8", "title": "Approach Light System 종류 (AIM 90p)", "pages": [20], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>약어<\/th>\n<th>명칭<\/th>\n<th>CAT<\/th>\n<th>비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>ALS<b class=\"k\">F-1<\/b><\/td>\n<td>Approach Light System with <b class=\"k\">Sequenced Flashing Light<\/b><\/td>\n<td>CAT1<\/td>\n<td>F/R 움직이는 Light<\/td>\n<\/tr>\n<tr>\n<td>ALS<b class=\"k\">F-2<\/b><\/td>\n<td><\/td>\n<td>CAT2<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><b class=\"k\">S<\/b>SAL(s)<b class=\"k\">R<\/b><\/td>\n<td><b class=\"k\">S<\/b>implified <b class=\"k\">S<\/b>hort Approach Light System with <b class=\"k\">RAIL<\/b><\/td>\n<td><\/td>\n<td>일부만 소등하면 됨<\/td>\n<\/tr>\n<tr>\n<td><b class=\"k\">M<\/b>ALS<b class=\"k\">R<\/b><\/td>\n<td><b class=\"k\">M<\/b>edium intensity Approach Light System with <b class=\"k\">RAIL<\/b><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><b class=\"k\">M<\/b>ALS<b class=\"k\">F<\/b><\/td>\n<td><b class=\"k\">M<\/b>edium intensity Approach Light System with <b class=\"k\">Sequenced Flashing Light<\/b><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><b class=\"k\">O<\/b>DALS<\/td>\n<td><b class=\"k\">O<\/b>mni<b class=\"k\">d<\/b>irectional Approach Light System<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>RAIL : Runway Alignment Indicator Light<\/li>\n<\/ul>\n<div class=\"figs\"><figure><img src=\"img/i-022-007.webp\" alt=\"AIM FIG 2-1-1 Precision &amp; Nonprecision Configurations (Civil ALSF-2 may be operated as SSALR during favorable weather conditions)\" loading=\"lazy\"><figcaption>AIM FIG 2-1-1 Precision &amp; Nonprecision Configurations (Civil ALSF-2 may be operated as SSALR during favorable weather conditions)<\/figcaption><\/figure><\/div>"}, {"id": "s08-09", "ch": 8, "num": "8.9", "title": "PAPI / VASI (AIM 89p)", "pages": [37], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th><b class=\"k\">P<\/b>recision <b class=\"k\">A<\/b>pproach <b class=\"k\">P<\/b>ath <b class=\"k\">I<\/b>ndicator — <strong>PAPI<\/strong><\/th>\n<th><\/th>\n<th><b class=\"k\">V<\/b>isual <b class=\"k\">A<\/b>pproach <b class=\"k\">S<\/b>lope <b class=\"k\">I<\/b>ndicator — <strong>VASI<\/strong><\/th>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>가시거리<\/td>\n<td>주간 5NM<\/td>\n<td>야간 20NM<\/td>\n<td>주간 3~5NM<\/td>\n<td>야간 20NM <b class=\"k\">이상<\/b><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>범위<\/td>\n<td>좌우 10°<\/td>\n<td>3.4NM<\/td>\n<td>좌우 10°<\/td>\n<td>4NM<\/td>\n<td>Obstruction Clearance Area<\/td>\n<\/tr>\n<tr>\n<td>지시 / 종류<\/td>\n<td>3.5° 이상<\/td>\n<td>2.5° 이하<\/td>\n<td>2bar VASI<\/td>\n<td>3bar VASI<\/td>\n<td><b class=\"k\">For High-cockpit A/C TCH passing<\/b><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>3.2°<\/td>\n<td>2.8°<\/td>\n<td>2,4,12<\/td>\n<td>6,16<\/td>\n<td>3.25° — Far-middle +1/4°<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>3.0° (On Path)<\/td>\n<td><\/td>\n<td>3.2°<\/td>\n<td>16-양쪽<\/td>\n<td>3° — Near-middle<\/td>\n<\/tr>\n<tr>\n<td>배치<\/td>\n<td>Single low 2 or 4 <b class=\"k\">적색 우측<\/b><\/td>\n<td><\/td>\n<td><b class=\"k\">적색 위쪽(활주로쪽)<\/b><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Single light unit<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Tri-color System (주간 1NM / 야간 5NM)<\/th>\n<th><\/th>\n<th>Pulsating VASI (P-VASI) (주간 4NM / 야간 10NM)<\/th>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Amber<\/td>\n<td><\/td>\n<td>Pulsating White<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Green<\/td>\n<td><b class=\"k\">On Path<\/b><\/td>\n<td>STEADY White<\/td>\n<td>On Path<\/td>\n<td><b class=\"k\">Alternating RED/WHITE<\/b><\/td>\n<\/tr>\n<tr>\n<td>Dark Amber<\/td>\n<td><\/td>\n<td>Steady <b class=\"k\">RED<\/b><\/td>\n<td>Slightly Below<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><b class=\"k\">Red<\/b><\/td>\n<td><\/td>\n<td>Pulsating <b class=\"k\">RED<\/b><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>Alignment of Elements system<\/strong> — 3/4NM / 막대가 정렬되면 On path, 가운데 막대가 위로 보이면 ABOVE, 아래로 보이면 BELOW<\/li>\n<\/ul>"}, {"id": "s08-10", "ch": 8, "num": "8.10", "title": "항공등화 (설치 기준표)", "pages": [75], "merged": false, "html": "<div class=\"figs\"><figure><img src=\"img/i-077-042.webp\" alt=\"항공등화 종류별 설치 대상 및 색상 (비행장등대, 진입등시스템, 진입각지시등, 활주로등, 활주로시단등, 활주로중심선등, 접지구역등, 활주로종단등, 유도로등, 유도로중심선등, 일시정지위치등, 정지선등, 활주로경계등, 공항등, 지향신호등, 정지로등, 유도로안내등, 착륙구역등)\" loading=\"lazy\"><figcaption>항공등화 종류별 설치 대상 및 색상 (비행장등대, 진입등시스템, 진입각지시등, 활주로등, 활주로시단등, 활주로중심선등, 접지구역등, 활주로종단등, 유도로등, 유도로중심선등, 일시정지위치등, 정지선등, 활주로경계등, 공항등, 지향신호등, 정지로등, 유도로안내등, 착륙구역등)<\/figcaption><\/figure><\/div>"}, {"id": "s08-11", "ch": 8, "num": "8.11", "title": "Runway Leading Light / Taxiway Lead-on/off Light", "pages": [39], "merged": false, "html": "<ul>\n<li><strong>활주로 유도등<\/strong> : Runway Leading Light system / Approach path (Curving or Straight)<\/li>\n<li><strong>유도로중심선 Lead on/off light<\/strong> : Taxiway Lead-on/off<\/li>\n<\/ul>"}, {"id": "s08-12", "ch": 8, "num": "8.12", "title": "High Speed Taxi Turn-off Indicator Light (HSTIL / RETIL)", "pages": [83], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>약어<\/th>\n<th>조건<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>HSTIL<\/strong><\/td>\n<td>RVR <b class=\"k\">350m 미만<\/b><\/td>\n<\/tr>\n<tr>\n<td><strong>RETIL<\/strong><\/td>\n<td>교통량 과다할 때<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>기준<\/th>\n<th>명칭<\/th>\n<th>설치<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>FAA<\/td>\n<td>High Speed Taxi Turn-off Indicator Light<\/td>\n<td>Fixed <b class=\"k\">Unidirectional<\/b><\/td>\n<td><mark>Yellow Light<\/mark><\/td>\n<\/tr>\n<tr>\n<td>ICAO<\/td>\n<td>Rapid Exit Taxiway Indicator Light<\/td>\n<td>Centerline 옆에 설치<\/td>\n<td>개방하는 쪽 설치<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s08-13", "ch": 8, "num": "8.13", "title": "RWSL (Runway Status Lights)", "pages": [80], "merged": false, "html": "<ul>\n<li><strong>RWSL<\/strong> : Runway Status Lights — 활주로 및 유도로 교차지점, 활주로 내<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>등<\/th>\n<th>명칭<\/th>\n<th>위치<\/th>\n<th>신호<\/th>\n<th>의미<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><mark><strong><b class=\"k\">REL<\/b><\/strong><\/mark><\/td>\n<td><b class=\"k\">R<\/b>unway <b class=\"k\">E<\/b>ntrance <b class=\"k\">L<\/b>ight<\/td>\n<td>유도로 → 활주로<\/td>\n<td><b class=\"k\">Red on<\/b><\/td>\n<td>진입금지<\/td>\n<\/tr>\n<tr>\n<td><mark><strong><b class=\"k\">THL<\/b><\/strong><\/mark><\/td>\n<td><b class=\"k\ d>Outbound 이륙 / Inbound 착륙<\/td>\n<\/tr>\n<tr>\n<td><strong>Location Sign<\/strong><\/td>\n<td>내 위치<\/td>\n<td>검정바탕<\/td>\n<td>노란글씨<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>예외<\/td>\n<td><\/td>\n<td>노란바탕<\/td>\n<td>검정그림<\/td>\n<td>RWY Boundary Sign / ILS Critical Boundary Sign<\/td>\n<\/tr>\n<tr>\n<td><strong>RWY Distance Remaining Sign<\/strong><\/td>\n<td><\/td>\n<td>검정바탕<\/td>\n<td>흰색숫자<\/td>\n<td>1,000ft 이상 / 끝부분 1/2 / 양쪽에<\/td>\n<\/tr>\n<tr>\n<td><strong>Mandatory Sign<\/strong><\/td>\n<td>RWY-RWY / RWY-Taxiway / ILS Critical Area / Approach Area / No Entry<\/td>\n<td><\/td>\n<td><\/td>\n<td>Holding Position Sign<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s08-16", "ch": 8, "num": "8.16", "title": "마샬러 (Jepp 1143p)", "pages": [83], "merged": false, "html": "<ul>\n<li>Marshaller → Pilot : 마샬러 항공기 좌측에 위치 — Portside : 탑승구(좌측) / Starboard : 우측<\/li>\n<li>Pilot → Marshaller<\/li>\n<li>Standard Emergency Hand Signal<\/li>\n<\/ul>"}, {"id": "s08-17", "ch": 8, "num": "8.17", "title": "HIRO (High Intensity Runway Operation)", "pages": [6], "merged": false, "html": "<ul>\n<li><strong>High Intensity Runway Operation<\/strong><\/li>\n<li><b class=\"k\">ATIS<\/b>를 통해 사용중인지 확인가능<\/li>\n<li>일반적으로 <b class=\"k\">60초<\/b> 이내에 <b class=\"k\">Vacate<\/b> 해줘야 함<\/li>\n<li>Runway SFC Condition : DRY 일 때만 사용<\/li>\n<li>Low Visibility(X)<\/li>\n<\/ul>"}, {"id": "s09-01", "ch": 9, "num": "9.1", "title": "대기층 구조 / 기온역전", "pages": [46], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>층<\/th>\n<th>기온 변화<\/th>\n<th>특징<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>대류권<\/td>\n<td>고도상승 → 기온하강<\/td>\n<td><strong>Tropo<b class=\"k\">pause<\/b><\/strong> 권계면 : 고도상승 → <b class=\"k\">온도변화없음<\/b> / <b class=\"k\">Lapse rate 멈춤<\/b> / 습도 많고, 온도 높을수록 온도변화 적음<\/td>\n<\/tr>\n<tr>\n<td><b class=\"k\">성층권<\/b><\/td>\n<td><b class=\"k\">기온역전 → 기온증가<\/b><\/td>\n<td><b class=\"k\">오존층<\/b> / ※ 대류권계면 : MCP에 입력함<\/td>\n<\/tr>\n<tr>\n<td>중간권<\/td>\n<td>고도상승 → 기온하강<\/td>\n<td>※ 극지방이 낮음 → -55℃ ~ -65℃ / Surface 기온이 낮기때문에<\/td>\n<\/tr>\n<tr>\n<td><b class=\"k\">열권<\/b><\/td>\n<td><b class=\"k\">기온역전<\/b><\/td>\n<td><b class=\"k\">전리층 (HF)<\/b> / <b class=\"k\">오로라<\/b> — 전리층 반사에 의해 신호 전달<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>Unstable → 상승기류 / Stable → ~~하강기류(X)~~<\/li>\n<\/ul>"}, {"id": "s09-02", "ch": 9, "num": "9.2", "title": "대기안정 / Lapse Rate", "pages": [46], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>Lapse Rate (수분 많음 / Warm air · Hot ↔ Cool · 수분 적음)<\/th>\n<th>값<\/th>\n<th>기준<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Stable<\/strong><\/td>\n<td>Moist Adiabatic Lapse Rate (수분 많음/Warm air)<\/td>\n<td>1.1 ~ 2.8℃<\/td>\n<td>1,000ft<\/td>\n<td>온도에 따라 수분의 양이 다름<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>평균 Adiabatic Lapse Rate<\/td>\n<td>2℃<\/td>\n<td>1,000ft<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>unstable<\/strong><\/td>\n<td>Dry Adiabatic Lapse Rate (수분 적음)<\/td>\n<td>3℃<\/td>\n<td>1,000ft<\/td>\n<td>위로 갈수록 급격히 온도하강 / 온도 많이 변함<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>기온안정 하층부 냉각 : Cooling from Below — 추워지면 공기가 하강하려고 함<\/li>\n<\/ul>"}, {"id": "s09-03", "ch": 9, "num": "9.3", "title": "Dew Point", "pages": [46], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>과정<\/th>\n<th>방향<\/th>\n<th>조건<\/th>\n<th>안개<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>수증기의 증발<\/td>\n<td>Dew Point → Temperature<\/td>\n<td>Dry Air → Moist Surface 지날 때<\/td>\n<td>Steam Fog<\/td>\n<td>시베리아 기단<\/td>\n<\/tr>\n<tr>\n<td>공기의 냉각<\/td>\n<td>Temperature → Dew Point<\/td>\n<td>Cold Surface를 지날 때<\/td>\n<td>Advection Fog<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>Fog 형성<\/li>\n<li><b class=\"k\">Cloud Base = 4℉ (2.2℃) per 1,000ft<\/b> — (현재온도 – 이슬점) / 4 × 1,000 = cloud base<\/li>\n<\/ul>"}, {"id": "s09-04", "ch": 9, "num": "9.4", "title": "안개 (Fog) 종류", "pages": [46, 67], "merged": true, "html": "<ul>\n<li><strong>Fog<\/strong> : 50ft이하 — 안개와 구름의 구분 : Cloud base<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>종류<\/th>\n<th>명칭<\/th>\n<th>조건<\/th>\n<th><\/th>\n<th><\/th>\n<th><\/th>\n<th>비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>전선무 / 복사무<\/td>\n<td><mark><b class=\"k\">Radiation Fog<\/b><\/mark><\/td>\n<td>지표면이 더 차가움 → 지표면 공기 냉각 → 기온이 노점과 가까워져 수분을 방출<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><b class=\"k\">기온역전<\/b> (저기압 관계 X)<\/td>\n<td><mark><b class=\"k\">Clear<\/b><\/mark> 구름X / 열 방출<\/td>\n<td><mark><b class=\"k\">Night<\/b><\/mark> 밤 / 열 유입X<\/td>\n<td><mark><b class=\"k\">Calm<\/b><\/mark> 바람X / 소산X<\/td>\n<td><mark><b class=\"k\">Valley<\/b><\/mark> 분지 / 고여있음<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>땅안개<\/td>\n<td>Ground Fog<\/td>\n<td><b class=\"k\">20ft 미만<\/b> - Radiation Fog / PHAK<\/td>\n<td><\/td>\n<td><\/td>\n<td><b class=\"k\">2m(6ft)<\/b> / 표준교재<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><mark>Ice Fog<\/mark><\/td>\n<td><b class=\"k\">-25 ℉ colder<\/b> / <b class=\"k\">-32℃ colder<\/b> — Radiation Fog와 형성원리는 동일 / 위 온도 이하<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td>얼음입자 / <b class=\"k\">℉=9/5℃+32<\/b><\/td>\n<\/tr>\n<tr>\n<td>이류안개<\/td>\n<td><mark>Advection Fog<\/mark><\/td>\n<td><b class=\"k\">Warm<\/b><\/td>\n<td><b class=\"k\">Moist<\/b><\/td>\n<td>→ Cold Surface<\/td>\n<td><\/td>\n<td>인천공항 안개<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><b class=\"k\">15kt 까지는 심화 / 15kt초과하면 구름으로 변함<\/b><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>증기무<\/td>\n<td><mark>Steam Fog<\/mark><\/td>\n<td><b class=\"k\">Cold<\/b><\/td>\n<td><b class=\"k\">Dry<\/b><\/td>\n<td>→ Warm Water<\/td>\n<td><\/td>\n<td>겨울철 해안가<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td>연관 기상현상 : <mark><b class=\"k\">Icing / Low Level Turbulence<\/b><\/mark><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>활승안개<\/td>\n<td><mark>Upslope Fog<\/mark><\/td>\n<td><b class=\"k\">Stable<\/b><\/td>\n<td><b class=\"k\">Moist<\/b><\/td>\n<td><b class=\"k\">→ Forced up<\/b><\/td>\n<td><b class=\"k\">바람에 강제로 밀려 올라감<\/b><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td>Adiabatic cooling<\/td>\n<td>Expansional cooling<\/td>\n<td><b class=\"k\">단열팽창 의한 기온하강<\/b><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td>풍상 <b class=\"k\">Windward<\/b> — <b class=\"k\">습함<\/b> / Expansional cooling<\/td>\n<td><\/td>\n<td>풍하 <b class=\"k\">leeward<\/b> — <b class=\"k\">기온상승<\/b> / <b class=\"k\">Compressional Heating<\/b><\/td>\n<td><\/td>\n<td><b class=\"k\">푄 현상<\/b><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><mark>Precipitation-induced Fog<\/mark> <mark><b class=\"k\">= Frontal Fog<\/b><\/mark><\/td>\n<td><b class=\"k\">Warm air (수분많음)<\/b> → Cold Air — <b class=\"k\">타고 올라가면서 Cooling<\/b> → <b class=\"k\">비가 옴<\/b><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><b class=\"k\">Warm Front 더 발생<\/b><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td>Temperature → Dew Point — <b class=\"k\">Rain 형성<\/b> / <b class=\"k\">Warm Rain<\/b> → Cold Air / Dew Point → Temperature — <b class=\"k\">Dew가 올라가면서 안개형성<\/b><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Fog 생성 원리 정리<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>원인<\/th>\n<th><\/th>\n<th>결과<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>공기상승<\/td>\n<td><b class=\"k\">단열팽창<\/b><\/td>\n<td>→ 냉각<\/td>\n<\/tr>\n<tr>\n<td>찬공기 + 더운공기<\/td>\n<td><\/td>\n<td>→ 난기냉각<\/td>\n<\/tr>\n<tr>\n<td>야간 지면복사<\/td>\n<td><\/td>\n<td>→ 공기냉각<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s09-05", "ch": 9, "num": "9.5", "title": "고기압/저기압 (북반구 기준) / 바람의 종류", "pages": [52], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>구분<\/th>\n<th>회전<\/th>\n<th>기류<\/th>\n<th><\/th>\n<th>지형<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><b class=\"k\">고기압<\/b><\/td>\n<td><b class=\"k\">Anticyclone / 시계방향<\/b> <span class=\"fix\" title=\"정리하면서 확인·수정한 부분\">✎ 원본은 고기압=Cyclone, 저기압=Anti-Cyclone으로 반대로 적혀 있었음<\/span><\/td>\n<td><b class=\"k\">위에서 눌러서<\/b><\/td>\n<td><b class=\"k\">나감<\/b><\/td>\n<td><b class=\"k\">기압능(Ridge)<\/b><\/td>\n<td><strong><b class=\"k\">고능R (마루)<\/b><\/strong><\/td>\n<\/tr>\n<tr>\n<td><b class=\"k\">저기압<\/b><\/td>\n<td><b class=\"k\">Cyclone / 반시계방향<\/b><\/td>\n<td><b class=\"k\">공기 없으니<\/b><\/td>\n<td><b class=\"k\">들어옴<\/b><\/td>\n<td><b class=\"k\">기압골(Trough)<\/b><\/td>\n<td><strong><b class=\"k\">저골T<\/b><\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>바람<\/th>\n<th>힘의 평형<\/th>\n<th>암기<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>지균풍<\/strong><\/td>\n<td>기압경도 – 전향력 평형<\/td>\n<td>지균 – 경전<\/td>\n<\/tr>\n<tr>\n<td><strong>경도풍<\/strong><\/td>\n<td>기압경도 – 전향력 – 원심력 평형<\/td>\n<td>경도 – 경전원<\/td>\n<\/tr>\n<tr>\n<td><strong>선형풍<\/strong><\/td>\n<td>기압경도 – 원심력 평형<\/td>\n<td>선형 – 경원<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s09-06", "ch": 9, "num": "9.6", "title": "기단 / 전선", "pages": [52], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>기단<\/th>\n<th>성질<\/th>\n<th>영향<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>시베리아<\/td>\n<td><b class=\"k\">cP / 한랭건조<\/b><\/td>\n<td>겨울(눈)<\/td>\n<\/tr>\n<tr>\n<td>오호츠크<\/td>\n<td><b class=\"k\">mP / 한랭다습<\/b><\/td>\n<td>장마전선 형성 (정체전선)<\/td>\n<\/tr>\n<tr>\n<td>양쯔강<\/td>\n<td><b class=\"k\">cT / 고온건조<\/b><\/td>\n<td>봄/가을<\/td>\n<\/tr>\n<tr>\n<td>북태평양<\/td>\n<td><b class=\"k\">mT / 고온다습<\/b><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>적도<\/td>\n<td><\/td>\n<td>태풍<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"figs\"><figure><img src=\"img/i-052-026.webp\" alt=\"한반도 주변 기단\" loading=\"lazy\"><figcaption>한반도 주변 기단<\/figcaption><\/figure><\/div>\n<p><strong>전선<\/strong> — 기온, 기압, 바람의 변화 / 상층풍 전선 가로지를 때 → 이동빠름<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>전선<\/th>\n<th>바람<\/th>\n<th>기온 / 기압<\/th>\n<th>특징<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>온난전선<\/strong><\/td>\n<td>남서 ← <b class=\"k\">남동<\/b><\/td>\n<td>기온 <b class=\"k\">상승<\/b> / 기압 <b class=\"k\">하강<\/b><\/td>\n<td><b class=\"k\">느림<\/b> / 넓은 지속 강수 / 층운형<\/td>\n<\/tr>\n<tr>\n<td><strong>한랭전선<\/strong><\/td>\n<td>북서 ← <b class=\"k\">남서↑<\/b><\/td>\n<td>기온 <b class=\"k\">하강<\/b> / 기압 <b class=\"k\">상승<\/b><\/td>\n<td><b class=\"k\">빠름<\/b> / 좁은 소낙 강수 / 적운형<\/td>\n<\/tr>\n<tr>\n<td><strong>정체전선<\/strong><\/td>\n<td><b class=\"k\">장마 + 저기압<\/b><\/td>\n<td><\/td>\n<td>바람이 평행하게 분다<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s09-07", "ch": 9, "num": "9.7", "title": "전선 — Frontal Wave / Stationary Front / 기압", "pages": [46], "merged": false, "html": "<p><strong>Frontal Wave<\/strong> (Gleim ATPL 781p)\n- Jet Stream의 영향으로 교착현상\n- Cold Front 사이에 Warm Front 껴있는 현상\n- <b class=\"k\">Slow moving Cold Front<\/b>, <b class=\"k\">Stationary Front<\/b> 에서 발생가능\n- ※<b class=\"k\">Cold Front<\/b> (이동빠름) / 지나가면 고기압형성 / 하강기류 / Stable Air 날씨가 좋아짐<\/p>\n<p><strong>Stationary Front (정체전선)<\/strong>\n- 2개의 다른 기단이 멈춰있는 현상 — Cold Front (High P) / Warm Front (Low P)\n- <b class=\"k\">수직이동이 정상이지만, Coriolis Effect로 전선을 평행하게 바람이 불게 만든다.<\/b>\n- <b class=\"k\">Cold Front<\/b> — <b class=\"k\">기온 하강 / 기압 상승<\/b><\/p>\n<p><strong>비행기가 Cold Airmass(하강기류)를 지나면, <b class=\"k\">차가워지고 High Pressure<\/b>가 된다. (<b class=\"k\">기압이 상승<\/b>한다)<\/strong>\n- 겨울이 기압이 높음 (극단적으로 1,040hpa) / 겨울에 몸을 눌러줌 / 여름에 뼈가 아프다(?)<\/p>"}, {"id": "s09-08", "ch": 9, "num": "9.8", "title": "Coriolis Force / ITCZ", "pages": [46], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>위치<\/th>\n<th>전향력<\/th>\n<th>특징<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>극지방<\/td>\n<td>최대<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><b class=\"k\">적도지방<\/b><\/td>\n<td><b class=\"k\">최소<\/b><\/td>\n<td>열대수렴대 / 상승기류 → <b class=\"k\">대류성 기상현상<\/b> — Line of Thunderstorm<br>낮에 엄청 뜨거워짐 — Intertropical Convergence Zone (ITCZ)<br>강한 난기류 + 뇌우<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>ITCZ<\/strong> 는 적도 부근 무역풍이 만나 수렴하면서 대류활동, 폭우, 적란운, 뇌우 등 만들어냄<\/li>\n<\/ul>"}, {"id": "s09-09", "ch": 9, "num": "9.9", "title": "Jet Stream", "pages": [46], "merged": false, "html": "<div class=\"figs\"><figure><img src=\"img/i-047-024.webp\" alt=\"Jet Stream — Polar Cell / Ferrel Cell / Hadley Cell, Polar Jet · Subtropical Jet\" loading=\"lazy\"><figcaption>Jet Stream — Polar Cell / Ferrel Cell / Hadley Cell, Polar Jet · Subtropical Jet<\/figcaption><\/figure><\/div>\n<ul>\n<li><b class=\"k\">50knot 이상<\/b> — <b class=\"k\">SigWX : 80knot 이상을 표현함<\/b><\/li>\n<li>Jet stream : Cell 경계선에서 발생<\/li>\n<li>Jet Core(max wind) 중 Polar Side 쪽이 가장 강함(windshear)<\/li>\n<li><b class=\"k\">겨울<\/b>에 강함 / <b class=\"k\">남하<\/b> / <b class=\"k\">서 → 동 (편서풍)<\/b><\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>구분<\/th>\n<th>위치<\/th>\n<th>특징<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><b class=\"k\">Polar Jet<\/b><\/td>\n<td>Polar Cell – Ferrel Cell<\/td>\n<td><b class=\"k\">고도 낮으나 강도 더 강함<\/b><\/td>\n<td>대류권계면 고도 낮음<\/td>\n<\/tr>\n<tr>\n<td>Subtropical Jet<\/td>\n<td>Ferrel Cell – Hadley Cell<\/td>\n<td>고도가 더 높음<\/td>\n<td>대류권계면 Break에서 발생<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>※대류권계면(-55° ~ -65°) / 극지방 SFC 온도 낮음 → 대류권계면 온도 금방 도달하기 때문에 낮음<\/li>\n<li>※CAT : Polar side jet stream에서 가장 심각하게 발생 → 바람이 속도가 빠르게 변화하기 때문에<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><b class=\"k\">아열대 지방<\/b> — <b class=\"k\">Moisture<\/b><\/th>\n<th>구름<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><b class=\"k\">Cirrus<\/b> / 권운 / 깃털모양<\/td>\n<td>상층운<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Alto<\/td>\n<td>고층운<\/td>\n<td>Cumulonimbus / Towering Cumulus<\/td>\n<\/tr>\n<tr>\n<td>Stratus<\/td>\n<td>하층운<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s09-10", "ch": 9, "num": "9.10", "title": "열대저기압 Tropical Cyclone (34-64)", "pages": [46], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>구분<\/th>\n<th>기준<\/th>\n<th>표준교재<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Tropical Depression<\/td>\n<td>34kt 미만<\/td>\n<td>열대성 저기압 최대 34kt<\/td>\n<\/tr>\n<tr>\n<td>Tropical Storm<\/td>\n<td>34 ~ 64kt 미만<\/td>\n<td>열대성 폭풍우 35 ~ 64kt<\/td>\n<\/tr>\n<tr>\n<td>Hurricane / Typhoon / Cyclone<\/td>\n<td>64kt 이상<\/td>\n<td>허리케인 최소 65kt<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s09-11", "ch": 9, "num": "9.11", "title": "Microburst", "pages": [43], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th>값<\/th>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Microburst 하강기류<\/td>\n<td><b class=\"k\">최대 6,000FPM<\/b><\/td>\n<td><b class=\"k\">Nominal Depth(Vertical)<\/b><\/td>\n<td><b class=\"k\">1,000ft<\/b> → 하강기류가 영향을 미치는 깊이<\/td>\n<\/tr>\n<tr>\n<td>Head Wind<\/td>\n<td><b class=\"k\">30~90kt<\/b><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>직경<\/td>\n<td><b class=\"k\">1~2NM<\/b><\/td>\n<td><b class=\"k\">Virga<\/b>와 연관<\/td>\n<td>Virga of Cloud base → 하강기류가 강해 꼬리구름이 생기는 것<\/td>\n<\/tr>\n<tr>\n<td>생애주기<\/td>\n<td><b class=\"k\">5~15분<\/b><\/td>\n<td>대류성 강수와 연관<\/td>\n<td>Convective Precipitation into Dry air<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>징후<\/strong>\n1. Convective Precipitation into <b class=\"k\">Dry<\/b> air\n2. <b class=\"k\">Intense rain shaft<\/b> at the <b class=\"k\">surface<\/b>\n3. <b class=\"k\">Virga<\/b> at cloud base &amp; <b class=\"k\">Blowing dust<\/b><\/p>"}, {"id": "s09-12", "ch": 9, "num": "9.12", "title": "OAT / SAT / TAT", "pages": [20], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>구분<\/th>\n<th>의미<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>OAT = SAT<\/td>\n<td>OAT : 외기온도 그 자체<\/td>\n<td>SAT : 역산추정 OAT (TAT(RAT) – RAM Rise air)<\/td>\n<\/tr>\n<tr>\n<td>RAT = TAT<\/td>\n<td>RAT : 마찰열 RAM Rise 반영<\/td>\n<td>실제 항공기가 느끼는 온도<\/td>\n<\/tr>\n<tr>\n<td>저속<\/td>\n<td>고속항공기<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s09-13", "ch": 9, "num": "9.13", "title": "바람 보고 — VRB / Gust / Calm (에프FOM 182p)", "pages": [43], "merged": false, "html": "<ul>\n<li>바람을 적용할 때는 <b class=\"k\">가장 불리한 방향<\/b>을 적용한다. (ex. Tail wind or Cross wind로 적용) / <b class=\"k\">Text 진북 기준 (듣자)<\/b><\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>METAR / SPECI<\/th>\n<th><\/th>\n<th>MET REPORT / SPECIAL<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>00000<\/strong><\/td>\n<td>풍속 1kt 미만<\/td>\n<td>“Calm”<\/td>\n<td>풍속 1kt 미만<\/td>\n<\/tr>\n<tr>\n<td><strong>“P”<\/strong><\/td>\n<td>풍속 100kt 이상<\/td>\n<td>“ABV99”<\/td>\n<td>풍속 100kt 이상<\/td>\n<\/tr>\n<tr>\n<td><strong>GUST<\/strong><\/td>\n<td>돌풍 10Kt 이상 차이날 때 ‘최대풍’만 표시<\/td>\n<td><\/td>\n<td><b class=\"k\">Max<\/b>imum / <b class=\"k\">Min<\/b>imum 표시함<\/td>\n<\/tr>\n<tr>\n<td><strong>VRB<\/strong><\/td>\n<td>풍향 180° 이상 <b class=\"k\">or<\/b> 평균 풍속 관측 불가능할 때<\/td>\n<td>VRB<\/td>\n<td>풍향풍속 X / 양극단X<\/td>\n<\/tr>\n<tr>\n<td><strong>VRB<\/strong><\/td>\n<td>3kt 미만 — 60° ~ 180° 미만으로 변화할 때<\/td>\n<td>VRB<\/td>\n<td>풍향풍속 X / 10분간 풍향 양 극단 표시<\/td>\n<\/tr>\n<tr>\n<td><strong>“V”<\/strong><\/td>\n<td>3kt 이상 — 60° ~ 180° 미만으로 변화할 때<\/td>\n<td>VRB<\/td>\n<td>평균 풍속/풍향 10분간 풍향 양 극단 표시<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>*MET REPORT/SPECIAL → <strong>ATIS 자북 변경<\/strong> / Text is True, Radio is Magnetic<\/li>\n<\/ul>"}, {"id": "s09-14", "ch": 9, "num": "9.14", "title": "기상기호 (METAR 현재일기)", "pages": [46], "merged": false, "html": "<p><strong><mark>수식어<\/mark><\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>기호<\/th>\n<th>의미<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>-<\/strong><\/td>\n<td>Light<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>(없음)<\/td>\n<td>Moderate<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>+<\/strong><\/td>\n<td>Heavy<\/td>\n<td>강도 : <strong>강수 / 폭풍 / Funnel Cloud<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Terminal Area<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>기호<\/th>\n<th>의미<\/th>\n<th>거리<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>(없음)<\/td>\n<td>공항<\/td>\n<td>8km 이내<\/td>\n<td>5NM 이내<\/td>\n<\/tr>\n<tr>\n<td><strong>VC<\/strong><\/td>\n<td>Vicinity / <b class=\"k\">METAR/SPECI<\/b><\/td>\n<td>8~16km<\/td>\n<td>5~10NM<\/td>\n<\/tr>\n<tr>\n<td><strong>DSNT<\/strong><\/td>\n<td>Distant<\/td>\n<td>16km 이상<\/td>\n<td>10NM 이상<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>강도 보고<\/strong>\n- METAR / SPECI : + 또는 -\n- MET REPORT / Special : <b class=\"k\">SEV / MOD / HVY<\/b>\n- <strong>UP<\/strong> : Unknown Precipitation — 자동관측시스템 only<\/p>\n<p><strong><mark>상태<\/mark> (Descriptor)<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>기호<\/th>\n<th>의미<\/th>\n<th>뜻<\/th>\n<th><\/th>\n<th>비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>FZ<\/strong><\/td>\n<td><b class=\"k\">Freezing<\/b><\/td>\n<td><\/td>\n<td><\/td>\n<td><b class=\"k\">FG, RA, DZ only<\/b><\/td>\n<\/tr>\n<tr>\n<td><strong>MI<\/strong> (FG)<\/td>\n<td>Shallow<\/td>\n<td><b class=\"k\">2m<\/b> 미만의 땅안개<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>BC<\/strong> (FG)<\/td>\n<td>Patches<\/td>\n<td><b class=\"k\">산재한<\/b> / 군데군데 있음<\/td>\n<td><\/td>\n<td>우시정 안좋음<\/td>\n<\/tr>\n<tr>\n<td><strong>PR<\/strong> (FG)<\/td>\n<td>Partial<\/td>\n<td><b class=\"k\">부분적<\/b>으로 / 상당히 많은 부분<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>DR<\/strong><\/td>\n<td>Low Drifting<\/td>\n<td>낮게 날림<\/td>\n<td>2m 미만<\/td>\n<td>먼지, 모래, 눈 only<\/td>\n<\/tr>\n<tr>\n<td><strong>BL<\/strong><\/td>\n<td>Blowing<\/td>\n<td>높게 날림<\/td>\n<td><b class=\"k\">2m<\/b> 이상<\/td>\n<td><b class=\"k\">DU, SA, SN<\/b><\/td>\n<\/tr>\n<tr>\n<td><strong>TS<\/strong><\/td>\n<td>Thunderstorm<\/td>\n<td>뇌우<\/td>\n<td>비 강도보고<\/td>\n<td>RA, SN, PL, GR, GS<\/td>\n<\/tr>\n<tr>\n<td><strong>SH<\/strong><\/td>\n<td>Shower<\/td>\n<td>소낙성<\/td>\n<td>VCSH<\/td>\n<td>RA, SN, GR, GS<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong><mark>강수<\/m : 1,000m 미만이라도<\/td>\n<\/tr>\n<tr>\n<td>먼지<\/td>\n<td><strong>VA<\/strong><\/td>\n<td>Volcanic Ash<\/td>\n<td>화산재<\/td>\n<td>관측범위 8km 이하<\/td>\n<\/tr>\n<tr>\n<td>먼지<\/td>\n<td><strong>DU<\/strong><\/td>\n<td>Dust widespread<\/td>\n<td>넓게 퍼진 먼지(황사)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>먼지<\/td>\n<td><strong>SA<\/strong><\/td>\n<td>Sand<\/td>\n<td>모래<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong><mark>기타<\/mark><\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>기호<\/th>\n<th>명칭<\/th>\n<th>뜻<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>PO<\/strong><\/td>\n<td>Dust/sand Whirls(devil)<\/td>\n<td>먼지/모래 소용돌이<\/td>\n<\/tr>\n<tr>\n<td><strong>SS<\/strong><\/td>\n<td><b class=\"k\">Sandstorm<\/b><\/td>\n<td>모래폭풍<\/td>\n<\/tr>\n<tr>\n<td><strong>DS<\/strong><\/td>\n<td><b class=\"k\">Dust Storm<\/b><\/td>\n<td>먼지폭풍<\/td>\n<\/tr>\n<tr>\n<td><strong>FC<\/strong><\/td>\n<td>Funnel cloud<\/td>\n<td>깔때기 구름 — 토네이도/용오름 <b class=\"k\">+FC<\/b><\/td>\n<\/tr>\n<tr>\n<td><strong>SQ<\/strong><\/td>\n<td>Squall<\/td>\n<td>스콜 — 1분 지속 16kt/22kt 이상 강한 <b class=\"k\">돌풍<\/b><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>SS / DS<\/strong> : 보통 및 강한 강도only<\/li>\n<li><strong>VC와 함께 쓰는 것<\/strong> : FG · PO · FC · DS · SS · TS · SH / BLSN · BLSA · BLDU · VA<\/li>\n<\/ul>"}, {"id": "s09-15", "ch": 9, "num": "9.15", "title": "기상약어 (GS / SG / RA)", "pages": [43], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>약어<\/th>\n<th>명칭<\/th>\n<th>크기<\/th>\n<th>투명도<\/th>\n<th>비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>GS<\/strong><\/td>\n<td>Small <b class=\"k\">Hail<\/b><\/td>\n<td>5mm 이하의 우박<\/td>\n<td><b class=\"k\">투명한<\/b><\/td>\n<td>둘 다 얼음입자<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><b class=\"k\">Snow Pellet<\/b><\/td>\n<td><b class=\"k\">5mm<\/b> 이하의 얼음덩어리<\/td>\n<td><b class=\"k\">불투명<\/b><\/td>\n<td>Snow : 불투명 / pellet : 5mm 이하<\/td>\n<\/tr>\n<tr>\n<td><strong>SG<\/strong><\/td>\n<td><b class=\"k\">Snow<\/b> Grain<\/td>\n<td>1mm 미만의 얼음입자<\/td>\n<td><b class=\"k\">불투명<\/b><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>RA<\/strong><\/td>\n<td>Rain<\/td>\n<td>0.5mm 이상<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s09-16", "ch": 9, "num": "9.16", "title": "운량 / 지상일기도 기호 (Station Model)", "pages": [43], "merged": false, "html": "<ul>\n<li>10kt → <b class=\"k\">1/2<\/b> → 5m/s (바람 깃 1개 = 10kt)<\/li>\n<li>기압 표기 : 280 → 10 <b class=\"k\">28.0<\/b> (1028.0 hPa)<\/li>\n<\/ul>\n<div class=\"figs\"><figure><img src=\"img/i-045-021.webp\" alt=\"지상일기도 기입 예시 (풍향/풍속, 기온, 일기, 기압, 운량)\" loading=\"lazy\"><figcaption>지상일기도 기입 예시 (풍향/풍속, 기온, 일기, 기압, 운량)<\/figcaption><\/figure>\n<figure><img src=\"img/i-045-022.webp\" alt=\"운량 기호 (0~8 Oktas, Sky obscured)\" loading=\"lazy\"><figcaption>운량 기호 (0~8 Oktas, Sky obscured)<\/figcaption><\/figure><\/div>"}, {"id": "s09-17", "ch": 9, "num": "9.17", "title": "METAR / SPECI / MET REPORT / TAF / ATIS", "pages": [50, 52], "merged": true, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>보고<\/th>\n<th>평균<\/th>\n<th><\/th>\n<th>비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>METAR<\/strong><\/td>\n<td><b class=\"k\">10분<\/b> 평균값<\/td>\n<td><b class=\"k\">현저한 불연속<\/b> 후 10분<\/td>\n<td>METAR : Aviation Routine Weather Report<\/td>\n<\/tr>\n<tr>\n<td><strong>MET REP<\/strong><\/td>\n<td><b class=\"k\">바람 2분 평균<\/b><\/td>\n<td><b class=\"k\">RVR/VIS 1분<\/b> 평균<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>목적<\/th>\n<th>정시<\/th>\n<th>특별<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>FLT PLAN을 위해서<\/td>\n<td><strong>METAR<\/strong><\/td>\n<td><strong>SPECI<\/strong><\/td>\n<\/tr>\n<tr>\n<td>이착륙 항공기를 위해서 / 우시정X, 활주로 개별보고<\/td>\n<td>Local Routine — MET Report (국지정시보고)<\/td>\n<td>Local Special — Special Report (국지특별보고)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong><b class=\"k\">METAR → SPECI 변경 기준<\/b><\/strong> — 인천공항 SPECI 없음(METAR 30분 단위 보고)<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>기준<\/th>\n<th><\/th>\n<th><\/th>\n<th><\/th>\n<th><\/th>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>W<\/strong> (Wind)<\/td>\n<td>1. <b class=\"k\">평균 풍향변동 60°이상<\/b> — <b class=\"k\">변화 전후(둘중 하나라도) 평균풍속이 10kt이상<\/b> 변화<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>2. <b class=\"k\">평균풍속 10Kt이상 변화<\/b><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>3. <b class=\"k\">GUST 10kt이상 변화<\/b> — <b class=\"k\">변화 전후 평균풍속이 15kt이상 변화<\/b><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>V<\/strong> (Visibility)<\/td>\n<td><mark><b class=\"k\">800m<\/b><\/mark> CAT1 minima<\/td>\n<td><mark><b class=\"k\">1500m<\/b><\/mark> Special VFR<\/td>\n<td><mark><b class=\"k\">3000m or 5000m<\/b><\/mark> VFR(ICAO 1,500ft / 5km 이상)<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>R<\/strong> (RVR)<\/td>\n<td><mark><b class=\"k\">50m<\/b><\/mark><\/td>\n<td>CAT3b <mark><b class=\"k\">175m<\/b><\/mark><\/td>\n<td>CAT3a <mark><b class=\"k\">300m<\/b><\/mark><\/td>\n<td>CAT2 <mark><b class=\"k\">550m<\/b><\/mark><\/td>\n<td>CAT1 <mark><b class=\"k\">800m<\/b><\/mark><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>W<\/strong> (Weather) 시작·종료·강도<\/td>\n<td>어는 강수<\/td>\n<td>보통/강한 강수<\/td>\n<td>천둥번개(강수)<\/td>\n<td>먼지폭풍<\/td>\n<td>모래폭풍<\/td>\n<td>깔때기구름<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>시작·종료<\/td>\n<td>어는 안개<\/td>\n<td>천둥번개(no강수)<\/td>\n<td>낮게 날린 먼지, 모래, 눈<\/td>\n<td>높게 날린 먼지, 모래, 눈<\/td>\n<td>스콜<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>C<\/strong> (Cloud)<\/td>\n<td><mark>1,500ft미만<\/mark> Ceiling이 생기거나 없어지는 경우<\/td>\n<td>SCT → BKN or OVC<\/td>\n<td>OVC or BKN → SCT<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>BKN or OVC / Ceiling 상승 또는 하강<\/td>\n<td><mark><b class=\"k\">100ft/30m<\/b><\/mark><\/td>\n<td><mark><b class=\"k\">200ft/60m<\/b><\/mark><\/td>\n<td><mark><b class=\"k\">500ft/150m<\/b><\/mark><\/td>\n<td><mark><b class=\"k\">1000ft/300m<\/b><\/mark><\/td>\n<td><mark><b class=\"k\">1500ft/450m<\/b><\/mark><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>수직시정<\/td>\n<td>하늘 차폐(대기먼지, 물 현상)<\/td>\n<td><mark><b class=\"k\">100ft/30m<\/b><\/mark><\/td>\n<td><mark><b class=\"k\">200ft/60m<\/b><\/mark><\/td>\n<td><mark><b class=\"k\">500ft/150m or 1000ft/300m<\/b><\/mark><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>※ 강수/시정장애로 하늘 차폐 : 2,000ft까지 100ft 간격으로 보고 — <b class=\"k\">///<\/b> <b class=\"k\">관측불가<\/b> / <b class=\"k\">VV002<\/b> = <b class=\"k\">200ft<\/b><\/li>\n<\/ul>\n<blockquote>\n<p>※ <strong><b class=\"k\">NSC<\/b><\/strong> : Nil Significant Cloud : 운항상 중요한 구름이 없음 / <strong>CAVOK 사용 불가할 때(운항상 중요 구름<b class=\"k\">X<\/b> / 시정10km이상 / 중요일기<b class=\"k\">X<\/b>)<\/strong>\n1. 5,000ft(MSL) 또는 Highest MSA(MSL) 둘 중 높은 고도 아래 Cloud Base 있는 구름 없음 / 2. Cloud Base와 관계없이 CB or TC<\/p>\n<p>※ <strong><b class=\"k\">NCD<\/b><\/strong> : No Cloud Detected : 자동관측장비 구름 없음 — <strong>SKC<\/strong> 사람관측 Clear / <strong>CLR<\/strong> 자동관측 Clear 12,000ft 아래 구름 (X)<\/p>\n<p>※ <strong><b class=\"k\">NSW<\/b><\/strong> : Nil Significant Weather : 중요일기가 종료될 것으로 예상 / 강수, 안개, 먼지보라 등 — ※ <strong><b class=\"k\">NOSIG<\/b><\/strong> : No Significant Change<\/p>\n<\/blockquote>\n<p><strong>보고 순서 비교<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>공항<b class=\"k\">예보<\/b> TAF — <strong>CATT (CN) WVW CC<\/strong><\/th>\n<th><\/th>\n<th>정시관측<b class=\"k\">보고<\/b> METAR / SPECI / MET REPORT — <strong>CAT (CAN) WVRWC TQS<\/strong><\/th>\n<th><\/th>\n<th>ATIS — <strong>CAT WVRWC TQDA<\/strong><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>C<\/strong><\/td>\n<td>Code : TAF AMD(수정) / TAF COR(오타)<\/td>\n<td><strong>C<\/strong><\/td>\n<td>Code : METAR or SPECI or MET REPORT<\/td>\n<td><strong>C<\/strong><\/td>\n<td>Code : information <b class=\"k\">Bravo<\/b><\/td>\n<\/tr>\n<tr>\n<td><strong>A<\/strong><\/td>\n<td>Aerodrome<\/td>\n<td><strong>A<\/strong><\/td>\n<td>Aerodrome : location<\/td>\n<td><strong>A<\/strong><\/td>\n<td>Aerodrome<\/td>\n<\/tr>\n<tr>\n<td><strong>T<\/strong><\/td>\n<td>Time : issue<\/td>\n<td><strong>T<\/strong><\/td>\n<td>Time<\/td>\n<td><strong>T<\/strong><\/td>\n<td>Time<\/td>\n<\/tr>\n<tr>\n<td><strong>T<\/strong><\/td>\n<td><b class=\"k\">Time : Valid (유효시간)<\/b><\/td>\n<td><strong>C<\/strong><\/td>\n<td><b class=\"k\">Correction<\/b> : 오타있을 경우 시간포함, C 와 A 사이 (조건적 나옴)<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>C<\/strong><\/td>\n<td><b class=\"k\">Cancel<\/b><\/td>\n<td><strong>A<\/strong><\/td>\n<td><b class=\"k\">Auto<\/b> : 모든 관측이 자동관측 / CAT 뒤에 (조건적 나옴)<\/td>\n<td><strong>A<\/strong><\/td>\n<td><mark><b class=\"k\">5SM 이상 / 5,000ft 이상<\/b><\/mark><\/td>\n<\/tr>\n<tr>\n<td><strong>N<\/strong><\/td>\n<td><b class=\"k\">Nil<\/b><\/td>\n<td><strong>N<\/strong><\/td>\n<td><b class=\"k\">Nil<\/b> : 보고되지 않을 경우 / CAT 뒤에 (조건적 나옴)<\/td>\n<td><strong>N<\/strong><\/td>\n<td><mark><b class=\"k\">Ceiling / VIS 생략가능<\/b><\/mark><\/td>\n<\/tr>\n<tr>\n<td><strong>W<\/strong><\/td>\n<td><b class=\"k\">W<\/b>ind : Surface Wind<\/td>\n<td><strong>W<\/strong><\/td>\n<td><b class=\"k\">W<\/b>ind : Direction &amp; Speed<\/td>\n<td><strong>W<\/strong><\/td>\n<td>Wind<\/td>\n<\/tr>\n<tr>\n<td><strong>V<\/strong><\/td>\n<td><b class=\"k\">V<\/b>isibility<\/td>\n<td><strong>V<\/strong><\/td>\n<td><b class=\"k\">V<\/b>isibility (SPECI 변동 항목)<\/td>\n<td><strong>V<\/strong><\/td>\n<td>Visibility<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><strong>R<\/strong><\/td>\n<td><b class=\"k\">R<\/b>VR (<b class=\"k\">METAR ONLY<\/b>)<\/td>\n<td><strong>R<\/strong><\/td>\n<td>RVR (나오는 경우 있음)<\/td>\n<\/tr>\n<tr>\n<td><strong>W<\/strong><\/td>\n<td><b class=\"k\">W<\/b>eather : <b class=\"k\">Tx / Tn 최대2<\/b><\/td>\n<t  src=\"img/i-056-030.webp\" alt=\"현상기호 표시 및 설명 — ① 중요기상현상\" loading=\"lazy\"><figcaption>현상기호 표시 및 설명 — ① 중요기상현상<\/figcaption><\/figure>\n<figure><img src=\"img/i-056-031.webp\" alt=\"② 전선, 수렴대, 기타 기호 — 제트기류 표기\" loading=\"lazy\"><figcaption>② 전선, 수렴대, 기타 기호 — 제트기류 표기<\/figcaption><\/figure>\n<figure><img src=\"img/i-056-032.webp\" alt=\"③ 현상 구역 표시\" loading=\"lazy\"><figcaption>③ 현상 구역 표시<\/figcaption><\/figure><\/div>\n<blockquote>\n<p><strong><b class=\"k\">140kt(X) → 120kt 수정필요<\/b><\/strong> (Jepp 500p) — 최대풍속이 120kt라면, 80kt이상의 구역을 표시 해야함<\/p>\n<\/blockquote>\n<div class=\"figs\"><figure><img src=\"img/i-056-033.webp\" alt=\"공항 등화 배치도\" loading=\"lazy\"><figcaption>공항 등화 배치도<\/figcaption><\/figure>\n<figure><img src=\"img/i-056-034.webp\" alt=\"Runway / Taxiway Lighting 배치도\" loading=\"lazy\"><figcaption>Runway / Taxiway Lighting 배치도<\/figcaption><\/figure><\/div>"}, {"id": "s09-27", "ch": 9, "num": "9.27", "title": "PIREP / Icing, Turbulence, Wind Shear 보고", "pages": [55], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Position Report<\/th>\n<th><\/th>\n<th>Icing<\/th>\n<th><\/th>\n<th>Turbulence<\/th>\n<th>Wind Shear<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><mark><strong>I<\/strong><\/mark><\/td>\n<td><b class=\"k\">I<\/b>dentification<\/td>\n<td><mark><strong>I<\/strong><\/mark><\/td>\n<td>AC <b class=\"k\">ID<\/b><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><mark><strong>P<\/strong><\/mark><\/td>\n<td><b class=\"k\">P<\/b>osition<\/td>\n<td><mark><strong>P<\/strong><\/mark><\/td>\n<td><b class=\"k\">P<\/b>osition / Location<\/td>\n<td>Position / Location<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><mark><strong>T<\/strong><\/mark><\/td>\n<td><b class=\"k\">T<\/b>ime<\/td>\n<td><mark><strong>T<\/strong><\/mark><\/td>\n<td><b class=\"k\">T<\/b>ime (UTC)<\/td>\n<td>Time (UTC)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><strong>I<\/strong><\/td>\n<td>Intensity Type<\/td>\n<td>Intensity TB / Related Cloud<\/td>\n<td>Wind Speed / Wind Direction<\/td>\n<\/tr>\n<tr>\n<td><mark><strong>A<\/strong><\/mark><\/td>\n<td><b class=\"k\">A<\/b>LT(FL)<\/td>\n<td><mark><strong>A<\/strong><\/mark><\/td>\n<td><b class=\"k\">A<\/b>LT (FL)<\/td>\n<td>ALT (FL)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><mark><strong>P<\/strong><\/mark><\/td>\n<td>Next <b class=\"k\">P<\/b>oint 이름 + ETA<\/td>\n<td><strong>T<\/strong><\/td>\n<td><b class=\"k\">AC<\/b> Type<\/td>\n<td>AC Type<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><mark><strong>P<\/strong><\/mark><\/td>\n<td>Next Next <b class=\"k\">P<\/b>oint 이름<\/td>\n<td><strong>I<\/strong><\/td>\n<td><b class=\"k\">IAS<\/b><\/td>\n<td>Duration TB (occasion, Frequent, Continuous)<\/td>\n<td>예기치 않은 변화<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><strong>O<\/strong><\/td>\n<td><b class=\"k\">OAT<\/b><\/td>\n<td><\/td>\n<td>~~Negative, Positive~~<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Icing<\/strong> — <b class=\"k\">Visible Moisture<\/b><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>기호<\/th>\n<th>강도<\/th>\n<th>내용<\/th>\n<th>축적량<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td>Trace<\/td>\n<td>얼음감지, 승화속도보다 약간 빠름<\/td>\n<td>시간당 <b class=\"k\">1/4인치<\/b>(6mm) 미만<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>Light<\/td>\n<td>icing 축적 속도 느림 / De-icing <b class=\"k\">가끔<\/b><\/td>\n<td>시간당 <b class=\"k\">1/4 ~ 1인치<\/b>(2.5cm)<\/td>\n<\/tr>\n<tr>\n<td>--<\/td>\n<td>Moderate<\/td>\n<td>Icing 축적 속도 빠름 / De-icing <b class=\"k\">자주<\/b><\/td>\n<td>시간당 <b class=\"k\">1~3인치<\/b>(7.5cm)<\/td>\n<\/tr>\n<tr>\n<td>---<\/td>\n<td>Severe<\/td>\n<td>축적속도 매우 빠름 / De-Anti-icing 제거불가<\/td>\n<td>시간당 <b class=\"k\">3인치<\/b>(7.5cm) 이상 / <b class=\"k\">즉시이탈<\/b><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>종류<\/th>\n<th>특징<\/th>\n<th>냉각<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Rime icing<\/strong><\/td>\n<td>Rough, milky, 불투명, small super cooled<\/td>\n<td>순간적으로 냉각<\/td>\n<\/tr>\n<tr>\n<td><strong>Clear icing<\/strong><\/td>\n<td>투명, 반투명, large super cooled<\/td>\n<td>비교적 느리게 냉각<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>Icing 영향 : <b class=\"k\">Thrust 감소<\/b> / <b class=\"k\">Lift 감소<\/b> / <b class=\"k\">Drag 증가<\/b> / <b class=\"k\">Weight 증가<\/b> / <b class=\"k\">Stall Speed 증가<\/b> → <mark>퍼포먼스 감소<\/mark><\/li>\n<li>Visible Precipitation / <b class=\"k\">+2℃ ~ -10℃<\/b> / Icing 발생 — TAT 10℃ → Anti-Ice 작동<\/li>\n<\/ul>\n<p><strong>Turbulence<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>기호<\/th>\n<th>강도<\/th>\n<th>내용<\/th>\n<th>기내<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td>Light<\/td>\n<td>비행 고도, 자세 경미하게 불규칙<\/td>\n<td>Food Service 가능<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>Light chop<\/td>\n<td>고도, 자세 변화없이 빠르고 리드미컬한 진동<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>_<\/td>\n<td>Moderate<\/td>\n<td>Light보다 강도가 강함, 지속 조종 가능, ISA변화<\/td>\n<td>Food Service / walking 어려움<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>MOD chop<\/td>\n<td>고도, 자세 변화없이 빠른 진동 반복적<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>--<\/td>\n<td>Severe<\/td>\n<td>비행 고도 자세 <b class=\"k\">급격한 큰 변동, ISA 큰 변화<\/b><\/td>\n<td>Food Service / walking 불가능<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>Extreme<\/td>\n<td>조종 <b class=\"k\">거의 불가능<\/b> / 구조적 손상, 탑승객 부상 가능<\/td>\n<td>Food Service / walking 불가능<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong><b class=\"k\">PIREP 예시<\/b><\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Over OMAHA<\/th>\n<th>1232Z<\/th>\n<th>MOD TB<\/th>\n<th>In Clouds<\/th>\n<th>At FL300<\/th>\n<th>B737<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Location<\/td>\n<td>Time<\/td>\n<td>Intensity (Light, MOD, SEV, Extreme)<\/td>\n<td>Related Cloud (In cloud, near cloud)<\/td>\n<td>ALT<\/td>\n<td>AC type<\/td>\n<td>Duration (Occasion, Frequent, Continuous)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Wind Shear 보고<\/strong> — 착륙 접근, 이륙시 저고도\n- <b class=\"k\">Wind<\/b> <mark><b class=\"k\">Speed<\/b><\/mark> <mark><b class=\"k\">Direction<\/b><\/mark> — <b class=\"k\">예기치 않은 변화<\/b>\n- Loss / Gain – Airspeed – at ALT\n- INS 사용시 : WS Level 위, 아래 바람상태 및 고도 보고\n- WS 회피기동 후 : 항공기 안전 후, 즉시 보고 및 요청사항 → Resume Clearance / New Clearance<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>CAT<\/th>\n<th>Clear Air Turbulence (15,000ft 이상)<\/th>\n<th>Time / Location / Intensity<\/th>\n<th>여유 있을 경우 풍향, 풍속, 온도 등<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>예시<\/th>\n<th><\/th>\n<th><\/th>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Tulsa TWR<\/td>\n<td>HL123<\/td>\n<td>encountered WS<\/td>\n<td>On Final<\/td>\n<td>Gained 25kt Between 600 and 400ft<\/td>\n<\/tr>\n<tr>\n<td>Miami TWR<\/td>\n<td>HL123<\/td>\n<td>encountered an abrupt WS<\/td>\n<td>At 800ft on final<\/td>\n<td>Max thrust required<\/td>\n<\/tr>\n<tr>\n<td>Denver TWR<\/td>\n<td>HL123<\/td>\n<td>WS escape complete<\/td>\n<td>Resume last assigned H/D<\/td>\n<td>Request further instructions<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>PIREP — Pilot Weather REPort<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>조건<\/th>\n<th><\/th>\n<th>Report<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Ceiling<\/td>\n<td>At or below <b class=\"k\">5,000ft<\/b><\/td>\n<td><b class=\"k\">Cloud<\/b> BASE / TOP / LAYERS<\/td>\n<\/tr>\n<tr>\n<td>Visibility<\/td>\n<td>At or below <b class=\"k\">5nm<\/b><\/td>\n<td>Flight <b class=\"k\">Visibility<\/b><\/td>\n<\/tr>\n<tr>\n<td>TS with <b class=\"k\">light<\/b> <b class=\"k\">icing<\/b> 이상<\/td>\n<td><\/td>\n<td><b class=\"k\">Precipitation<\/b><\/td>\n<\/tr>\n<tr>\n<td><b class=\"k\">Moderate<\/b> <b class=\"k\">Turbulence<\/b> 이상<\/td>\n<td><\/td>\n<td>Visibility Restricting; <b class=\"k\">Haze, Smoke, Dust<\/b><\/td>\n<\/tr>\n<tr>\n<td><b class=\"k\">Wind Shear / Microburst<\/b><\/td>\n<td><\/td>\n<td><b class=\"k\">Wind<\/b> with Altitude<\/td>\n<\/tr>\n<tr>\n<td>
