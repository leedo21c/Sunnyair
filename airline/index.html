<style>/* Layout: phone-first app shell — sticky top bar, one view at a time, bottom tab bar; centered 760px column on desktop */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --ink:#15202B; --muted:#5A6774; --rule:#D8DEE5; --rule-strong:#A3AFBB;
  --head:#E9EEF3; --tab-bg:#173F6E; --tab-fg:#FFFFFF; --link:#1D4F8A; --press:#E3E9F0;
  --key:#C1272F; --hl:#FFE36E; --hl-ink:#15202B; --fix:#6A2C9C; --fix-bg:#F1E8F9; --merge:#1F6A55; --merge-bg:#E3F2EC;
  --done:#1F7A4D; --star:#D99A00; --img-bg:#FFFFFF; --bar:rgba(255,255,255,.92);
  --f-body:"IBM Plex Sans KR","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-disp:"Barlow Condensed","IBM Plex Sans KR","Noto Sans CJK KR",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --fs:15px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1419; --surface:#151D25; --ink:#E3E9EF; --muted:#93A1AE; --rule:#26323D; --rule-strong:#40505F;
  --head:#1B252F; --tab-bg:#244B78; --tab-fg:#EAF2FC; --link:#8DBBF0; --press:#1F2A35;
  --key:#FF7B7B; --hl:rgba(255,214,10,.30); --hl-ink:#F5F1DC; --fix:#CDA8F2; --fix-bg:#2A2137; --merge:#7FD3B5; --merge-bg:#17302A;
  --done:#5FD39A; --star:#FFC23D; --img-bg:#F4F6F8; --bar:rgba(21,29,37,.92); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1419; --surface:#151D25; --ink:#E3E9EF; --muted:#93A1AE; --rule:#26323D; --rule-strong:#40505F;
  --head:#1B252F; --tab-bg:#244B78; --tab-fg:#EAF2FC; --link:#8DBBF0; --press:#1F2A35;
  --key:#FF7B7B; --hl:rgba(255,214,10,.30); --hl-ink:#F5F1DC; --fix:#CDA8F2; --fix-bg:#2A2137; --merge:#7FD3B5; --merge-bg:#17302A;
  --done:#5FD39A; --star:#FFC23D; --img-bg:#F4F6F8; --bar:rgba(21,29,37,.92); color-scheme:dark }

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:var(--fs); line-height:1.6; word-break:keep-all; overflow-wrap:break-word; -webkit-text-size-adjust:100%}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:40; background:var(--surface)}
button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer}
a{color:var(--link)}
:focus-visible{outline:2px solid var(--link); outline-offset:2px}

.shell{max-width:760px; margin:0 auto; min-height:100%; padding-bottom:calc(68px + env(safe-area-inset-bottom,0px))}
.pad{padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:30; background:var(--bar); backdrop-filter:saturate(1.4) blur(12px); -webkit-backdrop-filter:saturate(1.4) blur(12px); border-bottom:1px solid var(--rule); display:flex; align-items:center; gap:6px; min-height:52px; padding-block:6px}
.top h1{flex:1; min-width:0; margin:0; font-size:16px; font-weight:700; line-height:1.3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.ib{width:40px; height:40px; flex:none; display:grid; place-items:center; border-radius:10px; color:var(--ink)}
.ib:active{background:var(--press)}
.ib svg{width:22px; height:22px}
.ib.on.star{color:var(--star)}
.ib.on.chk{color:var(--done)}

/* bottom tabs */
.tabs{position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--bar); backdrop-filter:saturate(1.4) blur(12px); -webkit-backdrop-filter:saturate(1.4) blur(12px); border-top:1px solid var(--rule); padding-bottom:env(safe-area-inset-bottom,0px); padding-left:env(safe-area-inset-left,0px); padding-right:env(safe-area-inset-right,0px)}
.tabs-in{max-width:760px; margin:0 auto; display:grid; grid-template-columns:repeat(4,1fr)}
.tabs button{display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px 0 7px; font-size:11px; color:var(--muted); font-weight:500}
.tabs button svg{width:23px; height:23px}
.tabs button[aria-current="page"]{color:var(--tab-bg)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tabs button[aria-current="page"]{color:var(--link)} }
:root[data-theme="dark"] .tabs button[aria-current="page"]{color:var(--link)}

/* home */
.hero{padding-block:18px 6px}
.eyebrow{font-family:var(--f-mono); font-size:11.5px; color:var(--muted); margin:0 0 4px; letter-spacing:.02em}
.hero h2{margin:0 0 12px; font-size:24px; line-height:1.25; letter-spacing:-.01em}
.prog{display:flex; align-items:center; gap:10px; font-size:13px; color:var(--muted)}
.meter{flex:1; height:6px; border-radius:99px; background:var(--head); overflow:hidden}
.meter i{display:block; height:100%; background:var(--done); border-radius:99px}
.resume{margin-top:14px; display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:var(--tab-bg); color:var(--tab-fg); border-radius:14px; padding:12px 14px}
.resume small{display:block; font-size:11.5px; opacity:.8}
.resume b{display:block; font-size:14.5px; line-height:1.35}
.resume svg{width:22px; height:22px; flex:none; margin-left:auto}
.h-lbl{font-size:12px; font-weight:600; color:var(--muted); letter-spacing:.04em; margin:22px 0 8px}
.chlist{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:minmax(0,1fr); gap:8px}
.chlist li{min-width:0}
@media (min-width:620px){ .chlist{grid-template-columns:repeat(2,minmax(0,1fr))} }
.chcard{display:flex; gap:12px; align-items:center; width:100%; text-align:left; background:var(--surface); border:1px solid var(--rule); border-radius:14px; padding:12px}
.chcard:active{background:var(--press)}
.tab{display:inline-flex; align-items:center; justify-content:center; font-family:var(--f-disp); font-weight:600; letter-spacing:.06em; background:var(--tab-bg); color:var(--tab-fg); border-radius:6px; font-size:13px; line-height:1; flex:none; white-space:nowrap}
.chcard .tab{width:52px; height:44px; font-size:15px; flex-direction:column; gap:3px}
.chcard .tab small{font-family:var(--f-mono); font-size:10px; opacity:.75; letter-spacing:0}
.chcard .cb{flex:1; min-width:0}
.chcard b{display:block; font-size:15px; line-height:1.3}
.chcard span.d{display:block; font-size:12px; color:var(--muted); line-height:1.4; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.chcard .mini{display:flex; align-items:center; gap:6px; margin-top:6px; font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums}
.chcard .mini .meter{height:4px}

/* lists */
.slist{list-style:none; margin:0; padding:0}
.slist li + li{border-top:1px solid var(--rule)}
.srow{display:flex; gap:10px; align-items:flex-start; width:100%; text-align:left; padding:12px 2px}
.srow:active{background:var(--press)}
.srow .n{font-family:var(--f-mono); font-size:11.5px; color:var(--muted); min-width:38px; padding-top:2px; font-variant-numeric:tabular-nums}
.srow .t{flex:1; min-width:0; font-size:14.5px; line-height:1.45}
.srow .t small{display:block; color:var(--muted); font-size:12px; margin-top:2px}
.srow .st{display:flex; gap:4px; align-items:center; padding-top:2px; color:var(--muted)}
.srow .st svg{width:16px; height:16px}
.srow .st .d{color:var(--done)} .srow .st .s{color:var(--star)}
.chhead{display:flex; gap:12px; align-items:center; padding-block:16px 4px}
.chhead .tab{font-size:19px; padding:8px 10px}
.chhead p{margin:0; font-size:12.5px; color:var(--muted)}
.empty{padding:40px 8px; text-align:center; color:var(--muted); font-size:14px}
.empty b{display:block; color:var(--ink); font-size:16px; margin-bottom:6px}

/* search */
.sbox{position:sticky; top:calc(52px + env(safe-area-inset-top,0px)); z-index:20; background:var(--bg); padding-block:10px 6px}
.sbox input{width:100%; font:inherit; font-size:16px; padding:11px 14px; border:1px solid var(--rule-strong); border-radius:12px; background:var(--surface); color:var(--ink)}
.chips{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px}
.chips button{font-size:12.5px; padding:5px 10px; border-radius:99px; background:var(--surface); border:1px solid var(--rule)}
.snip{display:block; color:var(--muted); font-size:12.5px; margin-top:3px; line-height:1.45}
.snip em{font-style:normal; background:var(--hl); color:var(--hl-ink); border-radius:2px}
.qmeta{font-size:12px; color:var(--muted); margin:6px 0 0}

/* reader */
.rhead{padding-block:14px 8px; border-bottom:1px solid var(--rule-strong); margin-bottom:12px}
.rhead .crumb{display:flex; gap:8px; align-items:center; font-size:12px; color:var(--muted)}
.rhead .crumb .tab{font-size:11px; padding:3px 6px}
.rhead h2{margin:8px 0 4px; font-size:calc(var(--fs) + 5px); line-height:1.3; text-wrap:balance}
.rhead .src{font-family:var(--f-mono); font-size:11px; color:var(--muted); display:flex; gap:6px; align-items:center; flex-wrap:wrap}
.body{display:flex; flex-direction:column; gap:10px; font-size:var(--fs)}
.body > *{margin:0}
.body ul,.body ol{padding-left:1.3em; display:flex; flex-direction:column; gap:3px}
.body ul ul{margin-top:3px}
.rnav{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:26px}
.rnav button{display:flex; flex-direction:column; gap:2px; text-align:left; background:var(--surface); border:1px solid var(--rule); border-radius:12px; padding:10px 12px; min-width:0}
.rnav button:last-child{text-align:right; align-items:flex-end}
.rnav button small{font-size:11px; color:var(--muted)}
.rnav button span{font-size:13px; line-height:1.35; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}
.rnav button[disabled]{visibility:hidden}
.donebtn{margin-top:10px; width:100%; padding:12px; border-radius:12px; font-weight:600; font-size:14px; border:1px solid var(--rule-strong); background:var(--surface)}
.donebtn.on{background:var(--done); color:#fff; border-color:var(--done)}

b.k{color:var(--key); font-weight:600}
mark{background:var(--hl); color:var(--hl-ink); padding:0 2px; border-radius:2px; -webkit-box-decoration-break:clone; box-decoration-break:clone}
mark b.k{color:var(--key)}
del{color:var(--muted)}
.fix{display:inline-block; font-size:.8em; line-height:1.4; color:var(--fix); background:var(--fix-bg); border-radius:4px; padding:1px 6px; font-weight:500}
.merged{font-family:var(--f-body); font-size:11px; color:var(--merge); background:var(--merge-bg); border-radius:4px; padding:0 6px; font-weight:600}
code{font-family:var(--f-mono); font-size:.9em}
pre{background:var(--head); border:1px solid var(--rule); border-radius:8px; padding:10px 12px; overflow-x:auto; font-size:12px; line-height:1.55; margin:0}
blockquote{margin:0; padding:8px 12px; border-left:3px solid var(--tab-bg); background:var(--surface); border-radius:0 8px 8px 0}
blockquote p{margin:0 0 4px} blockquote p:last-child{margin:0}
.tbl{overflow-x:auto; -webkit-overflow-scrolling:touch; border:1px solid var(--rule); border-radius:10px; background:var(--surface); position:relative}
table{border-collapse:collapse; width:100%; font-size:calc(var(--fs) - 1.5px); line-height:1.45; font-variant-numeric:tabular-nums}
th,td{border:1px solid var(--rule); padding:6px 8px; text-align:left; vertical-align:top}
tr > :first-child{border-left:0} tr > :last-child{border-right:0}
thead tr:first-child > *{border-top:0} tbody tr:last-child > *{border-bottom:0}
table:not(:has(thead)) tbody tr:first-child > *{border-top:0}
th{background:var(--head); font-weight:600; font-size:.92em}
tbody td:first-child{font-weight:500}
@media (max-width:560px){ th,td{padding:5px 6px; min-width:72px} td:empty,th:empty{min-width:0} }
.figs{display:flex; flex-direction:column; gap:10px}
figure{margin:0; background:var(--img-bg); border:1px solid var(--rule); border-radius:10px; padding:6px}
figure img{display:block; max-width:100%; height:auto; margin:0 auto; border-radius:4px}
figcaption{font-size:11.5px; color:#4E5B67; padding:6px 2px 0; line-height:1.4}

/* settings */
.card{background:var(--surface); border:1px solid var(--rule); border-radius:14px; padding:14px; margin-top:12px}
.card h3{margin:0 0 10px; font-size:14px}
.seg{display:grid; grid-template-columns:repeat(4,1fr); gap:6px}
.seg button{padding:9px 0; border-radius:10px; border:1px solid var(--rule); background:var(--bg); font-weight:600}
.seg button[aria-pressed="true"]{background:var(--tab-bg); color:var(--tab-fg); border-color:var(--tab-bg)}
.legend{display:grid; gap:8px; margin:0}
.legend div{display:flex; gap:10px; align-items:baseline; font-size:13px}
.legend dt{flex:none; min-width:74px} .legend dd{margin:0; color:var(--muted)}
.danger{width:100%; padding:11px; border-radius:10px; border:1px solid var(--rule-strong); color:var(--key); font-weight:600; margin-top:4px}
.note{font-size:12.5px; color:var(--muted); margin:8px 0 0}
.toast{position:fixed; left:50%; bottom:calc(80px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:8px 14px; border-radius:99px; font-size:13px; z-index:50; pointer-events:none}
@media (prefers-reduced-motion: no-preference){ .view{animation:in .16s ease-out} @keyframes in{from{opacity:.4; transform:translateY(4px)} to{opacity:1; transform:none}} }
</style>

">270<\/b> Radial<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>판단<\/th>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>270R 로 Inbound 해서<\/td>\n<td>우측으로 돌아라<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Inbound Course(270°)<\/td>\n<td>패턴쪽으로 70° Offset<\/td>\n<td>일직선<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Inbound Course 포함하는 원<\/td>\n<td>Direct<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>Inbound Course 포함 X 원<\/td>\n<td>좁은 → Teardrop / 넓은 → Parallel<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>인꼬아머<\/strong> : 인바운드 꼬리 / 아웃바운드 머리<\/li>\n<li>From → Outbound 로 나감<\/li>\n<\/ul>\n<div class=\"figs\"><figure><img src=\"img/i-091-048.webp\" alt=\"HSI — 현재 항공기의 위치 판단 (FROM, 4.5dot)\" loading=\"lazy\"><figcaption>HSI — 현재 항공기의 위치 판단 (FROM, 4.5dot)<\/figcaption><\/figure><\/div>\n<p><strong>현재 항공기의 위치<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>판단<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>FROM<\/td>\n<td>180 Radial 로 <b class=\"k\">Outbound<\/b> 하기 위해<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>4.5dot<\/td>\n<td>9° offset → 189R 에 위치하고 있다.<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td><mark><b class=\"k\">TO/FROM Indicator 제외<\/b><\/mark><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td><mark><b class=\"k\">CDI 튄 쪽 제외<\/b><\/mark><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"figs\"><figure><img src=\"img/i-091-049.webp\" alt=\"항공기 위치 보기 (Aircraft Position)\" loading=\"lazy\"><figcaption>항공기 위치 보기 (Aircraft Position)<\/figcaption><\/figure><\/div>\n<div class=\"figs\"><figure><img src=\"img/i-091-050.webp\" alt=\"HSI — Reverse Sensing 판단 (090 Set)\" loading=\"lazy\"><figcaption>HSI — Reverse Sensing 판단 (090 Set)<\/figcaption><\/figure><\/div>\n<p><strong>현재 항공기 위치<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>판단<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>090 Set<\/td>\n<td>Reverse Sensing<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>OBS 기준<\/td>\n<td>우측 Deflection<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td><\/td>\n<td>내가 좌측에 있다<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><b class=\"k\">Reverse Sensing<\/b> 을 알 수 있다.<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><b class=\"k\">HSI<\/b> Needle<\/th>\n<th>Front Course Setting<\/th>\n<th>Normal Sensing<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td>Back Course Setting<\/td>\n<td>무조건 <b class=\"k\">Reverse Sensing<\/b><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"figs\"><figure><img src=\"img/i-091-051.webp\" alt=\"Aircraft Position and Direction of Flight (Localizer)\" loading=\"lazy\"><figcaption>Aircraft Position and Direction of Flight (Localizer)<\/figcaption><\/figure><\/div>\n<ol>\n<li>Marker Beacon<\/li>\n<li>Feather 우측 검정색 → Localizer<\/li>\n<\/ol>"}, {"id": "s01-07", "ch": 1, "num": "1.7", "title": "GBAS / ABAS / SBAS : GPS 위치오차를 보정", "pages": [1], "merged": false, "html": "<p><strong>SBAS<\/strong> — Satellite Based Augmentation System\n- 정지궤도위성을 활용해서 위치오차를 보정 → 공항주변 Facility 필요없음\n- Approach + Navigation / GBAS보다 정밀하지는 못함<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>필수 App<\/th>\n<th>분류<\/th>\n<th><\/th>\n<th>시스템<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>LPV<\/strong><\/td>\n<td>APV(3D)<\/td>\n<td>SBAS APV<\/td>\n<td>WAAS (미국)<\/td>\n<td>Wide Area Augmentation System<\/td>\n<\/tr>\n<tr>\n<td>Item10 <strong>B<\/strong><\/td>\n<td>PA(정밀)<\/td>\n<td>SBAS CAT1<\/td>\n<td>KASS (한국)<\/td>\n<td>Korea Augmentation Satellite System<\/td>\n<\/tr>\n<tr>\n<td><strong>LP<\/strong><\/td>\n<td>정밀도에 따라 다르게 분류<\/td>\n<td><\/td>\n<td>EGNOS (유럽)<\/td>\n<td>European Geostationary Navigation Overlay Service<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td>GAGAN (인도)<\/td>\n<td>GPS Aided GEO Augmented Navigation<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td>MSAS (일본)<\/td>\n<td>Multi-functional Satellite Augmentation System<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Reference Station (저고도 위성 오차파악, 12시간마다 돌고있음) → Master Station (User message 변환) → Uplink → Geostationary Satellite (정지궤도위성, 24시간마다 돌고있음) → 항공기/선박/자동차\n- Station FAA 3개이상 / Jepp 4개이상<\/p>\n<p><strong>GBAS<\/strong> — Ground Based Augmentation System / <mark>가장 정밀<\/mark>(공항 근처에서 신호 수신)\n- 필수 App <strong>GLS<\/strong> / Item10 <strong>A<\/strong>\n- Reference Station 3~4개 이상 (Ground Station, GPS Receiver) → Correction Process → VDB → 23NM범위 항공기\n- VHF 수신범위 짧으므로 Approach때만 사용\n- 고도계 오차와 별개로 가상의 선을 제공받기 때문에 Temperature correction 필요 없음<\/p>\n<p><strong>ABAS<\/strong> — Aircraft Based Augmentation System / GPS 최소 4개의 위성으로 위치파악<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>접근<\/th>\n<th>위성<\/th>\n<th><\/th>\n<th>비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>LNAV<\/td>\n<td>5개 위성 RAIM<\/td>\n<td>4개 + Baro-adding<\/td>\n<td>항공기 고도정보(위성대체)<\/td>\n<\/tr>\n<tr>\n<td>LNAV/VNAV<\/td>\n<td>6개 위성 FDE RAIM<\/td>\n<td>5개 + Baro-adding<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>RNP AR<\/td>\n<td>Lateral 0.1까지 정확도<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>GPS / 미국 · GNSS / ICAO · GLONASS / 러시아 · COMPASS / 중국 · Galileo / 유럽<\/p>"}, {"id": "s01-08", "ch": 1, "num": "1.8", "title": "RNP Approach 종류", "pages": [1], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>RNP<\/th>\n<th><\/th>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>비정밀<\/td>\n<td>LNAV only<\/td>\n<td>LP<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>APV<\/td>\n<td>LNAV + VNAV<\/td>\n<td>LPV<\/td>\n<td>RNP AR<\/td>\n<\/tr>\n<tr>\n<td>정밀<\/td>\n<td>LPV200 (SBAS CAT1)<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>*APV : 수직유도에 의한 접근절차<\/li>\n<li><strong>CDFA<\/strong> : Flight Path Angle을 맞추는 건 2D Approach. Guidance를 받지 않는다면, CDFA를 하더라도 2D Approach로 분류된다.<\/li>\n<\/ul>"}, {"id": "s01-09", "ch": 1, "num": "1.9", "title": "PBN (Performance-Based Navigation)", "pages": [13], "merged": false, "html": "<p><strong>PBN ; Performance-Based Navigation / RNAV &amp; RNP<\/strong>\n- 항로 거리 단축 / 연료절감 / 배기가스 감소 / 소음 감소 / 접근성 개선 / 운항지연 감소 / 정시성 향상<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Application<\/th>\n<th>Specifications<\/th>\n<th>Infrastructure<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>어느 특정 구간에 사용되는지<\/td>\n<td>PBN 세부기준 ; RNP4 / RNAV10<\/td>\n<td>기준 항행시설 ; VOR, DME, GNSS<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>정의<\/th>\n<th>특징<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>RNAV<\/strong><\/td>\n<td>Area Navigation<\/td>\n<td>ATC 통달범위 내에서 설계 → ATC 레이더 감시<\/td>\n<\/tr>\n<tr>\n<td><strong>RNP<\/strong><\/td>\n<td>Required Navigation Performance<\/td>\n<td>OBPMA ; On Board Performance Monitoring and Alerting<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>PBN Specification 별 정리<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Spec<\/th>\n<th>사용 지역<\/th>\n<th>항로 간격 / 특징<\/th>\n<th>최소 장비 / 비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>RNAV10 (RNP10)<\/strong><\/td>\n<td>대양 / Remote 내륙지역<\/td>\n<td>항로 간격 <strong>50NM<\/strong><br>RNP10일지라도 Monitoring &amp; Alerting 요구되지 않음<br>항공기/항공사/승무원 훈련 적합 → 운영기준 B036 명시<\/td>\n<td>최소 2개 독립적 LRNS (INS, IRS/FMS, GNSS)<br>GNSS 필수 → INS(IRU) + FMS 만으로 최대 6.2시간 운항가능(B744 ; 12시간)<br>Class II 항법으로 분류 → VOR, VOR/DME, NDB 범위 밖<\/td>\n<\/tr>\n<tr>\n<td><strong>RNP4<\/strong><\/td>\n<td>대양 / Remote 내륙지역 (의무 아닌 선택사항)<\/td>\n<td>항로 간격 <strong>30NM<\/strong><br>RCP240 / RSP180 충족 → 23NM 줄어들 수 있음<\/td>\n<td>최소 2개 독립적 LRNS / GNSS 필수<br>CPDLC + ADS-C 필수<br>Class II 항법으로 분류 → VOR, VOR/DME, NDB 범위 밖<\/td>\n<\/tr>\n<tr>\n<td><strong>RNAV5<\/strong><\/td>\n<td>유럽/중동 대륙 항로<\/td>\n<td>항로 간격 <strong>10~18NM<\/strong><br>→ ATC 간섭이 많은 경우, 간격이 좁음<\/td>\n<td>유럽 ; B-RNAV(Basic RNAV)<\/td>\n<\/tr>\n<tr>\n<td><strong>RNAV2<\/strong><\/td>\n<td>미국 대륙 항로<\/td>\n<td>항로 간격 최소 <strong>8NM<\/strong><\/td>\n<td>FL180이상 <strong>Q-Route<\/strong> : DME/DME, DME/DME/IRU, GNSS 중 1개 요구<br>FL180미만 <strong>T-Route<\/strong> : GNSS 필수<\/td>\n<\/tr>\n<tr>\n<td><strong>RNAV1<\/strong><\/td>\n<td>SID/STAR — 레이더 감시 지역<\/td>\n<td>RNAV1으로 충분함<\/td>\n<td>유럽 ; P-RNAV(Precision RNAV)<\/td>\n<\/tr>\n<tr>\n<td><strong>Basic RNP1<\/strong><\/td>\n<td>레이더 감시 X 지역<\/td>\n<td>Radar Service가 제공되지 않으면, RNP1 요구됨<\/td>\n<td>*제주공항(RKPC) 경우 Straight인데 RF인 경우 있음 → minimum 낮추기 위함<\/td>\n<\/tr>\n<tr>\n<td><strong>RNP (AR) Approach<\/strong><\/td>\n<td>GNSS — Authorization Required<\/td>\n<td>Radius-to-Fix(곡선구간) 가능 — T1 With RF / T2 Without RF<\/td>\n<td>FAA ; SAAAR (Special Aircraft &amp; Aircrew Authorization Required)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>RNP Approach 차트 Title &amp; 정확도<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Title<\/th>\n<th>구분<\/th>\n<th>구간<\/th>\n<th>정확도<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>RNAV(GPS) — RNP<\/td>\n<td><\/td>\n<td>Initial / Intermediate / Missed<\/td>\n<td>1NM 정확도<\/td>\n<\/tr>\n<tr>\n<td>RNAV(RNP) — AR<\/td>\n<td><\/td>\n<td>Final<\/td>\n<td>0.3NM 정확도 — AR : 0.1 ~ 0.3<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td>수직 정확도 요구 / 항공기 + 조종사 RNP AR 자격 필요<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>비행 단계별 PBN<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>단계<\/th>\n<th>Spec<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>대양, 내륙 Remote한 지역 En-route<\/td>\n<td>RNAV10(RNP10) / RNP4<\/td>\n<\/tr>\n<tr>\n<td>Continental En-route<\/td>\n<td>RNAV5 / RNAV2<\/td>\n<\/tr>\n<tr>\n<td>RNAV SIDs &amp; STAR<\/td>\n<td>RNAV1 / Basic RNP 1<\/td>\n<\/tr>\n<tr>\n<td>RNAV 접근<\/td>\n<td>RNP (AR) App<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Class 1 / Class 2 Navigation<\/strong> (Conventional Ground NAV-aid)<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>구분<\/th>\n<th>내용<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Class1 Navigation<\/strong><\/td>\n<td>ICAO 지정 표준항행시설 수신범위(VOR, VOR/DME, NDB) / MEA GAP포함<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Class2 Navigation<\/strong><\/td>\n<td>ICAO 지정 표준항행시설 수신범위 밖 / 주로 대양<\/td>\n<td>Redundancy 감소 → IRU Backup<\/td>\n<\/tr>\n<tr>\n<td>CPDLC 사용<\/td>\n<td>Class2 진입 전, SEL(Selective) CAL Check 필요 (HF FRQ) → OK시 → Turn OFF가능<\/td>\n<td>Item18 : SEL 4자리 Code / CODE A/C Address 16진법(0~9 + A~F)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>LRNS (Long Range NAV System)<\/strong> : GNSS(Satellite-Based) · Self-contained IRS · LORAN C (최소 3국 이상)<\/p>"}, {"id": "s01-10", "ch": 1, "num": "1.10", "title": "PBN 비행단계별 Navigation Accuracy (NM)", "pages": [15], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Spec<\/th>\n<th>En-route Oceanic/Remote<\/th>\n<th>En-route Continental<\/th>\n<th>Arrival<\/th>\n<th>Initial<\/th>\n<th>Intermediate<\/th>\n<th>Final<\/th>\n<th>Missed App<\/th>\n<th>DEP<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>RNAV10 / RNP10<\/td>\n<td>10<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>RNAV5<\/td>\n<td><\/td>\n<td>5<\/td>\n<td>5<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>RNAV2<\/td>\n<td><\/td>\n<td>2<\/td>\n<td>2<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td>2<\/td>\n<\/tr>\n<tr>\n<td>RNAV1<\/td>\n<td><\/td>\n<td>1<\/td>\n<td>1<\/td>\n<td>1<\/td>\n<td>1<\/td>\n<td><\/td>\n<td>1<\/td>\n<td>1<\/td>\n<\/tr>\n<tr>\n<td>RNP4<\/td>\n<td>4<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Basic RNP1<\/td>\n<td><\/td>\n<td><\/td>\n<td>1<\/td>\n<td>1<\/td>\n<td>1<\/td>\n<td><\/td>\n<td>1<\/td>\n<td>1<\/td>\n<\/tr>\n<tr>\n<td>RNP APCH<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td>1<\/td>\n<td>1<\/td>\n<td>0.3<\/td>\n<td>1<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>RNP AR APCH<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td>1 ~ 0.1<\/td>\n<td>1 ~ 0.1<\/td>\n<td>0.3 ~ 0.1<\/td>\n<td>1 ~ 0.1<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s01-11", "ch": 1, "num": "1.11", "title": "GPS JAMMING / SPOOFING", "pages": [1], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>구분<\/th>\n<th><\/th>\n<th>내용<\/th>\n<th>확인<\/th>\n<th>조치<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>JAMMING<\/strong><\/td>\n<td>“Block”<\/td>\n<td>신호 차단 및 방해<\/td>\n<td>RAIM check<\/td>\n<td>DME/VOR 전환<\/td>\n<\/tr>\n<tr>\n<td><strong>SPOOFING<\/strong><\/td>\n<td>“False signal”<\/td>\n<td>속이는 위장 신호 송출<\/td>\n<td>FMC GPS accuracy check<\/td>\n<td>INS 불일치 확인<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>대체 항법 : DME/DME · VOR · Radar Vector 요청<\/p>"}, {"id": "s02-01", "ch": 2, "num": "2.1", "title": "CNS ATM", "pages": [13], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>연도<\/th>\n<th>명칭<\/th>\n<th>설명<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1983년<\/td>\n<td><strong>FANS<\/strong><\/td>\n<td>Future Air Navigation System — ※ 증가하는 항공수요에 대처하기 위해 새로운 항행시스템 개발<\/td>\n<\/tr>\n<tr>\n<td>1996년<\/td>\n<td><strong>CNS ATM<\/strong><\/td>\n<td>Communication Navigation Surveillance Air Traffic Management<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>기존 시스템의 한계 → CNS ATM 개선<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>기존 한계<\/th>\n<th>개선<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>VOR : 가시선 → 원격지, 대양, 산악, 장애물 방해<\/td>\n<td>GNSS → 통달거리 증가<\/td>\n<\/tr>\n<tr>\n<td>ACARS Networks → 주파수 한계<\/td>\n<td>ATN Network → 통신용량 증가<\/td>\n<\/tr>\n<tr>\n<td>지상 항행안전시설 → 최단거리 항로 불가<\/td>\n<td>RNAV → 최단거리, 연료절감, 공해 및 소음 감소<\/td>\n<\/tr>\n<tr>\n<td>지상 항행안전시설 → 설치, 운영, 관리비용<\/td>\n<td>GNSS → 설치, 운영, 관리비 절감<\/td>\n<\/tr>\n<tr>\n<td>호환성 부족<\/td>\n<td>Data 통신 / 4D 시간고려 PBN / ADS 감시<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>2개의 서브시스템 → GNSS(Space Based NAV) &amp; Digital Data 통신<\/li>\n<\/ul>\n<p><strong>구성요소<\/strong>\n- <strong>DDC<\/strong> ; Digital Data Communication\n- <strong>PBN<\/strong> ; Performance-Based Navigation / RNAV &amp; RNP\n  - <strong>RNAV<\/strong> : Area Navigation — ATC 통달범위 내에서 설계 → ATC 레이더 감시\n  - <strong>RNP<\/strong> : Required Navigation Performance — OBPMA ; On Board Performance Monitoring and Alerting\n    - <strong>RAIM<\/strong> ; Receiver Autonomous Integrity Monitoring — 5 satellite or 4 satellite + Baro Aiding(기압고도 연동)\n    - <strong>FDE<\/strong> ; Fault Detection Exclusion / 검출 + 제거 / 최소 6개\n    - <strong>AAIM<\/strong> ; Aircraft Autonomous Integrity Monitoring — RAIM + INS/IRS/ Barometric Altimeter / RNP AR\n- <strong>ADS<\/strong> ; Automatic Dependent Surveillance — Transponder or CPDLC → 지상으로 신호 전송 → 관제 Scope 시현\n- <strong>ATN<\/strong> ; Aeronautical Telecommunication Network\n- <strong>ATM<\/strong> ; Air Traffic Management\n- → 관련사항 : PBCS, PBN<\/p>"}, {"id": "s02-02", "ch": 2, "num": "2.2", "title": "PBCS (Performance Based Communication and Surveillance)", "pages": [13], "merged": false, "html": "<ul>\n<li><strong>목적<\/strong> : 항공기 수 증가 → 효율적인 공역관리 → 간격분리 → 일정 수준의 성능이 충족될 경우 간격을 줄여주겠다.<\/li>\n<li>Communication and Surveillance (PBCS) and Navigation Performance (PBN) — 통신성능, 감시정보 전달성능을 고려한 Air Traffic Management<\/li>\n<li>CNS ATM / RVSM(Vertical)<\/li>\n<\/ul>\n<p><strong>PBC+S<\/strong> NAT (North Atlantic) : RCP240 / RSP180 → 30NM / 50NM or 5min(longitudinal) / 23NM(Lateral) Reduced<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>구분<\/th>\n<th>약어<\/th>\n<th>의미<\/th>\n<th>기준<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>PBC<\/strong><\/td>\n<td>RCP<\/td>\n<td>Required Communication Performance<\/td>\n<td>RCP240 : Maximum Transaction Time 240초<\/td>\n<td>커뮤니케이션 전달 최대시간<\/td>\n<\/tr>\n<tr>\n<td><strong>PBS<\/strong><\/td>\n<td>RSP<\/td>\n<td>Required Surveillance Performance<\/td>\n<td>RSP180 : Maximum Data Delivery Time 180초 <span class=\"fix\" title=\"정리하면서 확인·수정한 부분\">✎ 원본 “Deliberation”<\/span><\/td>\n<td>감시정보 전달 최대시간<\/td>\n<\/tr>\n<tr>\n<td><strong>PBN<\/strong><\/td>\n<td>RNP4<\/td>\n<td>30NM<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>RNP10<\/td>\n<td>50NM<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>댄공FOM 322p<\/th>\n<th>코드<\/th>\n<th>내용<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>CPDLC<\/td>\n<td>P1<\/td>\n<td>CPDLC RCP400<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>P2<\/td>\n<td>CPDLC RCP240<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>P3<\/td>\n<td>SATVOICE RCP400<\/td>\n<td>위성전화<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s02-03", "ch": 2, "num": "2.3", "title": "ADS-B / ADS-C / ELT", "pages": [15], "merged": false, "html": "<p><strong>ADS-B<\/strong> — Automatic Dependent Surveillance - Broadcasting : 조종사 개입 없이 항공계기에 의존해서 감시정보를 주파수를 통해 방송<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th>내용<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>주파수<\/td>\n<td>1,090Mhz UHF (Transponder 연동) / 978Mhz<\/td>\n<\/tr>\n<tr>\n<td>전송주기<\/td>\n<td>0.5~1초 단위<\/td>\n<\/tr>\n<tr>\n<td>단점<\/td>\n<td>Line of sight 장애 / 도달거리 제한<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Distress FRQ<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>대역<\/th>\n<th>주파수<\/th>\n<th>비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>UHF<\/td>\n<td>243.0Mhz<\/td>\n<td>범위 : 200~3,000Mhz(3Ghz)<\/td>\n<\/tr>\n<tr>\n<td>VHF<\/td>\n<td>121.5Mhz<\/td>\n<td>원래 300까지 / 항공 200까지<\/td>\n<\/tr>\n<tr>\n<td>HF<\/td>\n<td>500khz · 2182khz · 4125khz · 8364khz<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>ADS-C<\/strong> (Contract, 관제전용) — FANS/ATN 통신망 사용 / 해양에서 위성사용 (실시간 어려움 – 비쌈)<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>계약<\/th>\n<th>내용<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1. Periodic contract<\/td>\n<td>주기(5분/10분) 계약<\/td>\n<\/tr>\n<tr>\n<td>2. Event contract<\/td>\n<td>계획대비 고도, 속도, 항로 변경<\/td>\n<\/tr>\n<tr>\n<td>3. Demand contract<\/td>\n<td>관제사 ‘항공기’에 요청<\/td>\n<\/tr>\n<tr>\n<td>4. Emergency mode<\/td>\n<td>항공기 비상시 자동 보고<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>ADS-B (관제 &amp; 항공기 수신가능)<\/strong> — Out / In : ADS-B (in) 기능이 있는 항공기 존재<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>FLT Plan<\/th>\n<th>코드<\/th>\n<th>내용<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Item10a<\/td>\n<td><\/td>\n<td>Communication / Navigation / Approach aid 에 관한 equipment and capability<\/td>\n<\/tr>\n<tr>\n<td>Item10b<\/td>\n<td><\/td>\n<td>Surveillance에 관한 equipment and capability<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>B1<\/td>\n<td>ADS-B / 1,090Mhz / OUT<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>B2<\/td>\n<td>ADS-B / 1,090Mhz / OUT &amp; IN<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>D1<\/td>\n<td>ADS-C / FANS통신망<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>G1<\/td>\n<td>ADS-C / ATN통신망<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>Transponder <strong>L<\/strong><\/td>\n<td>Mode S / ADS-B 연동 / Pressure ALT &amp; A/C identification 관제화면 표시 / ESC기능<br>※ESC : Enhanced Surveillance Capability / Mode S를 통해 Data Downlink<\/td>\n<\/tr>\n<tr>\n<td>vs Item18 (RNAV Specification)<\/td>\n<td>B1<\/td>\n<td>RNAV5 모든 장비로 가능<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>B2<\/td>\n<td>RNAV5 GNSS 로 가능<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>ELT<\/strong> — 121.5Mhz / 243.0Mhz / 406.0Mhz<\/p>\n<p>비행 중 청취 및 보고 :\n1. 최초 신호 청취 — 항공기 위치\n2. 마지막 신호 청취 — 항공기 위치\n3. 최대강도 신호 — 항공기 위치\n4. 비행고도 및 비상신호 수신 주파수<\/p>"}, {"id": "s02-04", "ch": 2, "num": "2.4", "title": "ACARS / PDC / CPDLC", "pages": [15], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>약어<\/th>\n<th>정의<\/th>\n<th>내용<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>ACARS<\/strong><\/td>\n<td><b class=\"k\">A<\/b>irborne (Aircraft) <b class=\"k\">C<\/b>ommunications <b class=\"k\">A<\/b>ddressing and <b class=\"k\">R<\/b>eporting <b class=\"k\">S<\/b>ystem<\/td>\n<td>Aircraft-Company (OCC) 통신 — 조종사 개입 없이 <b class=\"k\">연료, 포지션, Block time<\/b> 보고<\/td>\n<\/tr>\n<tr>\n<td><strong>PDC<\/stron n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s03-06", "ch": 3, "num": "3.6", "title": "RVSM (Reduced Vertical Separation Minimum)", "pages": [35], "merged": false, "html": "<ul>\n<li><b class=\"k\">R<\/b>educed <b class=\"k\">V<\/b>ertical <b class=\"k\">S<\/b>eparation <b class=\"k\">M<\/b>inimum<\/li>\n<li>FL290 ~ FL410 : IFR 수직분리기준 2,000ft → <mark><b class=\"k\">1,000ft<\/b><\/mark> — <b class=\"k\">공역 수용량 확대<\/b><\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>공역<\/th>\n<th>범위<\/th>\n<th>분리<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>RVSM공역<\/td>\n<td>FL410 이하<\/td>\n<td>1,000ft 간격분리<\/td>\n<td>그 위는 2,000ft<\/td>\n<\/tr>\n<tr>\n<td>Non-RVSM공역<\/td>\n<td>FL290 아래<\/td>\n<td>1,000ft 간격분리<\/td>\n<td>그 위는 2,000ft<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>FLT Plan Item10 : <b class=\"k\">W<\/b><\/li>\n<\/ul>\n<p><strong>필수장비 — <mark>T 측 경 통<\/mark><\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>장비<\/th>\n<th>의미<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><mark><strong>T<\/strong><\/mark><\/td>\n<td>SSR Altitude Reporting Transponder<\/td>\n<td>2차 감시레이더 자동보고기능 Transponder<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><mark><strong>측<\/strong><\/mark><\/td>\n<td>Altitude <b class=\"k\">Measurement<\/b> System<\/td>\n<td>2개의 독립된 고도측정시스템<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><mark><strong>경<\/strong><\/mark><\/td>\n<td>Altitude <b class=\"k\">Alert<\/b> System<\/td>\n<td>고도이탈경보시스템<\/td>\n<td>300ft 고도경보<\/td>\n<\/tr>\n<tr>\n<td><mark><strong>통<\/strong><\/mark><\/td>\n<td>Automatic Altitude <b class=\"k\">Control<\/b> System<\/td>\n<td>자동고도통제시스템<\/td>\n<td>65ft 고도유지<\/td>\n<\/tr>\n<tr>\n<td>→<\/td>\n<td><b class=\"k\">+ Auto Pilot (ALT HOLD 기능)<\/b><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>RVSM 숫자 정리<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>숫자<\/th>\n<th>내용<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>50<\/strong><\/td>\n<td>지상에서 Captain – FO의 고도계 차이 최대 <b class=\"k\">50ft<\/b> 허용 오차<\/td>\n<\/tr>\n<tr>\n<td><strong>60<\/strong><\/td>\n<td>지상에서 Captain – FO의 고도계 차이 최대 <b class=\"k\">60ft<\/b> 허용 — Airport Elevation <b class=\"k\">5,000ft 초과<\/b>일 경우<\/td>\n<\/tr>\n<tr>\n<td><mark><strong>75<\/strong><\/mark><\/td>\n<td>Primary 고도계 – Field Elevation 차이 최대 <b class=\"k\">75ft<\/b> 허용 오차<\/td>\n<\/tr>\n<tr>\n<td><mark><strong>150<\/strong><\/mark><\/td>\n<td>고도변경시 <b class=\"k\">150ft를 초과<\/b>하여 <b class=\"k\">Overshoot/Undershoot 최대 허용 수치<\/b><\/td>\n<\/tr>\n<tr>\n<td><mark><strong>200<\/strong><\/mark><\/td>\n<td>비행중 공중에서 Captain – FO의 고도계 차이 최대 <b class=\"k\">200ft<\/b> 허용 오차<\/td>\n<\/tr>\n<tr>\n<td><mark><strong>300<\/strong><\/mark><\/td>\n<td>CFL(Cleared Flight Level)로 부터 <b class=\"k\">300ft<\/b> 초과하여 Deviate한 경우 Air Safety Report 회사에 제출<br>→ 회사는 ASR받은 시점부터 <b class=\"k\">72시간<\/b> 내에 국토부에 의무보고대상 항공안전장애 보고서 제출<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>운항승인 (X) RVSM 운항가능 조건<\/strong>\n1. <b class=\"k\">신규<\/b> 항공기 도입\n2. 고장 항공기 정비 → <b class=\"k\">정비장소<\/b>까지 운항\n3. 운항승인 항공기 → 날개 아래 <b class=\"k\">여분 엔진 탑재<\/b> 수송\n4. 항공기 <b class=\"k\">사고, 재난<\/b> → <b class=\"k\">수색<\/b> 구조를 위해 <b class=\"k\">긴급<\/b> 항공기 운항\n5. <b class=\"k\">군, 세관, 경찰업무<\/b> → <b class=\"k\">국가항공기<\/b> 운항\n6. 수평비행 하지 않고 수직분리축소공역 <b class=\"k\">가로질러 상승 또는 강하<\/b><\/p>"}, {"id": "s03-07", "ch": 3, "num": "3.7", "title": "Oceanic Contingency Procedure", "pages": [35], "merged": false, "html": "<p><strong>해양 공역에서 ATC와 통신이 안될 경우, 비정상 상황 조우 시 따라야 하는 절차<\/strong>\n- a) <b class=\"k\">기상<\/b> 때문에 할당된 Clearance 수행할 수 없는 경우 → Weather deviation procedure\n- b) Prevailing Traffic flow 때문에 <b class=\"k\">Cross<\/b> 해야하는 경우 — Ex) <b class=\"k\">Medical EMER<\/b>\n- c) <b class=\"k\">RVSM 필수장비 Fail<\/b> / <b class=\"k\">Engine Fail<\/b> / <b class=\"k\">Pressurization Fail<\/b><\/p>\n<p>Revise ATC clearance 우선 / 받지 못하는 경우<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><b class=\"k\">선조치 후보고<\/b><\/th>\n<th><mark><b class=\"k\">30°이상 Turn<\/b><\/mark><\/th>\n<th><mark><b class=\"k\">좌/우 5NM<\/b><\/mark><\/th>\n<th>항로 가장자리 → 고도유지 / 하강 결정 / <b class=\"k\">500ft Vertical offset<\/b><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>※Lateral 5NM / Vertical 500ft offset — ※500ft : Eng Fail / Cabin Depression / Medical EMER<\/li>\n<li><strong>FL290 아래로 내려갈 수 있으면 500ft offset<\/strong> / <strong>FL410이상이라면, 1,000ft offset<\/strong><\/li>\n<li>1) ATC Contact — Voice or CPDLC<\/li>\n<li>2) 좌우 고려 — 내 항공기 위치 / 주변 항공기의 위치 / 교체공항 위치 / SLOP / 예상 Terrain<\/li>\n<\/ul>\n<p><strong>나가면서 해야할 것 — <b class=\"k\">I AM VFR<\/b><\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>항목<\/th>\n<th>내용<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><mark><strong>I<\/strong><\/mark><\/td>\n<td><b class=\"k\">I<\/b>lluminated All Exterior Light<\/td>\n<td>타항공기들의 시야에 잘 보이기 위해<\/td>\n<\/tr>\n<tr>\n<td><mark><strong>A<\/strong><\/mark><\/td>\n<td><b class=\"k\">A<\/b>TC 지속 Contact 시도<\/td>\n<td>Voice or CPDLC<\/td>\n<\/tr>\n<tr>\n<td><mark><strong>M<\/strong><\/mark><\/td>\n<td><b class=\"k\">M<\/b>aintain Flight Level until 5NM<\/td>\n<td>항로폭 좌우 각각 5NM — 항로 가장자리까지 <b class=\"k\">고도유지<\/b><\/td>\n<\/tr>\n<tr>\n<td><mark><strong>V<\/strong><\/mark><\/td>\n<td><b class=\"k\">V<\/b>isually Look outside and <b class=\"k\">A<\/b>CARS 확인<\/td>\n<td>창밖 주시 / ND상 주변 항공기 확인<\/td>\n<\/tr>\n<tr>\n<td><mark><strong>F<\/strong><\/mark><\/td>\n<td><b class=\"k\">F<\/b>requency 위치/의도 방송<\/td>\n<td>사용중 FRQ · 121.5 · 123.45 (Inter Pilot air to air FRQ)<\/td>\n<\/tr>\n<tr>\n<td><mark><strong>R<\/strong><\/mark><\/td>\n<td>TCAS <b class=\"k\">R<\/b>A 확인 + <b class=\"k\">7700<\/b> Set<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s03-08", "ch": 3, "num": "3.8", "title": "Weather Deviation", "pages": [35], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Weather Deviation 전방 악기상<\/th>\n<th>~~30°이상 X~~<\/th>\n<th>~~좌/우 5NM~~<\/th>\n<th>3NM도 가능<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>ATC Contact 우선 / 좌/우 선정 → 악기상 위치 기준 — Ex) TS, 20NM 이상 / Weather Radar 참고<\/li>\n<li><b class=\"k\">5NM까지 고도유지<\/b> → 5NM 이상 <b class=\"k\">300ft<\/b> Vertical Offset — 항로기준 5NM에는 해당고도 유지 필수<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>항목<\/th>\n<th>5NM 이상시 Offset<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><mark><strong>I<\/strong><\/mark><\/td>\n<td><b class=\"k\">I<\/b>lluminated Exterior Light<\/td>\n<td><mark><b class=\"k\">동우상<\/b><\/mark><\/td>\n<td><b class=\"k\">서좌상<\/b><\/td>\n<\/tr>\n<tr>\n<td><mark><strong>A<\/strong><\/mark><\/td>\n<td><b class=\"k\">A<\/b>TC 지속 Contact 시도 / CPDLC<\/td>\n<td><b class=\"k\">동좌하<\/b><\/td>\n<td><b class=\"k\">서우하<\/b><\/td>\n<\/tr>\n<tr>\n<td><mark><strong>M<\/strong><\/mark><\/td>\n<td><b class=\"k\">M<\/b>aintain Flight Level until 5NM<\/td>\n<td><b class=\"k\">SAND<\/b><\/td>\n<td>North 방향 → Descent 하강<\/td>\n<\/tr>\n<tr>\n<td><mark><strong>V<\/strong><\/mark><\/td>\n<td><b class=\"k\">V<\/b>isually Look outside and <b class=\"k\">A<\/b>CARS 확인<\/td>\n<td><\/td>\n<td>South 방향 → Ascend 상승<\/td>\n<\/tr>\n<tr>\n<td><mark><strong>F<\/strong><\/mark><\/td>\n<td><b class=\"k\">F<\/b>requency 3개 — 사용중 FRQ · 121.5 · 123.45<\/td>\n<td>A/C ID / 고도 / 포지션 / 인텐션<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s03-09", "ch": 3, "num": "3.9", "title": "SLOP (Strategic Lateral Offset Procedure)", "pages": [35], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><mark><strong>SLOP<\/strong><\/mark><\/th>\n<th><b class=\"k\">S<\/b>trategic <b class=\"k\">L<\/b>ateral <b class=\"k\">O<\/b>ffset <b class=\"k\">P<\/b>rocedure<\/th>\n<th>Offset 기능에 따라<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td>SLOP <b class=\"k\">사용가능<\/b> 공역 — <mark><b class=\"k\">보고 필요없이<\/b><\/mark> / <mark><b class=\"k\">우측<\/b><\/mark> / <mark><b class=\"k\">최대 2NM<\/b><\/mark><\/td>\n<td><mark>0.1NM(1NM) 단위<\/mark> / <mark><b class=\"k\">C - 1 - 2<\/b><\/mark><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>※ AIP에 표시됨 / NAT공역 필수지만 Centerline사용도 SLOP에 포함되므로 조종사 결정에 따름<\/li>\n<li><strong>목적<\/strong> : 1) <b class=\"k\">Wake Turbulence 회피<\/b> — 앞의 항공기 후류 회피 / 2) <b class=\"k\">Lateral Separation 보장<\/b> — Lateral Overlap 확률 감소<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>2NM<\/th>\n<th>인접항로 Centerline 간격<\/th>\n<th><\/th>\n<th>Offset<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1)<\/td>\n<td><mark><b class=\"k\">28km<\/b><\/mark><\/td>\n<td><mark><b class=\"k\">15NM 이상<\/b><\/mark><\/td>\n<td><mark><b class=\"k\">최대 2NM<\/b><\/mark><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>2)<\/td>\n<td><mark><b class=\"k\">19km<\/b><\/mark><\/td>\n<td><mark><b class=\"k\">6~15NM<\/b><\/mark><\/td>\n<td>최대 0.5NM<\/td>\n<td>0.1NM 단위<\/td>\n<\/tr>\n<tr>\n<td>3)<\/td>\n<td><mark><b class=\"k\">11.1km<\/b><\/mark><\/td>\n<td><mark><b class=\"k\">10~15NM<\/b><\/mark><\/td>\n<td><mark><b class=\"k\">최대 2NM<\/b><\/mark><\/td>\n<td>한 항공기가 다른 항공기의 고도를 지나서 Climb/Descent 경우<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s04-01", "ch": 4, "num": "4.1", "title": "Required T/O Fuel (TCDFA)", "pages": [3], "merged": false, "html": "<ul>\n<li><strong><b class=\"k\">TCDFA<\/b><\/strong> 법적개념이 아닌 항공사에서 적용하는 개념 (법정연료와 Required T/O fuel은 다르다.)<\/li>\n<li><strong>Taxi Fuel(항공법에는 포함)은 제외된 상태이다.<\/strong><\/li>\n<\/ul>\n<p><strong>연료 구성 계층<\/strong> : Total in Tank ⊃ Ramp out Fuel ⊃ Planned TO Fuel ⊃ Required TO Fuel (이륙시점 – Line up &amp; wait 시점 / 최소탑재연료)<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>구분<\/th>\n<th>연료<\/th>\n<th>내용<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Total in Tank<\/td>\n<td><strong>U<\/strong> <b class=\"k\">Unusable Fuel<\/b><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Ramp out Fuel<\/td>\n<td><strong>T<\/strong> Taxi Fuel<\/td>\n<td><strong>이륙 전<\/strong> 소모될 것으로 예측되는 연료 — Push back ~ Take off 전 시동 및 APU<\/td>\n<\/tr>\n<tr>\n<td>Required TO Fuel<\/td>\n<td><strong>T<\/strong> Trip Fuel<\/td>\n<td>T/O를 위해 T/O Thrust 넣은 순간부터 최초 목적공항 L/D할 때까지 필요 연료<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><strong>C<\/strong> Contingency Fuel<br><b class=\"k\">최소 1,500ft / 5분<\/b><\/td>\n<td><b class=\"k\">예상치 못한 상황<\/b> — 일반적으로 <b class=\"k\">Trip Fuel의 5%<\/b> 또는 승인시 <b class=\"k\">3% ERA (조건만족시)<\/b><br><b class=\"k\">목적공항<\/b> 최소 ISA 상태 Holding Speed로 <b class=\"k\">1,500ft에서 5분<\/b> 체공가능 연료보다 많아야 함<br>Re-file procedure 적용시, <b class=\"k\">일부구간의 5%<\/b> 적용가능<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><strong>D<\/strong> Destination ALT Fuel<\/td>\n<td>목적지교체공항 있을 경우 ONLY<br>최초 목적 공항 <b class=\"k\">DA/MAP<\/b>로부터(MA Segment) 목적지 교체공항 <b class=\"k\">L/D까지<\/b> 필요한 연료<br><b class=\"k\">NAR, NA(고립공항)<\/b> → <mark>D Fuel 필요없음<\/mark><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><strong>F<\/strong> Final Reserve Fuel<br><b class=\"k\">착륙중량 1,500ft / 30분<\/b><\/td>\n<td>목적지교체공항 <b class=\"k\">상공<\/b>(또는 최초목적공항 <b class=\"k\">상공<\/b>) <b class=\"k\">예상<\/b>되는 <b class=\"k\">중량<\/b>으로 ISA상태 Holding Speed로 <b class=\"k\">1,500ft에서 30분<\/b>동안 체공할 수 있는 연료<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><strong>A<\/strong> Additional Fuel<br>TCDF가 운항상 필요한 연료를 충족한다면 탑재하지 않아도 됨<br><b class=\"k\">CEF L/D + 1,500ft / 15분<\/b><\/td>\n<td>TCDF의 합이 <b class=\"k\">운항상 필요한 연료<\/b>의 합을 충족하지 못하였을 경우, 추가 탑재하는 연료<br><strong>운항상 필요한 연료<\/strong><br>1. 정상적으로 이륙해서 가장 <b class=\"k\">Critical Point<\/b>(V1 1초전)에서 가장 <b class=\"k\">Critical Event<\/b>(엔진고장 또는 여압장치 고장) 조우 → <strong>비정상적인 연료 소모율<\/strong>로 <strong>가까운 교체공항<\/strong>가서 착륙하는데 필요한 연료의 양 + ISA 상태에서 1,500ft에서 Holding Speed로 <b class=\"k\">15분<\/b>동안 체공할 수 있는 연료의 양을 Margin으로 더해주는 연료 (EDTO제외하고 대체로 충족함)<br>2. <strong>EDTO<\/strong> 임계 연료 시나리오를 부합하는 연료 — Icing, Anti-icing, APU Fuel 등<\/td>\n<\/tr>\n<tr>\n<td><strong>DCT<\/strong> (재량)<\/td>\n<td><strong>D<\/strong> Discretionary Fuel<\/td>\n<td>기장(PIC), 운항관리사 재량으로 탑재 / Limit 없음 / AGTOW 초과하지 않게<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><strong>C<\/strong> CCF (Company Compensation Fuel)<\/td>\n<td>e.g Extra Fuel / 반복되는 노선데이터 통계(추가소모) 반영<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><strong>T<\/strong> Tankering Fuel<\/td>\n<td>여러 leg fuel 한 번에 탑재(re-fueling X) / <b class=\"k\">연료보급불가, 높은 가격<\/b><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>Ballast Fuel<\/td>\n<td>Wing loading이 너무 가벼움을 방지하기 위해 / Pay load로 간주<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<blockquote>\n<p><mark><strong>*NA 고립공항<\/strong><\/mark> : 최초 목적공항의 DA/MAP부터 <b class=\"k\">Nearest Suitable<\/b>(Alternate Airport IFR Wx minima 만족해야함) Airport 까지 필요한 연료의 양이 (Destination ALT Fuel)이 <b class=\"k\">최초 목적공항에서 90분동안<\/b> Holding 하는 <b class=\"k\">연료의 양<\/b>을 초과할 때<\/p>\n<\/blockquote>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>교체공항<\/th>\n<th>연료<\/th>\n<th>비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>교체공항<\/td>\n<td>TCDFA<\/td>\n<td>목적공항이 필요한 경우<\/td>\n<\/tr>\n<tr>\n<td>NAR<\/td>\n<td><b class=\"k\">TC FA<\/b><\/td>\n<td><b class=\"k\">ISA 상태에서 Holding Speed 1,500ft 15분<\/b><\/td>\n<\/tr>\n<tr>\n<td>NA(고립)<\/td>\n<td><b class=\"k\">TC A(F)<\/b><\/td>\n<td><b class=\"k\">+2시간 Cruise 할 수 있는 연료(Final Reserve Fuel 포함)<\/b><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s04-02", "ch": 4, "num": "4.2", "title": "탑재연료 (항공법 기준)", "pages": [75], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>구분<\/th>\n<th><\/th>\n<th>비행<\/th>\n<th>조건<\/th>\n<th>연료<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>사업용 외<\/strong><\/td>\n<td><\/td>\n<td><b class=\"k\">시계<\/b>비행<\/td>\n<td><b class=\"k\">주간<\/b><\/td>\n<td>순항고도 <b class=\"k\">30분<\/b><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td>야간<\/td>\n<td><b class=\"k\">순항고도 45분<\/b><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td>계기비행<\/td>\n<td>교체 (X)<\/td>\n<td><b class=\"k\">순항고도 45분<\/b><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td>교체비행장<\/td>\n<td><b class=\"k\">순항고도 45분<\/b><\/td>\n<\/tr>\n<tr>\n<td><strong>사업용<\/strong><\/td>\n<td>터빈발동기<\/td>\n<td>시계비행<\/td>\n<td><\/td>\n<td>순항속도 45분<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td>교체 (X)<\/td>\n<td>NAR(TCFA + 1500ft/15분) / NA(TCA + (F)2hr cruise)<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><b class=\"k\">계기<\/b>비행<\/td>\n<td><b class=\"k\">교체<\/b>비행장<\/td>\n<td><b class=\"k\">(F) 450m (1,500ft) 30분<\/b><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s04-03", "ch": 4, "num": "4.3", "title": "Re-file Procedure", "pages": [3], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>목적<\/th>\n<th>관련<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1. 장거리 비행에서 ACL 을 줄이기 위해<\/td>\n<td>FLT PLAN item18 — <strong>RIF<\/strong> (Re-clearance IFR Flight)<\/td>\n<\/tr>\n<tr>\n<td>2. Contingency Fuel 을 줄이기 위해<\/td>\n<td>일부구간의 5%탑재<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s04-04", "ch": 4, "num": "4.4", "title": "Airport 종류 / Fuel Emergency vs Minimum Fuel", "pages": [80], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>공항<\/th>\n<th>의미<\/th>\n<th>내용<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Regular Airport<\/strong><\/td>\n<td>정규공항<\/td>\n<td>일반적으로 Flight Plan에 포함하는 이륙공항 / 기착지 / 목적공항<\/td>\n<\/tr>\n<tr>\n<td><strong>Provision Airport<\/strong><\/td>\n<td>예비공항<\/td>\n<td>이륙전 최초 목적공항을 변경할 수 있는 공항<\/td>\n<\/tr>\n<tr>\n<td><strong>Emergency Airport<\/strong><\/td>\n<td>비상공항<\/td>\n<td>Fuel Emergency / 폐쇄공항, 군 공항 가능<\/td>\n<\/tr>\n<tr>\n<td><strong>Alternate Airport<\/strong><\/td>\n<td>교체공항<\/td>\n<td>최초 착륙예정지로 Flight Plan에 명시할 수 없음<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>선언<\/th>\n<th>기준<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Fuel Emergency<\/strong> — Mayday(O)<\/td>\n<td>가장 가까운 공항 착륙시점 Final Reserve Fuel 미만으로 착륙예상 경우<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Minimum Fuel<\/strong> — PanPan(X) 의무 아님<\/td>\n<td>추가(조금의) 지연 있으면, “특정공항” 착륙시점 Final Reserve Fuel 미만 착륙예상<\/td>\n<td>→ 착륙시점 Final Reserve Fuel 130%미만 예상될 경우 minimum fuel 선포 준비할 것<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s04-05", "ch": 4, "num": "4.5", "title": "Alternate Airport (교체공항 총정리)", "pages": [6], "merged": false, "html": "<p><strong>① 이륙교체공항 (<b class=\"k\">AAIWM<\/b>)<\/strong> — 출발비행장 <strong>기상상태<\/strong>가 착륙최저치 이하이거나 <strong>그 밖의 다른 이유<\/strong>로 돌아올 수 없는 경우<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th>기준<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>이륙공항 위치 (<b class=\"k\">무풍/ISA<\/b>)<\/td>\n<td>60분 / 120분 — 2Eng : OEI Cruise Speed 60분 / 3-4Eng : AE Cruise Speed 120분<br>※ EDTO승인받은 경우 해당시간 적용가능<\/td>\n<\/tr>\n<tr>\n<td><b class=\"k\">ETA ±1시간<\/b><\/td>\n<td>[항공법] <b class=\"k\">비행장 운영 최저치 이상<\/b> / [FOM] <b class=\"k\">Alternate IFR WX minima<\/b><\/td>\n<\/tr>\n<tr>\n<td>그 밖의 이유<\/td>\n<td>Landing <strong>Performance<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Dispatch 단계 — MALW<\/strong> (<b class=\"k\">M<\/b>aximum <b class=\"k\">A<\/b>llowable <b class=\"k\">L<\/b>anding <b class=\"k\">W<\/b>eight) : <strong>3가지 중 가장 작은 무게<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>기준<\/th>\n<th>내용<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td><strong>MLDW : Structural Limit Landing Weight<\/strong><\/td>\n<td>초당 10ft씩 강하 하더라도 견딜 수 있는 인가된 최대 무게<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td><strong>Climb Limit Landing Weight<\/strong> — 둘 중 더 제한적인 것을 만족하는 무게<\/td>\n<td>(L/G up / Flap 1) <strong>Approach Climb Limited Gradient<\/strong> — <b class=\"k\">OEI 최소 2.1% / 2Eng경우<\/b> — 초기 어프로치 Go-Around<br>(LD configuration) <strong>Landing Climb Limited Gradient<\/strong> — <b class=\"k\">AE 최소 3.2% / TOGA 8초후<\/b> — 착륙외장 후 Go-Around<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td><strong>Field Length Limit Landing Weight<\/strong> (LDA가 RLD이상)<\/td>\n<td><b class=\"k\">RLD ≤ LDA<\/b> — Required Landing Distance ≤ Landing Distance Available 이상 만족<br>1.92 — <mark>Dry RWY RLD 1.67 x <b class=\"k\">ALD<\/b><\/mark> / <mark>Wet RWY RLD = Dry RLD x 1.15<\/mark><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>거리<\/th>\n<th>정의<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><b class=\"k\">Actual L/D Distance<\/b><\/td>\n<td>L/D Threshold <b class=\"k\">50ft<\/b> 통과 · Thrust Reversal (X) · Max Manual Brake · Full Stop 거리<br><b class=\"k\">제작사에서 발표한 실제로 항공기가 Full Stop할 때까지 필요한 거리와 근사한 값<\/b><br>Speed brake 사용가능<\/td>\n<\/tr>\n<tr>\n<td><b class=\"k\">Required L/D Distance<\/b><\/td>\n<td>Dispatch를 위해 요구되는 Distance — ALD x 1.67<\/td>\n<\/tr>\n<tr>\n<td><b class=\"k\">저시정 기준<\/b><\/td>\n<td>Visibility 1,200m 이하 / RVR 1,200m 이하 → <mark><b class=\"k\">Wet RWY RLD 적용할 것<\/b><\/mark><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>② 항로교체공항 (EDTO ERA / <b class=\"k\">AAIWM<\/b> / Non (X))<\/strong> — 항로상 어느 지점에서든지 기준시간이내에 위치해있을 것\n- 2Eng : OEI Cruise Speed 60분 / 3-4Eng : AE Cruise Speed 180분\n- ※ EDTO승인받은 경우 해당시간 적용가능\n- ※ 최초 이륙공항/목적공항이 항로 교체공항으로 지정될 수 있다.<\/p>\n<p><strong><b class=\"k\">3% ERA<\/b> 조건 (En-Route ALT)<\/strong> — Contingency Fuel 승인받은 경우 3% 탑재 / 목적지 근처에 있어야 함<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>조건<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>총거리의 25% 남은 지점 / 총거리의 20% + 50NM → 둘 중 큰 거리<\/td>\n<td>총거리의 20%거리의 반경 안<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Adequate Airport (착륙가능공항) — <mark><strong>I<\/strong><\/mark> 1개 이상의 <b class=\"k\">I<\/b>nstrument Approach / <mark><strong>P<\/strong><\/mark> <b class=\"k\">P<\/b>erformance 상 L/D 가능공항 / <mark><strong>F<\/strong><\/mark> 각종 <b class=\"k\">F<\/b>acility<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>ETA ± 1시간동안 Alternate Airport IFR Wx Minima 이상<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>※ <strong>Suitable Airport<\/strong> (착륙적합공항) = Adequate Airport + Weather + Condition<\/li>\n<\/ul>\n<p><strong>③ 목적지교체공항 (<b class=\"k\">AAIWM<\/b>)<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>구분<\/th>\n<th>연료<\/th>\n<th>내용<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>NAR<\/td>\n<td><b class=\"k\">TC FA<\/b><\/td>\n<td><b class=\"k\">ISA 상태에서 Holding Speed 1,500ft 15분<\/b><\/td>\n<\/tr>\n<tr>\n<td>NA(고립공항)<\/td>\n<td><b class=\"k\">TC A<\/b><\/td>\n<td><b class=\"k\">+2시간 Cruise 할 수 있는 연료(Final Reserve Fuel 포함)<\/b><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><strong>PNR 선정필수<\/strong><\/td>\n<td>Point of No Return — 통과하기 위한 조건 : <b class=\"k\">기상조건 / Traffic / 기타 운영조건<\/b><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>④ FPL 기재 (FOM 190p)<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>FPL Item<\/th>\n<th>내용<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Item13<\/td>\n<td>이륙교체공항 적지않음<\/td>\n<td><b class=\"k\">이륙공항(EOBT)<\/b><\/td>\n<\/tr>\n<tr>\n<td>Item16<\/td>\n<td>목적지교체공항 2개까지 적을 수 있음<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Item18<\/td>\n<td>이륙교체공항 + 항로교체공항<\/td>\n<td><b class=\"k\">TALT(T/O), RALT(Route)<\/b><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s04-06", "ch": 4, "num": "4.6", "title": "Alternate Airport IFR Wx Minima + 실제 Approach WX Minima", "pages": [8], "merged": false, "html": "<ul>\n<li><strong>Dispatch시<\/strong> Filing 교체공항 선정시 → ETA ±1시간 동안 보고기상상태가 충족해야 함.<\/li>\n<li><strong>Because<\/strong> 더 안 좋은 상황에서 착륙할 가능성이 높기 때문에 Alternate Airport IFR Wx Minima 충족해야함<\/li>\n<li>직진입절차가 2개이냐 1개이냐 또는 Circling이냐 (단, 독립된 NAV aid가 존재) — ILS-RNP 가능 / RNP-RNP (X)<\/li>\n<li><strong>Different Suitable Runway<\/strong> : 독립된 NAV aid와 RWY No.가 다른 활주로<\/li>\n<li>실제 Approach L/D minima 에서 Margin을 더해준다.<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>구분<\/th>\n<th>Ceiling (AGL 보고)<\/th>\n<th>Visibility<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>직진입 절차 1개<\/strong><\/td>\n<td>+400ft to MDA or DA<\/td>\n<td>+1,600m(1SM) to L/D minima<\/td>\n<\/tr>\n<tr>\n<td><strong>직진입 절차 2개 이상<\/strong> (정밀 아니어도 됨, Circling)<\/td>\n<td>+200ft to higher MDA or DA<\/td>\n<td>+800m(1/2SM) to higher L/D minima<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>※ <strong>Higher<\/strong> : 여러 개 중 쓰고 싶은 거 2개 그 중 높은 거 → 2nd Lowest<\/li>\n<li>적용 : TALT / DALT / EDTO / 3% (CAT1 minima / 200ft-800m를 더해줌)<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>ONLY Fail Operation<\/th>\n<th>Ceiling<\/th>\n<th>Visibility<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>CAT2<\/td>\n<td>300ft AGL<\/td>\n<td>RVR 1,200m (VIS 1,200m)<\/td>\n<\/tr>\n<tr>\n<td>CAT3<\/td>\n<td>200ft AGL<\/td>\n<td>RVR 550m (VIS 800m)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s04-07", "ch": 4, "num": "4.7", "title": "착륙가능공항(Adequate) vs 착륙적합공항(Suitable)", "pages": [8], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>구분<\/th>\n<th><\/th>\n<th>조건<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Adequate Airport<\/strong><br>착륙가능공항<\/td>\n<td><strong>I<\/strong><\/td>\n<td>1개 이상의 Instrument Approach<\/td>\n<td>예상 착륙 중량에서 성능 요구를 만족하는 공항<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><strong>P<\/strong><\/td>\n<td>Performance 상 L/D 가능공항<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><strong>F<\/strong><\/td>\n<td>각종 Facility<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Suitable Airport<\/strong><br>착륙적합공항 (진FOM 256p)<\/td>\n<td><strong>A<\/strong><\/td>\n<td>Adequate Airport<\/td>\n<td>Adequate 중에서 AAIWM + 예상 착륙시간대 Field Condition 안전 착륙 가능한 공항<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><strong>W<\/strong><\/td>\n<td>Alternate Airport IFR Weather Minima (AAIWM)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><strong>C<\/strong><\/td>\n<td>Field Condition<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<blockquote>\n<p>※ QRH상 “Suitable Airport” 혼동 → QRH에서는 <strong>일단 내리고 봐야하는 공항<\/strong><\/p>\n<\/blockquote>"}, {"id": "s04-08", "ch": 4, "num": "4.8", "title": "NAR 조건 (No Alternate Required) — 목적지 교체공항이 필요하지 않은 경우", "pages": [8], "merged": false, "html": "<ol>\n<li>기상이 시계비행 상태 착륙이 확실시 될 때<\/li>\n<li>법적으로 선정하지 않아도 될 때<\/li>\n<\/ol>\n<p><strong>ETA ± 1시간동안 아래의 조건을 만족<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>조건<\/th>\n<th>비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>최소 1개 이상의 Instrument Approach<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>2개 이상의 Separate Runway(독립적인 다른 활주로)<\/td>\n<td>Incl. Cross Runway<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Visibility 최소 3SM or Lowest minimum + 2SM<\/td>\n<td>둘 중 큰 것<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>Ceiling — Circling 예상시, Lowest minimum + 1,500ft<br>Straight in 예상시, Lowest minimum + 1,500ft or 2,000ft<\/td>\n<td>둘 중 큰 것<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s04-09", "ch": 4, "num": "4.9", "title": "3% ERA Circle & 승인 조건", "pages": [8], "merged": false, "html": "<p>Contingency Fuel 승인 받은 경우 3% 탑재 / 목적지 근처에 있어야 함 — AAIWM 적용<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>조건<\/th>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>총거리의 25%(1/4) 남은 지점 / 총거리의 20%(1/5) + 50NM<\/td>\n<td>둘 중 긴 거리 중심으로<\/td>\n<td>총거리의 20%(1/5) 거리의 반경 안 — 1,000NM 경우 거리 같아짐<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Adequate Airport (착륙가능공항)<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>3% ERA 승인 조건 — <b class=\"k\">FADEC<\/b><\/strong> (Trip Fuel의 3% 필요조건)<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<th>조건<\/th>\n<th>비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>F<\/strong><\/td>\n<td><\/td>\n<td>Fuel Consumption Monitoring Program 운용<\/td>\n<td>운항관리사 ACARS Report<\/td>\n<\/tr>\n<tr>\n<td><strong>A<\/strong><\/td>\n<td>3% ERA<\/td>\n<td>Adequate Airport + AAIWM 충족 (ETA ± 1시간)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>D<\/strong><\/td>\n<td><\/td>\n<td>Destination Airport — 정상 운용 최소치 만족<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>E<\/strong><\/td>\n<td><\/td>\n<td>Establish Procedure 있어야 함<\/td>\n<td>수립된 절차 필요<\/td>\n<\/tr>\n<tr>\n<td><strong>C<\/strong><\/td>\n<td>3% ERA<\/td>\n<td>Circle 이내에 있어야 함<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s04-10", "ch": 4, "num": "4.10", "title": "EDTO ERA (En-Route Alternate Airport) 기상 기준", "pages": [8], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>구분<\/th>\n<th>기준<\/th>\n<th>적용<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>EDTO ERA<\/strong><\/td>\n<td>Alternate Airport IFR Weather Minima 만족해야 함<\/td>\n<td>목적지교체공항 · 이륙교체공항 · EDTO 교체공항<\/td>\n<\/tr>\n<tr>\n<td><strong>Non EDTO ERA<\/strong><\/td>\n<td>Adequate Airport 이면 됨<br>정상 운용 최소값 (Normal Operating Wx minima) — 아래 중 가장 높은 것 적용<\/td>\n<td>목적공항 · Non-EDTO 교체공항<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>정상 운용 최소값 (일반적으로) : 1. Published minima / 2. Company minima / 3. Crew minima / 4. Aircraft minima<\/p>"}, {"id": "s04-11", "ch": 4, "num": "4.11", "title": "EDTO (Extended Diversion Time Operation, 회항시간연장운항)", "pages": [32, 35], "merged": true, "html": "<ul>\n<li><strong>ETOPS<\/strong> : Extended range Twin Engines Operational Performance Standards — 개정 전 명칭<\/li>\n<li>Threshold time이 아닌 EDTO 승인시간을 적용하여 항로상 어느 지점에 서든지 EDTO 승인시간 안에 항로상 교체공항이 위치해 있어야 그 해당 운항에 대해 허가를 받을 수 있는 개념 / Dispatch 승인기준 일 뿐(예외적 운항) / 실제 문제가 발생하면 회항이 우선<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Threshold time<\/th>\n<th>기준<\/th>\n<th>거리<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>2Eng<\/td>\n<td>1Eng INOP 순항속도<\/td>\n<td>60분 거리<\/td>\n<\/tr>\n<tr>\n<td>3Eng<\/td>\n<td>All Eng OP 순항속도<\/td>\n<td>180분 거리<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>EDTO 승인<\/th>\n<th>조건<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>75분<\/td>\n<td>운항경험이 극히 적거나 전혀 없는 경우<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>120분<\/td>\n<td>해당 항공기 12개월간 운용 경험<\/td>\n<td>항로교체 공항이 더 멀리 있어도 됨<\/td>\n<\/tr>\n<tr>\n<td>180분<\/td>\n<td>120분 장거리 운항 12개월 운용 경험<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>207분<\/td>\n<td>180분 장거리 운항 승인 받은 항공운송사업자<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>EDTO 상세<\/strong>\n- <strong>Long Range Navigation<\/strong> : Ground Based Navigation 수신범위 밖의 비행 = Class II Navigation\n- Threshold Time 내에 항로 교체공항이 있지 않은 경우, EDTO 승인시간 적용<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><mark>Threshold Time<\/mark><\/th>\n<th>OEI / LRC 60분 거리<\/th>\n<th><b class=\"k\">무풍 / ISA<\/b><\/th>\n<th>2eng 기준<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><mark>EDTO 승인시간<\/mark><\/td>\n<td>120분<\/td>\n<td>180분<\/td>\n<td>207분<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"figs\"><figure><img src=\"img/i-035-016.webp\" alt=\"EDTO Entry / Exit Point와 ETP (Equal Time Point)\" loading=\"lazy\"><figcaption>EDTO Entry / Exit Point와 ETP (Equal Time Point)<\/figcaption><\/figure><\/div>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Point<\/th>\n<th>정의<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>EDTO Entry Point<\/strong><\/td>\n<td>원래 안되는데 이제는 갈 수 있는 지점<\/td>\n<\/tr>\n<tr>\n<td><strong>EDTO Exit Point<\/strong><\/td>\n<td>Threshold Time 범위 내로 들어오는 지점<\/td>\n<\/tr>\n<tr>\n<td><strong>Equal Time Point<\/strong><\/td>\n<td>각 교체공항 가는데 같은 시간이 걸리는 지점<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><b class=\"k\">Alternate Airport IFR Weather Minimum 충족필요<\/b> — <b class=\"k\">ETA ±1시간<\/b><\/li>\n<li><strong>Earliest ETA<\/strong> : ETP2에서 / 2Eng 가장 빨리<\/li>\n<li><strong>Latest ETA<\/strong> : EXT에서 여압 상실 / 10,000피트에서<\/li>\n<li>Earliest ETA / Latest ETA 기준으로 각각 ETA ± 1시간<\/li>\n<\/ul>"}, {"id": "s05-01", "ch": 5, "num": "5.1", "title": "WEIGHT", "pages": [3], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>단계<\/th>\n<th>정의<\/th>\n<th>추가 항목<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><b class=\"k\">MEW<\/b><\/td>\n<td><b class=\"k\">M<\/b>anufacture <b class=\"k\">E<\/b>mpty <b class=\"k\">W<\/b>eight — 공장출고상태<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><mark>+ Standard item<\/mark> →<\/td>\n<td><\/td>\n<td><strong>FOD EOBT<\/strong> (아래 표)<\/td>\n<\/tr>\n<tr>\n<td><b class=\"k\">BEW<\/b><\/td>\n<td><b class=\"k\">B<\/b>asic <b class=\"k\">E<\/b>mpty <b class=\"k\">W<\/b>eight<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><mark>+ Operating item<\/mark> →<\/td>\n<td><\/td>\n<td>Crew with bag, 기내식, 음료, 서비스물품, 판매물품, <strong>Flight Away Kit<\/strong>, Emer Equip non-fixed<\/td>\n<\/tr>\n<tr>\n<td><b class=\"k\">SOW<\/b><\/td>\n<td><b class=\"k\">S<\/b>tandard <b class=\"k\">O<\/b>perating <b class=\"k\">W<\/b>eight<\/td>\n<td>P &amp; F가 빠진 무게 / Payload와 Fuel이 빠진 Weight<\/td>\n<\/tr>\n<tr>\n<td><b class=\"k\">DB<\/b><\/td>\n<td><mark>= Dry Operating Weight<\/mark><\/td>\n<td><mark>Basic Operating Weight · Operating Empty Weight<\/mark> (모두 같은 의미)<\/td>\n<\/tr>\n<tr>\n<td><mark>+ Payload<\/mark> →<\/td>\n<td><\/td>\n<td>*Ballast Fuel : within limit 유지 / wing loading 일정수준 유지 / structure damage 유지 — Wing에서 쓰면 안되는 연료 / CG를 Limit에 두기 위해 옮길 수 있는 연료<\/td>\n<\/tr>\n<tr>\n<td><b class=\"k\">ZFW<\/b><\/td>\n<td><b class=\"k\">Z<\/b>ero <b class=\"k\">F<\/b>uel <b class=\"k\">W<\/b>eight<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><mark>+ Take off Fuel<\/mark><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><b class=\"k\">TOW<\/b><\/td>\n<td><b class=\"k\">T<\/b>ake <b class=\"k\">O<\/b>ff <b class=\"k\">W<\/b>eight<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Standard item — FOD EOBT<\/strong> (*Flight Away Kit / Emergency Equipment but not Fixed 는 Operating item)<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>항목<\/th>\n<th>내용<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>F<\/strong><\/td>\n<td>Uncountable <b class=\"k\">Fuel<\/b><\/td>\n<td>매비행마다 변함X + MEW 포함X<\/td>\n<\/tr>\n<tr>\n<td><strong>O<\/strong><\/td>\n<td><b class=\"k\">Oil<\/b><\/td>\n<td>각종 오일 / 매비행마다 Refill<\/td>\n<\/tr>\n<tr>\n<td><strong>D<\/strong><\/td>\n<td><b class=\"k\">Door<\/b><\/td>\n<td>특히 <strong>보안도어<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>E<\/strong><\/td>\n<td><b class=\"k\">Emergency Equipment<\/b><\/td>\n<td><strong>Fixed<\/strong> item, 소화기 등<\/td>\n<\/tr>\n<tr>\n<td><strong>O<\/strong><\/td>\n<td><b class=\"k\">Option<\/b><\/td>\n<td>인테리어, 구조 등의 옵션<\/td>\n<\/tr>\n<tr>\n<td><strong>B<\/strong><\/td>\n<td>Flight Away Kit <b class=\"k\">Bin<\/b><\/td>\n<td>상자 / 정비, Service 물품<\/td>\n<\/tr>\n<tr>\n<td><strong>T<\/strong><\/td>\n<td><b class=\"k\">Toilet<\/b> flood, chemical Charge<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Payload 계산<\/strong>\n- *Take Off Weight : <b class=\"k\">AGTOW – SOW = Payload + Fuel<\/b>\n- 즉, AGTOW에서 T/O Fuel을 빼면 Payload가 나오니깐 ACL(Allowable Cabin Load)\n- <mark><b class=\"k\">ACL = AGTOW – SOW – TOF<\/b><\/mark>\n- <b class=\"k\">Maximum Payload = MZFW – SOW<\/b>\n- ACL = MDPL(Maximum Design Payload) → AGTOW가 MZFW + Take off Fuel로 정해졌을 때. 다른 걸로 정해지면, ACL보다 MDPL이 더 커진다. ACL은 MDPL을 초과할 수 없다.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>용어<\/th>\n<th>의미<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>ACL<\/strong><\/td>\n<td>현실적으로 실을 수 있는 MAX Payload<\/td>\n<\/tr>\n<tr>\n<td><strong>MDPL<\/strong><\/td>\n<td>이론적인 최댓값<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>ACL증가방법<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>방법<\/th>\n<th>효과<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><mark><b class=\"k\">AGTOW증가(Unbalanced V1사용)<\/b><\/mark><\/td>\n<td>Max V1↑ → <b class=\"k\">AGD↓<\/b><\/td>\n<td>35ft 짧아짐 → <b class=\"k\">OLW↑ 증가<\/b><\/td>\n<\/tr>\n<tr>\n<td>무거울수록 Vmbe↓ →<\/td>\n<td>Min V1↓<\/td>\n<td><b class=\"k\">BELW↑ 증가<\/b><\/td>\n<\/tr>\n<tr>\n<td>Re-file Procedure<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s05-02", "ch": 5, "num": "5.2", "title": "AGTOW (Allowable Gross Take Off Weight) — Operational FLT Plan", "pages": [3], "merged": false, "html": "<p><strong>다음 중 적은 것을 충족시켜야 함<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>기준<\/th>\n<th>더하는 연료<\/th>\n<th>의미<\/th>\n<th>목적<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><b class=\"k\">MTOW<\/b><\/td>\n<td><\/td>\n<td>제작사에서 정한 기준<\/td>\n<td><b class=\"k\">Structural Damage<\/b><\/td>\n<\/tr>\n<tr>\n<td><b class=\"k\">MLDW<\/b><\/td>\n<td><b class=\"k\">+ Trip Fuel (Burn off Fuel)<\/b><\/td>\n<td>랜딩 기준<\/td>\n<td><b class=\"k\">Overweight Landing<\/b><\/td>\n<\/tr>\n<tr>\n<td><b class=\"k\">MZFW<\/b><\/td>\n<td><b class=\"k\">+ Take off Fuel<\/b><\/td>\n<td><mark>빈 날개 공중 최대하중 초과금지<\/mark><\/td>\n<td><b class=\"k\">Empty Wing Loading<\/b> on the Air<\/td>\n<\/tr>\n<tr>\n<td><b class=\"k\">RWY Limited T/O Weight<\/b><\/td>\n<td><\/td>\n<td>V1 = Vmcg limited weight<\/td>\n<td>PA(↓), T(↓) → Vmcg(↑) → V1(↑) → ASD(↑)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>RWY Limited T/O Weight 구성<\/strong> (<b class=\"k\">성능교재 26P<\/b>)\n- <strong>FLW<\/strong> — <b class=\"k\">F<\/b>ield <b class=\"k\">L<\/b>ength Limited Weight\n- <strong>OLW<\/strong> — <b class=\"k\">O<\/b>bstacle Limited Weight\n- <b class=\"k\">C<\/b>limb Limited Weight\n- <b class=\"k\">T<\/b>ire Speed Limited Weight (204kt)\n- <b class=\"k\">B<\/b>rake Energy Limited Weight (Vmbe)\n- <b class=\"k\">R<\/b>eturn to Land Limited Weight<\/p>"}, {"id": "s05-03", "ch": 5, "num": "5.3", "title": "Runway Limited TO Weight (VFO / CTBR)", "pages": [6], "merged": false, "html": "<p><strong><b class=\"k\">VFO / CTBR<\/b><\/strong> — 각 항목 앞글자<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>항목<\/th>\n<th>내용<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><mark><strong>V<\/strong><\/mark><\/td>\n<td>V1 = Vmcg limited weight<\/td>\n<td>Minimum V1 → AGTOW <b class=\"k\">BELW<\/b>에 제한<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td>Maximum V1 → AGTOW <b class=\"k\">OLW<\/b>에 제한<\/td>\n<td>AGD 감소 → 35ft까지 더 빨리 도착함<\/td>\n<\/tr>\n<tr>\n<td><mark><strong>F<\/strong><\/mark><\/td>\n<td><b class=\"k\">F<\/b>ield Length Limited Weight<br><b class=\"k\">Balanced Field Length: ASD = AGD<\/b><\/td>\n<td>ASD ≤ ASDA<\/td>\n<td>V1 1초전 event, Stop distance<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td>TOR ≤ TORA<\/td>\n<td>AE TOD 35ft + 15%<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td>TOD ≤ TODA<\/td>\n<td>V1 1초전 EF, 35ft above TO SFC<\/td>\n<\/tr>\n<tr>\n<td><mark><strong>O<\/strong><\/mark><\/td>\n<td><b class=\"k\">O<\/b>bstacle Limited Weight<\/td>\n<td><mark><b class=\"k\">Net TO FLT Path<\/b>가 항로상 <b class=\"k\">유의미한 장애물<\/b> 최소 35ft 이상 통과하게 하는 최대 무게<\/mark><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>Airport boundary<\/td>\n<td>→ Path 좌우 <b class=\"k\">200ft<\/b> 이내<\/td>\n<td>Path 좌우 <b class=\"k\">300ft<\/b> 이내 (Airport boundary 밖)<\/td>\n<\/tr>\n<tr>\n<td><mark><strong>C<\/strong><\/mark><\/td>\n<td><b class=\"k\">C<\/b>limb Limited Weight<\/td>\n<td><mark>Gross FLT Path가 각 Segment에서 요구되는 최소 상승률을 모두 만족하는 최대 무게<\/mark><\/td>\n<td>OEI상황에서 요구조건 충족필요 / 순수 상승 성능<\/td>\n<\/tr>\n<tr>\n<td><mark><strong>T<\/strong><\/mark><\/td>\n<td><b class=\"k\">T<\/b>ire Speed Limited Weight (204kt)<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><mark><strong>B<\/strong><\/mark><\/td>\n<td><b class=\"k\">B<\/b>rake Energy Limited Weight (Vmbe)<\/td>\n<td>무거울수록 V1 감소<\/td>\n<td>Brake apply 최대무게<\/td>\n<\/tr>\n<tr>\n<td><mark><strong>R<\/strong><\/mark><\/td>\n<td><b class=\"k\">R<\/b>eturn to Land Limited Weight<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>MTOW 결정은 Net TO path → <b class=\"k\">Dispatch 가능여부<\/b><\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Flight Path<\/th>\n<th>정의<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Gross TO FLT Path<\/strong><\/td>\n<td>최악의 상황에서(V1 1초전 OEI) 예상되는 항공기의 Flight Path<\/td>\n<\/tr>\n<tr>\n<td><strong>Net TO FLT Path<\/strong><\/td>\n<td>V1 1초전 OEI. Gross (Actual) TO FLT Path에서 상승구간(0.8% 상승률 빼주고/2Eng) 가속구간은 더 길게 만들어주는 FLT Path / <b class=\"k\">모든 장애물을 최소 35ft통과<\/b><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"figs\"><figure><img src=\"img/i-006-000.webp\" alt=\"Takeoff flight path — Gross / Net TO FLT Path와 Segment\" loading=\"lazy\"><figcaption>Takeoff flight path — Gross / Net TO FLT Path와 Segment<\/figcaption><\/figure><\/div>\n<p><strong>Climb Segment<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Segment<\/th>\n<th>구간<\/th>\n<th>요구 상승률<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><b class=\"k\">1st Segment<\/b><\/td>\n<td>Liftoff ~ Landing gear up<\/td>\n<td>요구 최소상승률 Positive / 2Eng<\/td>\n<\/tr>\n<tr>\n<td><b class=\"k\">2nd Segment<\/b><\/td>\n<td>G/Up ~ Acceleration Height(최소 400ft AGL 이상)<\/td>\n<td>요구 최소상승률 2.4% / 2Eng<\/td>\n<\/tr>\n<tr>\n<td><b class=\"k\">3rd Segment<\/b><\/td>\n<td>Acceleration Height Level off / VMC(아래 3가지)<\/td>\n<td>가속구간(<b class=\"k\">TOGA 10분 완료<\/b>) 요구 상승률X<\/td>\n<\/tr>\n<tr>\n<td><b class=\"k\">4th Segment<\/b><\/td>\n<td>~ 1,500ft 고도상승 — <mark><b class=\"k\">VFTO · MCT · Clean-up<\/b><\/mark><\/td>\n<td>요구 최소상승률 1.2% / 2Eng<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s05-04", "ch": 5, "num": "5.4", "title": "TOD — Required Takeoff Field Length", "pages": [3], "merged": false, "html": "<ul>\n<li><strong>TOD<\/strong> : <b class=\"k\">T<\/b>ake <b class=\"k\">O<\/b>ff <b class=\"k\">D<\/b>istance<\/li>\n<li><mark>Takeoff Field Length<\/mark> : 이륙하기 위해 필요한 활주로 거리 → <strong>아래 3중 가장 긴 거리<\/strong><\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Dry RWY TOD<\/th>\n<th>조건<\/th>\n<th>비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1.<\/td>\n<td>TOD ≤ TODA<\/td>\n<td><b class=\"k\">AGoD<\/b><\/td>\n<\/tr>\n<tr>\n<td>2.<\/td>\n<td>ASD ≤ ASDA<\/td>\n<td><b class=\"k\">AStopD<\/b><\/td>\n<\/tr>\n<tr>\n<td>3.<\/td>\n<td>AGD vs <b class=\"k\">AE TOD X 1.15<\/b> → 둘 중 큰 것<\/td>\n<td>Dry RWY only / <b class=\"k\">*Windshear Performance 안 나올 경우 Margin<\/b><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Wet RWY TOD (아래 3중 가장 긴 거리)<\/th>\n<th>비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1. AGD (35ft) Dry RWY (= Dry RWY TOD)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>2. AE TOD X 1.15<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>3. <b class=\"k\">15ft<\/b> 까지의 AGD on wet RWY<\/td>\n<td>V1이 <b class=\"k\">감소<\/b>된 AGD(늘어날 수 밖에 없음) → ASD를 짧게하기 위해서<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s05-05", "ch": 5, "num": "5.5", "title": "TODA / ASDA / Clearway", "pages": [8], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>거리<\/th>\n<th>구성<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>TODA<\/strong><\/td>\n<td>TORA(Take Off Run Available) + Clearway (500ft폭 이상 또는 RWY 1/2)<\/td>\n<\/tr>\n<tr>\n<td><strong>ASDA<\/strong><\/td>\n<td>TORA(Take Off Run Available) + Stopway<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>Clearway<\/strong> : 활주로 끝에서 시작하는 1.25% 상승면을 장애물이 침범하지 않아야 한다. (장애물 제한면의 기울기)<\/li>\n<li>ASDA가 항상 TODA를 포함하지는 않음 : Stopway는 되는데 Clearway로 인정받지 못한 경우가 있음<\/li>\n<\/ul>"}, {"id": "s05-06", "ch": 5, "num": "5.6", "title": "ASD (Accelerate-Stop Distance)", "pages": [3], "merged": false, "html": "<ul>\n<li><strong><b class=\"k\">ASD<\/b><\/strong> ≤ <b class=\"k\">ASDA<\/b> 보다 작거나 같아야 함<\/li>\n<li><mark><b class=\"k\">최악의 상황<\/b>(V1 1초전) 에서 <b class=\"k\">Event<\/b>(C.E.F / Eng Fire, Windshear)발생 가정시 <b class=\"k\">Full STOP<\/b> 에 필요한 Distance<\/mark><\/li>\n<li>Full Stop에 필요한 거리 + <strong>V1 속도로 2초동안 진행되는 거리<\/strong><\/li>\n<li>Fire 보다 Engine Fail 경우, 거리가 더 길어짐<\/li>\n<li>V1 1초전 : ASD 가장 길어지는 상황 — RTO할 수 있는 가장 최악<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>Low Speed<\/th>\n<th><\/th>\n<th>High Speed<\/th>\n<th><\/th>\n<th>뜨는 게 더 효율적일 수 있음<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Boeing<\/td>\n<td>RTO<\/td>\n<td><strong>80kt<\/strong><\/td>\n<td><b class=\"k\">Fire, Fail, PWS<\/b>, unsafe<\/td>\n<td>V1<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Airbus<\/td>\n<td>Stop Minded<\/td>\n<td><strong>100kt<\/strong><\/td>\n<td>Go Minded<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>Malfunction이 생겼을 때<\/td>\n<td><\/td>\n<td>RTO or Continue TO<\/td>\n<td><\/td>\n<td>Decision Guideline<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s05-07", "ch": 5, "num": "5.7", "title": "AGD (Accelerate-Go Distance)", "pages": [3], "merged": false, "html": "<ul>\n<li>댄공 성능교재 / FCTM참고 — <b class=\"k\">Takeoff Surface<\/b> / <b class=\"k\">V2 속도를 얻기까지 거리<\/b><\/li>\n<li><mark>V1 1초전, <b class=\"k\">C.E.F<\/b> 발생 가정시, <b class=\"k\">Continue Take off<\/b> 후, <strong>활주로<\/strong> 상공 <b class=\"k\">35ft<\/b>에 이를 때까지의 Horizontal Distance<\/mark><\/li>\n<li><strong>Improved Climb Method<\/strong> : Unbalanced V1 → 거리충분 → V1/Vr/V2 증가 → ASD는 길어지지만, AGD는 짧아진다<\/li>\n<\/ul>"}, {"id": "s05-08", "ch": 5, "num": "5.8", "title": "V1 Performance", "pages": [8], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>요인<\/th>\n<th>영향<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>항공기 중량<\/td>\n<td>무거우면 ASD 길어짐 → V1 증가 또는 감소<\/td>\n<td>더 높은 속도에서 감속 가능<\/td>\n<\/tr>\n<tr>\n<td>활주로 거리<\/td>\n<td>ASDA 짧으면 → V1 낮춰준다<\/td>\n<td>짧은 거리에서 정지 또는 이륙<\/td>\n<\/tr>\n<tr>\n<td>고도 및 기온<\/td>\n<td>고도 낮고, 기온 낮다 → 퍼포먼스 좋다 → AGD 줄어듬 → V1 낮춰준다<\/td>\n<td>V1 낮추면 → AGD 증가함<\/td>\n<\/tr>\n<tr>\n<td>Aft CG<\/td>\n<td>Arm 짧아지면 → Vmcg 높아짐<\/td>\n<td>속도가 빨라져야 함<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>ASD가 AGD보다 크면 → <strong>V1 감소<\/strong> / AGD가 ASD보다 크면 → <strong>V1 증가<\/strong><\/li>\n<\/ul>"}, {"id": "s05-09", "ch": 5, "num": "5.9", "title": "Improved Climb Method (Performance Takeoff)", "pages": [6], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>조건<\/th>\n<th>방법<\/th>\n<th>결과<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>활주로 길이가 충분할 때<\/td>\n<td>의도적으로 <b class=\"k\">V1, Vr, V2 증가<\/b>시켜<\/td>\n<td><b class=\"k\">더 나은 상승률<\/b>을 얻을 수 있음<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>→ <b class=\"k\">Climb Limited Weight 증가<\/b>시킬 수 있음<\/td>\n<td>→ ACL 증가 시킬 수 있음<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s05-10", "ch": 5, "num": "5.10", "title": "OLW (Obstacle Limited Weight)", "pages": [43], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><strong>OLW<\/strong><\/th>\n<th><b class=\"k\">O<\/b>bstacle <b class=\"k\">L<\/b>imited <b class=\"k\">W<\/b>eight<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><b class=\"k\">Net T/O Flight Path<\/b><\/td>\n<td>이륙경로상 모든 장애물<\/td>\n<td><b class=\"k\">35ft<\/b> 상공 통과<\/td>\n<\/tr>\n<tr>\n<td>Gross T/O Flight Path<\/td>\n<td>초기에는 35ft보다 작게 회피하게 됨<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"figs\"><figure><img src=\"img/i-044-020.webp\" alt=\"Net / Gross Flight Path와 장애물\" loading=\"lazy\"><figcaption>Net / Gross Flight Path와 장애물<\/figcaption><\/figure><\/div>"}, {"id": "s05-11", "ch": 5, "num": "5.11", "title": "Flap 설정과 성능", "pages": [43], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Flap<\/th>\n<th><\/th>\n<th>영향<\/th>\n<th>성능 제한<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Flap 5<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Flap 1<\/td>\n<td>Lower Flap<\/td>\n<td>Takeoff Roll 길어짐<\/td>\n<td>Field Length Limited Weight<\/td>\n<td>감소됨<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><b class=\"k\">Climb<\/b> Performance 좋음<\/td>\n<td>Climb Limited Weight<\/td>\n<td>증가시킬 수 있음<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s05-12", "ch": 5, "num": "5.12", "title": "Reduced Thrust — Derate / ATM(Assumed Temperature Method) / Flex Temp", "pages": [24], "merged": false, "html": "<p><strong>Derated<\/strong> : Variable Takeoff Rating or Fixed Takeoff Rating Thrust\n<strong>ATM<\/strong> Assumed Temperature Method (Boeing) / <strong>Flex Temp<\/strong> (Airbus)<\/p>\n<ul>\n<li>온도를 FMC에 더 높은 입력하여 FADEC(EEC) 항공기 소프트웨어)가 자동으로 추력을 줄인 상태로 T/O하게 만드는 방법<\/li>\n<li>최대 추력의 <strong>25%<\/strong>까지 감소 한계<\/li>\n<li>※ 엔진수명연장 / 정비비절감 / 연료사용량 감소 X → 상승률이 안나올 수 있으니깐<\/li>\n<li>Maximum TO Thrust time : <strong>5분<\/strong> — 3rd Segment 종료시까지<\/li>\n<\/ul>\n<p><strong>EGT제한<\/strong> — Exhaust Gas Temperature (*737,320 EGT 950° Limit)\n- 목적 : 너무 뜨거우면 Engine Damag
