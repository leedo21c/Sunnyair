b class=\"k\">S<\/b>now<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td><mark><strong>S<\/strong><\/mark><\/td>\n<td><b class=\"k\">S<\/b>lush<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td><strong>I<\/strong><\/td>\n<td><b class=\"k\">I<\/b>ce<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td><strong>C<\/strong><\/td>\n<td><b class=\"k\">C<\/b>ompacted or Rolled Snow<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td><strong>E(F)<\/strong><\/td>\n<td><b class=\"k\">F<\/b>rozen (Ruts or Ridges)<\/td>\n<td>Ruts : 바퀴자국 / Ridges : 언덕 — 굴곡져있다.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>※ 52일 경우 : 5(앞숫자) 눈에 보이는 것 / 2(뒷숫자) 밑에 쌓여있는 것<\/li>\n<\/ul>"}, {"id": "s11-01", "ch": 11, "num": "11.1", "title": "Ground Effect", "pages": [63], "merged": false, "html": "<ul>\n<li><strong>Ground Effect<\/strong> : <b class=\"k\">Wingtip vortex가 지면에 상쇄되어 Downdraft 막아줘서 induced Drag가 줄어든다.<\/b><\/li>\n<li>Downdraft 감소 → Relative wind → Induced Drag 감소 → Lift 뒤로 휘어짐 → Lift 기울어진 정도 감소<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Out of Ground Effect<\/th>\n<th>변화<\/th>\n<th>Into Ground Effect<\/th>\n<th>표시<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Induced Drag<\/td>\n<td>증가<\/td>\n<td><b class=\"k\">ASI<\/b><\/td>\n<td><b class=\"k\">낮게 표시됨<\/b><\/td>\n<\/tr>\n<tr>\n<td>Speed<\/td>\n<td>증가<\/td>\n<td><b class=\"k\">Altimeter<\/b><\/td>\n<td><b class=\"k\">낮게 표시됨<\/b><\/td>\n<\/tr>\n<tr>\n<td>Thrust<\/td>\n<td>증가<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>AOA<\/td>\n<td>증가<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>※ 지면과 가까워지면서 항공기 아래부분을 압축하면서 <b class=\"k\">static port<\/b>에서 느끼는 pressure가 <b class=\"k\">실제보다 높게 인식<\/b>되기 때문<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>계기<\/th>\n<th>원리<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Airspeed<\/td>\n<td>Total P – Static P <b class=\"k\">(+)<\/b> = Dynamic P<\/td>\n<td><b class=\"k\">(–)<\/b><\/td>\n<\/tr>\n<tr>\n<td>Altimeter<\/td>\n<td>Set P – Feel P <b class=\"k\">(+)<\/b> =<\/td>\n<td><b class=\"k\">(–)<\/b><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>Wing span 1 = 1.4 %감소 / 1/4 = 23%감소 / 1/10 = 47% 감소 — 높은 기압 측정 → 낮은 고도 표시<\/li>\n<\/ul>"}, {"id": "s11-02", "ch": 11, "num": "11.2", "title": "유도항력(Induced Drag) / 유해항력(Parasite Drag) — PHAK 104p", "pages": [63], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>유도항력 (Lift에 의한 항력)<\/th>\n<th>특성<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>속도제곱에 반비례<\/td>\n<td>속도 <b class=\"k\">높<\/b>아지면<\/td>\n<td>유도항력 감소 / <b class=\"k\">유해항력 증가<\/b><\/td>\n<\/tr>\n<tr>\n<td>L/D max 기준<\/td>\n<td>속도 <b class=\"k\">낮<\/b>아지면<\/td>\n<td><b class=\"k\">유도항력 급격히 증가 → 기수를 들어야함<\/b><\/td>\n<\/tr>\n<tr>\n<td>날개면적에 비례<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>가로세로비 반비례 (Aspect Ratio)<\/td>\n<td>Span/Chord ; 20/1 = Span제곱/Wing Surface Area<\/td>\n<td>유도항력 감소 → Wingtip Vortex 감소 / Downwash 감소<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>L/D Max 그래프 : 가로 속도 – 세로 항력<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>유해항력 (<b class=\"k\">FIS<\/b>) — Parasite Drag / 속도제곱에 비례<\/th>\n<th>원인<\/th>\n<th>대책<\/th>\n<th>분류<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><mark><b class=\"k\">F<\/b>orm Drag<\/mark><\/td>\n<td>L/G → 공기분리 → 진공 → Eddy 발생<\/td>\n<td>streamline<\/td>\n<td>형상 (압력)<\/td>\n<\/tr>\n<tr>\n<td><mark><b class=\"k\">I<\/b>nterference Drag<\/mark><\/td>\n<td>교차점 완화<\/td>\n<td>Fairing<\/td>\n<td>간섭<\/td>\n<\/tr>\n<tr>\n<td><mark><b class=\"k\">S<\/b>kin Friction Drag<\/mark><\/td>\n<td>표면의 거칠기, 마찰<\/td>\n<td>최대한 박리지연<\/td>\n<td>마찰<\/td>\n<\/tr>\n<tr>\n<td>Shock wave<\/td>\n<td><\/td>\n<td><\/td>\n<td>조파<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s11-03", "ch": 11, "num": "11.3", "title": "L/D MAX / Region of Reversed Command", "pages": [65], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>구분<\/th>\n<th>의미<\/th>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>MRC<\/strong><\/td>\n<td><b class=\"k\">M<\/b>aximum <b class=\"k\">R<\/b>ange <b class=\"k\">C<\/b>ruise Speed<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>LRC<\/strong><\/td>\n<td><b class=\"k\">L<\/b>ong <b class=\"k\">R<\/b>ange <b class=\"k\">C<\/b>ruise Speed<\/td>\n<td>MRC의 <b class=\"k\">1% 연료 손해<\/b><\/td>\n<td><b class=\"k\">3~5% 속도 or 시간 이득<\/b><\/td>\n<\/tr>\n<tr>\n<td><strong>L/D Max<\/strong><\/td>\n<td><b class=\"k\">Total Drag minimum<\/b><\/td>\n<td><b class=\"k\">Induced Drag / Parasite Drag<\/b> (교차점)<\/td>\n<td>AOA + 적절한 Speed<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>L/D Max 기준<\/th>\n<th>Vx<\/th>\n<th>Vy<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><b class=\"k\">프로펠러<\/b><\/td>\n<td>Vx(L/D max − @)<\/td>\n<td>Vy(L/D max) — Maximum <b class=\"k\">Range<\/b><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><b class=\"k\">제트<\/b><\/td>\n<td><b class=\"k\">Vx(L/D max)<\/b><\/td>\n<td>Vy(L/D max + @)<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>정의<\/th>\n<th>고도 증가에 따라<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>V<b class=\"k\">x<\/b><\/td>\n<td>Max Excess <b class=\"k\">Thrust<\/b><\/td>\n<td>증가<\/td>\n<\/tr>\n<tr>\n<td>V<b class=\"k\">y<\/b><\/td>\n<td>Max Excess <b class=\"k\">Power<\/b><\/td>\n<td>감소<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>Jet A/C → <b class=\"k\">L/D Max Speed<\/b> 비행시 → <mark>Max <b class=\"k\">Endurance<\/b> Speed<\/mark><\/li>\n<li>Prop A/C → Max Range + Max Endurance<\/li>\n<li>*intake air inlet으로 들어오는 데 시간이 필요함<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>구간<\/th>\n<th>내용<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>→ <strong><b class=\"k\">Region of Reversed command<\/b><\/strong><\/td>\n<td><mark>더 <b class=\"k\">높은<\/b> 속도를 유지하기 위해 <b class=\"k\">더 낮은 파워 세팅<\/b> 필요<\/mark><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>Ex) Slow Flight <b class=\"k\">고도유지<\/b>를 위한 최소 파워 → Max <b class=\"k\">Endurance<\/b> Speed<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><mark><b class=\"k\">Stall Speed 위<\/b>와 → Max <b class=\"k\">Endurance<\/b> Speed <b class=\"k\">아래<\/b> 사이 구간<\/mark><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>이 구간은 속도 ↓ → 받음각 ↑ → <mark>유도항력 <b class=\"k\">급증<\/b><\/mark> → 속도를 줄이는데도 더 많은 파워 필요<\/td>\n<\/tr>\n<tr>\n<td>→ <strong>Region of Normal command<\/strong><\/td>\n<td>더 높은 속도를 유지하기 위해 더 높은 파워 세팅 필요<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s11-04", "ch": 11, "num": "11.4", "title": "항공기 무게 감소와 Best Range (Cruise Climb)", "pages": [67], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Best Range (L/D Max)<\/th>\n<th><b class=\"k\">특정 AOA<\/b> 유지해야 함<\/th>\n<th><b class=\"k\">무게 감소 →<\/b><\/th>\n<th><b class=\"k\">속도 감소<\/b><\/th>\n<th><b class=\"k\">고도 증가<\/b><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>프롭<\/td>\n<td>L/D max<\/td>\n<td>Level 하기 위한 Lift 덜 필요<\/td>\n<td>→ <b class=\"k\">온도 감소<\/b> → <b class=\"k\">TAS증가<\/b><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><b class=\"k\">제트<\/b><\/td>\n<td>L/D max + @<\/td>\n<td>결과적으로 <b class=\"k\">Cruise Climb<\/b> 하는 이유<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s11-05", "ch": 11, "num": "11.5", "title": "Stall Speed 변화 요인 (Load Factor / Weight / Power)", "pages": [63], "merged": false, "html": "<ul>\n<li><strong>Stall Speed<\/strong> : Critical AOA에서 Level Flight 할 수 있는 속도 → AOA, Density는 영향 X<\/li>\n<li>Level Flight 하기 위해 Lift가 덜 필요하면 속도 줄어야 함 → 더 적은 속도에서 Level 가능<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>요인<\/th>\n<th>변화<\/th>\n<th>Lift<\/th>\n<th>Stall SPD<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Arm 길다 Forward CG<\/td>\n<td>→ Tail down Force 많이 필요<\/td>\n<td>→ Lift 많이 필요<\/td>\n<td><strong>증가됨<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Arm 짧다 Aft CG<\/td>\n<td>→ Tail down Force 적게 필요<\/td>\n<td>→ Lift 적게 필요<\/td>\n<td>낮아짐<\/td>\n<\/tr>\n<tr>\n<td>Power/Thrust<\/td>\n<td>→ 증가시키면<\/td>\n<td>→ Lift 적게 필요<\/td>\n<td>낮아짐<\/td>\n<\/tr>\n<tr>\n<td>L/D configuration (저속에서 랜딩)<\/td>\n<td>→ Lift 이미 증가<\/td>\n<td>→ Lift 적게 필요<\/td>\n<td>낮아짐<\/td>\n<\/tr>\n<tr>\n<td>Load Factor<\/td>\n<td>→ weight 그대로<\/td>\n<td>→ Lift 2배 필요<\/td>\n<td><strong>증가됨<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Bank<\/td>\n<td>→ 증가시키면<\/td>\n<td>→ Lift 더 필요<\/td>\n<td><strong>증가됨<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Weight<\/td>\n<td>→ 증가시키면<\/td>\n<td>→ Lift 더 필요<\/td>\n<td><strong>증가됨<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Icing<\/td>\n<td>→ 축적되면<\/td>\n<td>→ Lift 더 필요<\/td>\n<td><strong>증가됨<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>※ <strong>Sweptback wing<\/strong> → Stall SPD 엄청 큼 → 그나마 접근속도 낮추기 위해 Flap 사용 / L/D distance 증가<\/li>\n<li>저속에서 저속을 더 느낌 / Lateral Stability 좋음 / Directional Stability 약간 좋아짐<\/li>\n<li>Wing Tip 부터 실속 / 고속 Shock wave(충격파) 도달 지연<\/li>\n<li>※ <strong>Spin Recovery — PARE<\/strong> : Power IDLE / Aileron Neutral / Rudder Opposite / Elevator Full Forward<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>장치<\/th>\n<th>CAOA<\/th>\n<th>원리<\/th>\n<th>CL Max<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Flap<\/td>\n<td>→ CAOA 감소<\/td>\n<td>→ 동일 AOA 박리 가속화<\/td>\n<td>모두 증가<\/td>\n<\/tr>\n<tr>\n<td>Slat<\/td>\n<td>→ CAOA 증가<\/td>\n<td>→ Leading Edge–Wing 공기 통과 → 박리지연<\/td>\n<td>모두 증가<\/td>\n<\/tr>\n<tr>\n<td>Icing<\/td>\n<td>→ CAOA 감소<\/td>\n<td>→ 동일 AOA 박리 가속화<\/td>\n<td>모두 감소<\/td>\n<\/tr>\n<tr>\n<td>Speed Brake<\/td>\n<td>→ CAOA 증가<\/td>\n<td>→ 위로 Deflect → 박리지연<\/td>\n<td>모두 감소<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s11-06", "ch": 11, "num": "11.6", "title": "CG (무게중심)와 Flap", "pages": [63], "merged": false, "html": "<ul>\n<li><strong>Fowler Flap<\/strong> → Wing Surface 늘어남 → Lift 면적 커짐 → CG는 그대로 → CP 후방이동 → Nose Down<\/li>\n<li>Double Slotted (Fowler) Flap : 최대양력계수 Flap / 일반 AOA 증가시 CP전방이동<\/li>\n<li>CG는 항상 CP보다 앞에 있어야 함 — Tail Down Force – Weight 상쇄<\/li>\n<li>CG = CP(CL) : 조금만 흔들려도 안정성에 좋지 않다.<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>CG 위치<\/th>\n<th>특성<\/th>\n<th>결과<\/th>\n<th>착륙<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Forward CG<\/strong> (많이 앞)<\/td>\n<td>Arm이 길어서 Lift가 더 많이 필요 / Tail Down Force 많이 필요<\/td>\n<td>→ Fuel Efficiency 감소 (연료소모 증가)<\/td>\n<td>L/D시, 고속접근<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>세로안정성 높음<\/td>\n<td>Stall speed 증가<\/td>\n<td>L/D시, Flare 어려움<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>이륙거리 늘어남<\/td>\n<td>순항속도 감소<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>T/O, L/D시 안정<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Aft CG<\/strong> (조금 앞)<\/td>\n<td>Tail Down Force 조금 필요<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>Rudder Arm 감소<\/td>\n<td>→ Rudder Effectiveness 감소 → Vmcg 상승<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>Cruise 속도 상승<\/td>\n<td>→ Lift 덜 필요 / 연료소모 감소<\/td>\n<td>L/D시, 저속접근<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>Stall Speed 낮아짐<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>세로안정성 감소<\/td>\n<td>→ Stall 회복 어려움<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>양력 공식<\/strong> : L = Cl × ( 1/2 × ρ × V² ) × S — ( ) 안은 Dynamic Pressure 공식\n- L = 양력 / ρ = 공기 밀도 / V = 속도 / S = 날개 면적 / Cl = 양력 계수<\/p>"}, {"id": "s11-07", "ch": 11, "num": "11.7", "title": "안정성 (Stability)", "pages": [83], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>구분<\/th>\n<th>의미<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Positive<\/strong><\/td>\n<td>다시 원래 상태로 되돌아가는 상태<\/td>\n<\/tr>\n<tr>\n<td><strong>Neutral<\/strong><\/td>\n<td>변화상태 그대로 남아있는 상태<\/td>\n<\/tr>\n<tr>\n<td><strong>Negative<\/strong><\/td>\n<td>점점 커지는 상태<\/td>\n<\/tr>\n<tr>\n<td><strong>Dynamic<\/strong><\/td>\n<td>시간변화에 따라 점점 커지거나 작아짐<\/td>\n<\/tr>\n<tr>\n<td><strong>Static<\/strong><\/td>\n<td>시간변화 반영하지 않음<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s11-08", "ch": 11, "num": "11.8", "title": "Dutch Roll", "pages": [65], "merged": false, "html": "<ul>\n<li><b class=\"k\">Lateral Stability<\/b>가 Directional Stability 보다 <b class=\"k\">더 강할 때<\/b> 발생함 — <b class=\"k\">방향안정성 부족<\/b><\/li>\n<li>Roll 한 방향으로 Side slip 발생 → 더 많은 Lift / 더 많은 Drag → 꼬리날개가 반대로 갈려고 함<\/li>\n<li>결과적으로 Positive Dynamic Stability (점점 Oscillation이 줄어듬)<\/li>\n<li><b class=\"k\">Dihedral wing<\/b>에서 더 <b class=\"k\">강<\/b>하게 발생 → <b class=\"k\">Yaw Damper<\/b> 장착하여 감소시킴 / Swept wing도 강함<\/li>\n<\/ul>"}, {"id": "s11-09", "ch": 11, "num": "11.9", "title": "Adverse Yaw", "pages": [65], "merged": false, "html": "<ul>\n<li>좌선회 시 우측 Aileron 내려감 → 우측 Wing 올라감 → 양력 증가 → 항력 또한 증가<\/li>\n<li><strong>※선회시 반대쪽으로 Yaw 발생<\/strong> → <b class=\"k\">더 많은 항력<\/b>으로 인해 Yawing<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>항목<\/th>\n<th>내용<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>원인<\/strong> 1.<\/td>\n<td><b class=\"k\">Camber 증가<\/b><\/td>\n<td>→ Downward Aileron Camber 증가<\/td>\n<\/tr>\n<tr>\n<td>2.<\/td>\n<td><b class=\"k\">Relative Wind 각도<\/b><\/td>\n<td>→ Drag 더 많이 발생<\/td>\n<\/tr>\n<tr>\n<td><strong>단점<\/strong> 1.<\/td>\n<td><b class=\"k\">Low Speed<\/b><\/td>\n<td>Adverse yaw 심함 → 유도항력이 크기 때문에<\/td>\n<\/tr>\n<tr>\n<td>2.<\/td>\n<td><b class=\"k\">High Aspect Ratio<\/b><\/td>\n<td>Adverse yaw 심함 → wingtip vortex 작지만, 유도항력은 커진다.<\/td>\n<\/tr>\n<tr>\n<td><strong><b class=\"k\">예방<\/b><\/strong><\/td>\n<td><mark><b class=\"k\">적절한 Rudder 사용<\/b><\/mark><\/td>\n<td><mark><b class=\"k\">Differential Aileron<\/b><\/mark><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s11-10", "ch": 11, "num": "11.10", "title": "Slip / Skid", "pages": [67], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>구분<\/th>\n<th>볼 위치<\/th>\n<th><\/th>\n<th>힘<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Slip<\/strong><\/td>\n<td><mark><b class=\"k\">슬립구 안<\/b><\/mark><\/td>\n<td>내활<\/td>\n<td>구심력 &gt; 원심력<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Skid<\/strong><\/td>\n<td><mark><b class=\"k\">스키원 밖<\/b><\/mark><\/td>\n<td>외활<\/td>\n<td><b class=\"k\">원심력<\/b> &gt; 구심력<\/td>\n<td><b class=\"k\">Centrifugal<\/b> Force 더 강함<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s11-11", "ch": 11, "num": "11.11", "title": "Aileron Reversal", "pages": [63], "merged": false, "html": "<ul>\n<li>Aileron : 조종간 우측 → 좌측 내리고 우측 올림 → 좌측 양력 높여서 → 우측으로 회전<\/li>\n<li>High Speed → Outboard Aileron → Twist : 뒷부분이 내려오고 앞부분이 들림 → AOA 증가<\/li>\n<li>→ 결과적으로 <b class=\"k\">역조작<\/b> — <b class=\"k\">Aileron Reversal<\/b> — <b class=\"k\">반대방향 Roll<\/b><\/li>\n<\/ul>"}, {"id": "s11-12", "ch": 11, "num": "11.12", "title": "Tab 종류", "pages": [65], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Tab<\/th>\n<th>움직임<\/th>\n<th>대상<\/th>\n<th>작동<\/th>\n<th>비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Trim Tab<\/strong><\/td>\n<td>반대 방향<\/td>\n<td>Remain Fixed<\/td>\n<td><b class=\"k\">수동<\/b>으로 움직임<\/td>\n<td>조종압력 감소 (Pressure Release) <b class=\"k\">조종력 “0”<\/b><\/td>\n<\/tr>\n<tr>\n<td><strong>Servo Tab<\/strong><\/td>\n<td>반대 방향<\/td>\n<td>대형 항공기<\/td>\n<td>조종사가 조종<\/td>\n<td>탭의 힘으로 간접 조종(<b class=\"k\">조종장치와 직접연결<\/b>)<\/td>\n<\/tr>\n<tr>\n<td><strong>Balanced Tab<\/strong><\/td>\n<td>반대 방향<\/td>\n<td><b class=\"k\">기계적 연결<\/b><\/td>\n<td>자동으로 움직임<\/td>\n<td>Primary와 함께 반대로 움직임<\/td>\n<\/tr>\n<tr>\n<td><strong><b class=\"k\">Anti-Servo Tab<\/b><\/strong><\/td>\n<td><b class=\"k\">같은 방향<\/b><\/td>\n<td>가벼운 항공기<\/td>\n<td>바람에 의한 Full Deflection 방지<\/td>\n<td>Anti : 방해함 / 힘들게 만듦<\/td>\n<\/tr>\n<tr>\n<td><strong>Control Tab<\/strong><\/td>\n<td><strong>Manual Reversion<\/strong><\/td>\n<td>→ Control Tab <strong>UNLOCK<\/strong><\/td>\n<td><\/td>\n<td>유압시스템 고장시<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s11-13", "ch": 11, "num": "11.13", "title": "Symmetrical Airfoil", "pages": [63], "merged": false, "html": "<ul>\n<li>AOA 증가시키면 → CP(Center of Pressure) 변화없음<\/li>\n<li>Airfoil 대칭 → Camber “0”<\/li>\n<li>Lift 증가 But CP지점은 변화가 없음<\/li>\n<\/ul>"}, {"id": "s11-14", "ch": 11, "num": "11.14", "title": "Wing 형태별 특성", "pages": [65], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>형태<\/th>\n<th>Stall 시작<\/th>\n<th>특징<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Tapered<\/strong><\/td>\n<td><b class=\"k\">Wing tip부터 Stall<\/b><\/td>\n<td>Tip쪽으로 Chord/두께 줄어듦<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Rectangular<\/strong><\/td>\n<td><b class=\"k\">Wing root 부터 Stall<\/b><\/td>\n<td>Lift 동일함 → Wake turbulence 증가 → 유도항력 증가<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td>고속비행시 → Critical Mach 도달 빠름 → Shock wave 빨리 발생 / Mach No. 낮음<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Sweepback<\/strong><br><b class=\"k\">Vortex 줄여줌 / Induced drag 적음<\/b><\/td>\n<td><b class=\"k\">Wing tip부터 Stall<\/b><\/td>\n<td>→ CP Inward / <b class=\"k\">Forward 이동<\/b> — CP 전방으로 이동<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td>Relative wind 분산 : Spanwise → <b class=\"k\">Chord<\/b>wise 쪽으로 분산<\/td>\n<td><b class=\"k\">Inward / Forward<\/b><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td>고속비행시 → Critical <b class=\"k\">Mach No. 증가<\/b> — Shockwave 발생 지연<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td>저속비행시 → Approach SPD / TO SPD 도 증가시킴 — Distance 길어짐<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><b class=\"k\">이착륙 거리 증가<\/b> / <b class=\"k\">Decrease Lift<\/b> / <b class=\"k\">실속속도 증가<\/b> / <b class=\"k\">안정성 감소<\/b><\/td>\n<td><mark>고양력장치 필수<\/mark><\/td>\n<\/tr>\n<tr>\n<td><strong>Elliptical<\/strong><\/td>\n<td>Stall 동시에 진행됨<\/td>\n<td>Lift 분포가 좋음 → Wing tip vortex 감소 → 유도항력 감소<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s11-15", "ch": 11, "num": "11.15", "title": "Mach Number / 후퇴익", "pages": [65], "merged": false, "html": "<ul>\n<li><mark><b class=\"k\">FL240 이상<\/b><\/mark> <mark><b class=\"k\">Turbojet A/C ONLY<\/b><\/mark> — Mach 0.01단위 / Mach 0.02 내로 유지<\/li>\n<li>음속은 루트 <b class=\"k\">온도<\/b>에 비례 — 고도상승 → 온도감소 ; 음속감소 → Critical Mach No. 도달확률 높아짐<\/li>\n<li><strong>후퇴각<\/strong> → 음속 도달 지연 → Critical Mach No. 높임 → 어떤 부분이라도 음속 도달하는 속도<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>내용<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>장점<\/td>\n<td><b class=\"k\">※ 고속에서 충격파 도달 지연 / 고속 경제성 높음<\/b><\/td>\n<td>→ Shock Wave / 불필요한 항력<\/td>\n<\/tr>\n<tr>\n<td>단점<\/td>\n<td><b class=\"k\">※ 저속에서 Approach Speed 높음 / Stall Speed 높음<\/b><\/td>\n<td>→ 날개 위 흐르는 공기 느리게 느끼기 때문<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>*양력 : 수직방향(X) / 비스듬히 적용 — *CL max 감소 / 이착륙거리 증가<\/li>\n<\/ul>"}, {"id": "s11-16", "ch": 11, "num": "11.16", "title": "레이놀즈 수 / 충격파 실속 / 임계마하수 / Wingtip Vortex", "pages": [67], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>레이놀즈 수<\/th>\n<th>↓층류<\/th>\n<th>→ (천이 / 임계 레이놀즈)<\/th>\n<th><b class=\"k\">난류↑<\/b><\/th>\n<th>난류로 갈수록 레이놀즈 수 커짐<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>유체흐름 속도에 비례<\/td>\n<td>박리발생<\/td>\n<td><\/td>\n<td>박리지연<\/td>\n<td>박리AOA ↑<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th><\/th>\n<th><\/th>\n<th><\/th>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>충격파 실속<\/strong><\/td>\n<td><mark>정압↑<\/mark><\/td>\n<td><mark>밀도↑<\/mark><\/td>\n<td><mark>온도↑<\/mark><\/td>\n<td><mark>속도↓<\/mark><\/td>\n<td>Mach No를 높임<\/td>\n<\/tr>\n<tr>\n<td>AOA 변화<\/td>\n<td>양력손실<\/td>\n<td>항력증가<\/td>\n<td>속도감소<\/td>\n<td>변화<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>대칭형 날개골<\/strong><\/td>\n<td>AOA <b class=\"k\">ZERO<\/b><\/td>\n<td>약간의 유해항력<\/td>\n<td>AOA 상승시 <b class=\"k\">CP그대로임<\/b> / 보통 전방이동(Flap X)<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>후퇴각<\/strong><\/td>\n<td><b class=\"k\">임계마하수↑<\/b><\/td>\n<td><b class=\"k\">방향안정성↑<\/b><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>익단 실속 발생<\/td>\n<td>CP 전방이동<\/td>\n<td>Pitch up 발생<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>임계마하수↑ 방법<\/strong> : 가로세로비↓ / 얇은 날개 / 후퇴각 / 경계층 제어(익단실속 방지)<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Wingtip Vortex 강함<\/th>\n<th><b class=\"k\">Heavy<\/b><\/th>\n<th>Low Speed<\/th>\n<th><b class=\"k\">Slow<\/b><\/th>\n<th><b class=\"k\">Clean<\/b><\/th>\n<th><b class=\"k\">(높은 받음각)<\/b><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td>무게 비례<\/td>\n<td>속도 반비례<\/td>\n<td><\/td>\n<td>이착륙 최대<\/td>\n<td>가로세로비 반비례<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s11-17", "ch": 11, "num": "11.17", "title": "Shock Wave / Vortex Generator", "pages": [67], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>속도<\/th>\n<th>흐름<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Low Speed<\/td>\n<td>Laminar flow → Turbulent flow → Separation<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>High Speed<\/td>\n<td>공기가 쌓여서 정체 → Shock wave<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Vortex Generator<\/strong><\/td>\n<td>위 아래 공기를 섞어서<\/td>\n<td>Delay Separation<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s11-18", "ch": 11, "num": "11.18", "title": "Maximum Operating V(M)-Speed / Mach Tuck", "pages": [43], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>구분<\/th>\n<th>제한 이유<\/th>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong><b class=\"k\">VMO<\/b><\/strong><\/td>\n<td><b class=\"k\">Structure Damage<\/b><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong><b class=\"k\">MMO<\/b><\/strong><\/td>\n<td><b class=\"k\">Shock Wave<\/b> — FL240 이상 Mach Number<\/td>\n<td>Critical Mach No. / 고고도 / 저온<\/td>\n<td>→ 고고도 쉽게 MMO 돌파가능 / → 같은 TAS → Mach No 높음<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>Mach Tuck<\/strong> : Shockwave → 경계층 박리 → Tail down Force 사라짐 → Pitch Down 현상 — Mach No증가 → CP 뒤로 이동<\/li>\n<li><b class=\"k\">*T-tail : 장점 Mach tuck(X) / 단점 Stall warning(X)<\/b><\/li>\n<\/ul>"}, {"id": "s11-19", "ch": 11, "num": "11.19", "title": "Service Ceiling / Absolute Ceiling / Max Operating Altitude", "pages": [43], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>구분<\/th>\n<th>상승률<\/th>\n<th>조건<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Service Ceiling<\/strong><\/td>\n<td><strong>100FPM<\/strong> 상승률<\/td>\n<td>1) Clean Configuration / 2) Best Rate of Climb / 3) All Engine Operation / 4) Maximum Continuous Power<\/td>\n<\/tr>\n<tr>\n<td><strong>OEI Service Ceiling<\/strong><\/td>\n<td>50FPM<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Absolute Ceiling<\/strong><\/td>\n<td><strong>0 FPM<\/strong><\/td>\n<td>1) Full Power 유지할 때 Level Flight (0FPM) 되는 고도<br>2) <b class=\"k\">Max<\/b> Thrust <b class=\"k\">Available<\/b> = <b class=\"k\">Minimum<\/b> Thrust <b class=\"k\">Required<\/b> 고도<br>3) <b class=\"k\">Vx = Vy<\/b> 되는 고도<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Max Operating Altitude<\/strong> — FPM + 항공기 구조적 강도 + Power plant 등 여러 요소 고려한 현실적 최대 고도 / 가장 <b class=\"k\">적은<\/b> 것<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>기준<\/th>\n<th>내용<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1)<\/td>\n<td>MCA <b class=\"k\">M<\/b>ax <b class=\"k\">C<\/b>ertificate <b class=\"k\">A<\/b>ltitude<\/td>\n<td>AFM(제작사)기준 최대 고도<\/td>\n<td>동체 구조적 강도 고려<\/td>\n<\/tr>\n<tr>\n<td>2)<\/td>\n<td>TLA <b class=\"k\">T<\/b>hrust <b class=\"k\">L<\/b>imited <b class=\"k\">A<\/b>ltitude<\/td>\n<td><b class=\"k\">특정 상승률<\/b>을 제공할 수 있는 최대 고도(Cruise Climb)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>3)<\/td>\n<td><b class=\"k\">B<\/b>uffet <b class=\"k\">L<\/b>imited <b class=\"k\">A<\/b>ltitude / <b class=\"k\">M<\/b>aneuver <b class=\"k\">L<\/b>imited <b class=\"k\">A<\/b>ltitude<\/td>\n<td>선회, 기동, 터뷸런스 중 <b class=\"k\">0.3G Buffet Margin<\/b> 있는 최대고도<\/td>\n<td><b class=\"k\">Coffin Corner<\/b> (=Aerodynamic Ceiling)<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td>*Lowest Buffet &amp; Highest Buffet(Shockwave)의 딜레마 구간<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><strong>Maneuvering Ceiling<\/strong><\/td>\n<td><b class=\"k\">40도 Bank(1.3G)<\/b> 또는 <b class=\"k\">0.3G Buffet Margin<\/b> 있는 최대고도<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"figs\"><figure><img src=\"img/i-043-019.webp\" alt=\"Coffin Corner\" loading=\"lazy\"><figcaption>Coffin Corner<\/figcaption><\/figure><\/div>\n<ul>\n<li>(관) 고도상승 → <b class=\"k\">온도하강<\/b> → <strong>음속감소<\/strong> → Mach Number <b class=\"k\">증가<\/b>함 (TAS는 증가하는데 음속 낮아지니깐)<\/li>\n<li><mark><strong>Coffin Corner<\/strong><\/mark> : <b class=\"k\">True Stall Speed / MMO의 TAS가 만나는 지점<\/b> — 감속-스톨 / 가속-Shockwave / Bank-Load증가<\/li>\n<li>감속 → <b class=\"k\">Stall<\/b> / 가속 → <b class=\"k\">Shockwave<\/b> / Bank → <b class=\"k\">Load Factor증가<\/b> → <b class=\"k\">Stall<\/b><\/li>\n<li>TAS 1,000ft당 2%증가 / Density 영향 존재 → True stall speed 증가 / Mmo 감소<\/li>\n<\/ul>\n<p><strong>Optimum Altitude<\/strong> (FL350-420) — 주어진 Weight와 속도에서 가장 높은 연료 효율을 갖는 고도\n- 고도 상승 → 연료 효율 ↑ → 비행할수록 무게 감소 → OPT ALT 상승(증가)\n- → <strong>STEP CLIMB 사용<\/strong> → OPT ALT 근처 비행을 위해 Cruise ALT 변경 상승 — <b class=\"k\">Cruise Climb<\/b>\n- 바람성분 고려 (X) → 실제 연료소모는 달라짐<\/p>"}, {"id": "s11-20", "ch": 11, "num": "11.20", "title": "Cost Index / MRC / LRC / Econ Speed", "pages": [65], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>제작사<\/th>\n<th>범위<\/th>\n<th><\/th>\n<th>MRC ↔ MCT<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Boeing<\/td>\n<td>0 ~ 500<\/td>\n<td>보통 <b class=\"k\">“30”<\/b>정도로 입력함<\/td>\n<td>0 ↔ 999<\/td>\n<\/tr>\n<tr>\n<td>Airbus<\/td>\n<td>0 ~ 999<\/td>\n<td><\/td>\n<td>Fuel Efficiency ↔ Hourly expense<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>속도<\/th>\n<th>의미<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>MRC<\/strong><\/td>\n<td>가장 멀리 가는 속도 : 최소 연료<\/td>\n<td>Max range cruise speed<\/td>\n<\/tr>\n<tr>\n<td><strong>LRC<\/strong><\/td>\n<td>MRC보다 <b class=\"k\">조금<\/b> 더 <b class=\"k\">빠른<\/b> 속도 : MRC의 <b class=\"k\">99% 거리<\/b><\/td>\n<td>Long range cruise speed <b class=\"k\">3-5% 시간/속도<\/b><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>숫자가 낮으면 <b class=\"k\">Fuel Efficiency를 우선시<\/b> / 0에 가까울수록 속도가 낮다 / 숫자가 높다 Full Accel<\/li>\n<li><strong>Econ speed<\/strong> : <b class=\"k\">Cost index<\/b>에 기반한 속도 / cost index가 “0”이라고 econ speed는 아니다.<\/li>\n<li>Minimum Time + Minimum Fuel cost / MRC와 LRC 사이로 설정<\/li>\n<li>적용 : <b class=\"k\">Climb<\/b> / <b class=\"k\">Cruise<\/b> / <b class=\"k\">Descent (X)<\/b><\/li>\n<li><strong>Cost Index<\/strong> : 시간당 연료비용 — <b class=\"k\">Hourly expense / Fuel cost<\/b> (<mark>TIME / FUEL<\/mark>)<\/li>\n<li>L/D max + <b class=\"k\">@<\/b> : Jet 경우, 체공시간은 Max지만, 가장 멀리 가지는 못함<\/li>\n<\/ul>"}, {"id": "s11-21", "ch": 11, "num": "11.21", "title": "Magnetic Dip (자기 나침반 오차)", "pages": [63], "merged": false, "html": "<ul>\n<li><strong>Magnetic Dip<\/strong> : 자기장의 수평면과 이루는 각 — 북극은 수직 아래로 향함(거의 90도)<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>오차<\/th>\n<th>의미<\/th>\n<th>발생<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>ANDS<\/strong><\/td>\n<td>Acceleration/Deceleration Error (Accelerate North, Decelerate South)<\/td>\n<td>동-서 비행중 발생<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>UNOS<\/strong><\/td>\n<td>Undershoot North / Overshoot South<\/td>\n<td>북쪽에서 턴할 때 Lag<\/td>\n<td>먼저 롤아웃<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td>남쪽에서 턴할 때 Lead<\/td>\n<td>지나서 롤아웃<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s11-22", "ch": 11, "num": "11.22", "title": "성능계기", "pages": [65], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>계기<\/th>\n<th>관련<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><b class=\"k\">Airspeed<\/b> Indicator<\/td>\n<td>V1, V2, V Speed<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><b class=\"k\">Altimeter<\/b><\/td>\n<td>Maximum Altitude<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><b class=\"k\">Heading<\/b> Indicator<\/td>\n<td>VMC 개념<\/td>\n<td>Maintain H/D<\/td>\n<\/tr>\n<tr>\n<td><b class=\"k\">VSI<\/b><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><b class=\"k\">Turn/Slip<\/b> Indicator<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>~~Attitude Indicator~~<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s12-01", "ch": 12, "num": "12.1", "title": "Wind Shear (LLWS / LLWAS / PWS)", "pages": [41], "merged": false, "html": "<ul>\n<li><strong>Wind Shear<\/strong> : 급격한 <b class=\"k\">풍속/풍향<\/b>의 변화가 <b class=\"k\">좁은 공간<\/b>에서 발생 — <strong>지표면부터 <b class=\"k\">500m(1,600ft)<\/b> 감지<\/strong><\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>시스템<\/th>\n<th>내용<\/th>\n<th>기준<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>LLWSA<\/strong><\/td>\n<td><b class=\"k\">L<\/b>ow <b class=\"k\">L<\/b>evel <b class=\"k\">W<\/b>ind <b class=\"k\">S<\/b>hear <b class=\"k\">A<\/b>lert system<\/td>\n<td>15kt 초과시<\/td>\n<\/tr>\n<tr>\n<td><strong>RS<\/strong> Relocation Sustainment → <strong>NE<\/strong><\/td>\n<td><b class=\"k\">N<\/b>etwork <b class=\"k\">E<\/b>xpansion 개선된 시스템 / 1. <b class=\"k\">풍속계<\/b>의 갯수 늘어남<\/td>\n<td><b class=\"k\">Microburst 탐지<\/b> / <b class=\"k\">30kt 초과시<\/b><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>2. Tower <b class=\"k\">Doppler<\/b> Weather Radar — 항공기에서 사용하는 Doppler가 공항 설치 → 효과적으로 Microburst 탐지<\/td>\n<td><mark>1. WET<\/mark> <mark>2. BIG<\/mark><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>LLWS 발생 원인<\/strong>\n1. <mark><b class=\"k\">전선<\/b>이 지나갈 때(성질변함)<\/mark>\n2. <mark>Thunderstorm<\/mark>\n3. <mark>Temperature <b class=\"k\">Inversion<\/b><\/mark>\n4. <mark>Strong <b class=\"k\">Upper<\/b>-level wind<\/mark> — <mark><b class=\"k\">25kt<\/b> 초과<\/mark> → <strong>역전층 윈드시어 → 기온역전<\/strong>\n5. <mark><b class=\"k\">Jet Stream<\/b><\/mark> — <mark>고고도<\/mark><\/p>\n<ul>\n<li>Doppler Radar 탐지 강수 : 1. Wet hail / 2. Rain / 3. Dry hail / 4. Snow<\/li>\n<\/ul>\n<p><strong>Warning 우선순위 (1순위-2순위-3순위)<\/strong> : <mark><b class=\"k\">GPWS<\/b><\/mark> &gt; <mark><b class=\"k\">Windshear<\/b><\/mark> &gt; <mark><b class=\"k\">Stall<\/b><\/mark> Warning → TCAS <b class=\"k\">RA<\/b>조차 Over한다. / Have priority over in RA<\/p>"}, {"id": "s12-02", "ch": 12, "num": "12.2", "title": "PWS (Predictive Windshear) / Actual Windshear Warning", "pages": [41], "merged": false, "html": "<p><strong>PWS — <b class=\"k\">전방돌풍경고장치<\/b><\/strong> (*737 MTOW 79,000kg)\n- 장착 대상 : <mark>MTOW 5,700kg 초과<\/mark> <mark><b class=\"k\">또는<\/b><\/mark> <mark>승객 9석 초과<\/mark> · <mark>터빈발동기<\/mark> · <mark>항공운송사업<\/mark><\/p>\n<p><strong>Predictive Windshear Alert<\/strong> — 전방에 있는 <b class=\"k\">Windshear Wx Radar<\/b>감지 → 알림 (<b class=\"k\">Red/Black<\/b>)<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>단계<\/th>\n<th>음성<\/th>\n<th>범위<\/th>\n<th>상황<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><mark>Caution<\/mark><\/td>\n<td>“Monitor Radar Display”<\/td>\n<td>주변에 Windshear<\/td>\n<td>공중/지상<\/td>\n<\/tr>\n<tr>\n<td><mark><b class=\"k\">Warning<\/b><\/mark><\/td>\n<td>“Windshear Ahead”<\/td>\n<td>경로상 직진방향 <b class=\"k\">3NM<\/b><\/td>\n<td>지상 Takeoff<\/td>\n<\/tr>\n<tr>\n<td><mark><b class=\"k\">Warning<\/b><\/mark><\/td>\n<td>“Go-Around Windshear Ahead”<\/td>\n<td>경로상 직진방향 <b class=\"k\">1.5NM<\/b><\/td>\n<td>공중 Approach<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>Actual Windshear Warning<\/strong> : “Windshear, Windshear, Windshear”<\/li>\n<li><strong>2312<\/strong> : <b class=\"k\">2,300ft<\/b>에서부터 감지 시작 <b class=\"k\">1,200ft<\/b> 아래에서만 알려줌<\/li>\n<\/ul>\n<div class=\"figs\"><figure><img src=\"img/i-041-017.webp\" alt=\"Predictive Windshear Alert Area (Wx Radar 표시)\" loading=\"lazy\"><figcaption>Predictive Windshear Alert Area (Wx Radar 표시)<\/figcaption><\/figure>\n<figure><img src=\"img/i-041-018.webp\" alt=\"ND 상 Windshear symbol\" loading=\"lazy\"><figcaption>ND 상 Windshear symbol<\/figcaption><\/figure><\/div>\n<p><strong>SEVERE Windshear 판단 (Gleim ATP 850p)<\/strong>\n1. <mark>Windshear에 조우했다는 <b class=\"k\">Indication<\/b><\/mark>\n2. <mark><b class=\"k\">Unacceptable<\/b> Flight <b class=\"k\">path<\/b> deviation / WS warning<\/mark> — Below 1,000ft AGL / 별다른 조작 없이<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>기준<\/th>\n<th>Deviation<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><mark><strong>1<\/strong><\/mark><\/td>\n<td>Glideslope <b class=\"k\">1닷<\/b> 초과 Deviation<\/td>\n<\/tr>\n<tr>\n<td><mark><strong>5<\/strong><\/mark><\/td>\n<td>Pitch <b class=\"k\">5°<\/b> 초과 Deviation<\/td>\n<\/tr>\n<tr>\n<td><mark><strong>10<\/strong><\/mark><\/td>\n<td>Heading <b class=\"k\">10°<\/b> 초과 Deviation<\/td>\n<\/tr>\n<tr>\n<td><mark><strong>15<\/strong><\/mark><\/td>\n<td>IAS <b class=\"k\">15Kt<\/b> 초과 Deviation<\/td>\n<\/tr>\n<tr>\n<td><mark><strong>500<\/strong><\/mark><\/td>\n<td><b class=\"k\">500fpm<\/b> 초과 Deviation<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ol start=\"3\">\n<li><b class=\"k\">비정상적인<\/b> thrust lever position for <b class=\"k\">long period<\/b> — ND상 windshear symbol<\/li>\n<\/ol>\n<ul>\n<li>→ <b class=\"k\">Windshear Escape Maneuver<\/b> 해야함 / ※ PWS Warning 일 경우, 실제 WS아니면 Go-Around 해도 됨<\/li>\n<li>※ 1,000ft 아래에서 1.3dot을 초과해서 deviate → “Glideslope”<\/li>\n<\/ul>"}, {"id": "s12-03", "ch": 12, "num": "12.3", "title": "GPWS / EGPWS 경고 — Caution TO / STD / Too low GFT / BAG", "pages": [41], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>PWS<\/th>\n<th><b class=\"k\">Predictive<\/b> Windshear Alert<\/th>\n<th>전방에 있는 <b class=\"k\">Windshear Wx Radar<\/b> 감지 → 알림<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td>Windshear Alert / WS x3<\/td>\n<td><b class=\"k\">실제 Windshear 조우<\/b>했을 때 → 알림<\/td>\n<td><b class=\"k\">GPWS<\/b><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>GPWS<\/strong> — <b class=\"k\">RA(Radio Altitude) Base Alerts<\/b> 로 발동되는 오리지널 GPWS <mark>Caution <b class=\"k\">TO<\/b> / <b class=\"k\">STD<\/b> Too low <b class=\"k\">GFT<\/b> / <b class=\"k\">BAG<\/b><\/mark><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>구분<\/th>\n<th><\/th>\n<th>경고<\/th>\n<th>조건<\/th>\n<th>항공안전법 의무성능<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Caution<\/td>\n<td><strong>T<\/strong><\/td>\n<td>Terrain<\/td>\n<td>40~60초 이내 impact 예상<\/td>\n<td>항공안전법 의무성능<\/td>\n<\/tr>\n<tr>\n<td>Caution<\/td>\n<td><strong>O<\/strong><\/td>\n<td>Obstacle<\/td>\n<td>40~60초 이내 impact 예상<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><mark>필수경고<\/mark><\/td>\n<td><strong>S<\/strong><\/td>\n<td><b class=\"k\">Sink Rate<\/b><\/td>\n<td>과도한 강하율<\/td>\n<td>가. 과도한 강하율<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><strong>T<\/strong><\/td>\n<td><b class=\"k\">Terrain<\/b><\/td>\n<td>과도한 접근율<\/td>\n<td>나. 지형지물에 대한 과도한 접근율<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><strong>D<\/strong><\/td>\n<td><b class=\"k\">Don’t Sink<\/b><\/td>\n<td>이륙/복행 후 과도한 고도손실<\/td>\n<td>다. 이륙 복행 후 과도한 고도손실<\/td>\n<\/tr>\n<tr>\n<td>Too low<\/td>\n<td><strong>G<\/strong><\/td>\n<td><b class=\"k\">Gears<\/b><\/td>\n<td><b class=\"k\">속도 낮고 / 고도 낮음<\/b><\/td>\n<td>라-1) 착륙형태 X 지형지물 안전거리 유지 X<\/td>\n<\/tr>\n<tr>\n<td>Too low<\/td>\n<td><strong>F<\/strong><\/td>\n<td><b class=\"k\">Flaps<\/b><\/td>\n<td><b class=\"k\">속도 낮고 / 고도 낮음<\/b><\/td>\n<td>라-2)<\/td>\n<\/tr>\n<tr>\n<td>Too low<\/td>\n<td><strong>T<\/strong><\/td>\n<td>Terrain<\/td>\n<td><b class=\"k\">EGPWS<\/b> — <b class=\"k\">공항이 아닌데 고도 낮음<\/b><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><strong>B<\/strong><\/td>\n<td>Bank Angle<\/td>\n<td>130ft 이상 - 35° 초과시<\/td>\n<td>지면 가까우면 30ft 미만 -10° 초과시<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><strong>A<\/strong><\/td>\n<td>Airspeed low<\/td>\n<td>Airspeed Amber bar 칠 때<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><strong>G<\/strong><\/td>\n<td><b class=\"k\">Glideslope<\/b><\/td>\n<td>1,000ft 아래 1.3dot 초과<\/td>\n<td>라-3) 계기활공로 아래로의 과도한 강하<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><strong>A<\/strong><\/td>\n<td>AOA<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><b class=\"k\">Warning<\/b><\/td>\n<td><strong>P<\/strong><\/td>\n<td>Pull-up<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>EGPWS<\/strong> — <mark><b class=\"k\">GPS Position<\/b> + Terrain <b class=\"k\">Data Base<\/b> (computer) 사용해서 <b class=\"k\">전방 장애물 경고<\/b><\/mark><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>20~30초<\/th>\n<th>40~60초<\/th>\n<th>내에 <b class=\"k\">Impact<\/b>가 예상될 때<\/th>\n<th>공항 근처 → Details / 그 외 → Less details<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><b class=\"k\">Warning<\/b><\/td>\n<td><b class=\"k\">Caution<\/b><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong><b class=\"k\">RA +<\/b> <mark>Look Ahead Terrain Alerts<\/mark><\/strong> : 전방을 <b class=\"k\">예측<\/b>해서 <b class=\"k\">경고<\/b>제공<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>단계<\/th>\n<th>경고<\/th>\n<th>대상<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Caution<\/td>\n<td>Caution Terrain<\/td>\n<td>Terrain — 지형지물<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Caution<\/td>\n<td>Caution Obstacle<\/td>\n<td>Obstacle — Manmade<\/td>\n<td>100ft이상<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>Too low Terrain<\/td>\n<td>Database 상 공항이 아닌데 고도 낮음<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><b class=\"k\">Warning<\/b><\/td>\n<td>Terrain-Terrain <b class=\"k\">Pull-up<\/b><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><b class=\"k\">Warning<\/b><\/td>\n<td>Obstacle-Obstacle <b class=\"k\">Pull-up<\/b><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>IMC, Night 일 경우 → <b class=\"k\">Go-Around<\/b> / 아니라면, Correcting 후 내릴 수 있음<\/li>\n<\/ul>\n<p><strong><mark>Escape Maneuver<\/mark><\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>조작<\/th>\n<th>비고<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1.<\/td>\n<td><b class=\"k\">Wing Level<\/b><\/td>\n<td>Terrain Clearance 필요시 최소 Bank<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>2.<\/td>\n<td><b class=\"k\">Pitch Up<\/b><\/td>\n<td>피치업은 Excessively<\/td>\n<td>15° 또는 FD에서 더 크게 요구하면 따름<\/td>\n<\/tr>\n<tr>\n<td>3.<\/td>\n<td><b class=\"k\">TOGA<\/b><\/td>\n<td>외장변경은 불가<\/td>\n<td>오히려 상승률을 안 좋게 만들 수 있음<\/td>\n<\/tr>\n<tr>\n<td>4.<\/td>\n<td><b class=\"k\">AP/AT 해제<\/b><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<blockquote>\n<p><strong><b class=\"k\">“TO/GA – Max thrust – Disconnect A/P A/T – 15° pitch (FD or PLI) – Wings level – No config change”<\/b><\/strong><\/p>\n<\/blockquote>"}, {"id": "s12-04", "ch": 12, "num": "12.4", "title": "TCAS / ACAS", "pages": [43], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>약어<\/th>\n<th>명칭<\/th>\n<th>기준<\/th>\n<th>감시범위<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>ACAS<\/strong><\/td>\n<td><b class=\"k\">A<\/b>irborne <b class=\"k\">C<\/b>ollision <b class=\"k\">A<\/b>voidance <b class=\"k\">S<\/b>ystem<\/td>\n<td><b class=\"k\">ICAO<\/b><\/td>\n<td>좌우<\/td>\n<td>30NM<\/td>\n<\/tr>\n<tr>\n<td><strong>TCAS<\/strong><\/td>\n<td><b class=\"k\">T<\/b>raffic <b class=\"k\">C<\/b>ollision <b class=\"k\">A<\/b>voidance <b class=\"k\">S<\/b>ystem<\/td>\n<td>FAA<\/td>\n<td>앞뒤<\/td>\n<td>100NM<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>작동원리 : <mark><b class=\"k\">Transponder<\/b><\/mark><\/li>\n<li><b class=\"k\">TCAS 2 = TA + RA<\/b> — TA : “Traffic” / RA : “Climb/Descent”<\/li>\n<li>OEI → RA off (<b class=\"k\">TA ONLY<\/b>)<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>구분<\/th>\n<th>시간<\/th>\n<th>거리<\/th>\n<th>고도<\/th>\n<th>RA 종류<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>TCAS2 v7.1 <strong>TA<\/strong><\/td>\n<td><b class=\"k\">48초<\/b><\/td>\n<td><b class=\"k\">1.3NM이내<\/b><\/td>\n<td><b class=\"k\">±850ft<\/b><\/td>\n<td>Resolution Advisory → <b class=\"k\">Smoothly<\/b> 조작해야함 (5초 이내)<\/td>\n<\/tr>\n<tr>\n<td>TCAS <strong>RA<\/strong><\/td>\n<td><b class=\"k\">35초<\/b><\/td>\n<td><b class=\"k\">1.1NM이내<\/b><\/td>\n<td><b class=\"k\">±700ft<\/b><\/td>\n<td>1. <b class=\"k\">Preventive RA<\/b> — 현재 Flight path <b class=\"k\">유지<\/b>하라<\/td>\n<\/tr>\n<tr>\n<td>FL200 ~ FL410 (저고도 40초/25초)<\/td>\n<td><\/td>\n<td><\/td>\n<td><b class=\"k\">±600ft<\/b><\/td>\n<td>2. Corrective RA <span class=\"fix\" title=\"정리하면서 확인·수정한 부분\">✎ 원본 “Collective RA”<\/span> — 현재 Flight path 벗어나라<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>CPA<\/strong> : <b class=\"k\">C<\/b>losest <b class=\"k\">P<\/b>oint <b class=\"k\">A<\/b>pproach 도달 — 여기까지 예상되는 시간<\/li>\n<\/ul>"}, {"id": "s12-05", "ch": 12, "num": "12.5", "title": "MEL (Minimum Equipment List) / CDL", "pages": [30], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>구분<\/th>\n<th>내용<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong><b class=\"k\">MEL<\/b><\/strong><\/td>\n<td>항공기 Failure / Malfunction 결함 발생시 <b class=\"k\">Dispatch 여부<\/b>를 판단하기 위해 확인해야 할 문서<br>→ 정시성을 우선하기 위해 <b class=\"k\">정비를 Defer(이월) 할 수 있음<\/b><\/td>\n<td><mark><b class=\"k\">T/O thrust Advance 전까지<\/b><\/mark><\/td>\n<\/tr>\n<tr>\n<td><strong><b class=\"k\">CDL<\/b><\/strong><\/td>\n<td><b class=\"k\">C<\/b>onfiguration <b class=\"k\">D<\/b>eviation <b class=\"k\">L<\/b>ist — 같은 개념이지만 <b class=\"k\">외형<\/b>에 관한 것<\/td>\n<td>외형변경목록<\/td>\n<\/tr>\n<tr>\n<td><strong>MMEL<\/strong><\/td>\n<td>제작사 기준<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Defer Repair Interval Category<\/strong> — 다음 날 넘어가는 <b class=\"k\">UTC 자정<\/b>기준 (*제주항공 LMT 자정기준)<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Cat<\/th>\n<th>기간<\/th>\n<th>연장<\/th>\n<th>예<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><mark><strong>A<\/strong><\/mark><\/td>\n<td><b class=\"k\">특정<\/b> 명시된 <b class=\"k\">기간<\/b> 내에 수리<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><mark><strong>B<\/strong><\/mark><\/td>\n<td><b class=\"k\">3일<\/b> 내에 수리<\/td>\n<td>3일 <b class=\"k\">연장<\/b>가능<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><mark><strong>C<\/strong><\/mark><\/td>\n<td><b class=\"k\">10일<\/b> 내에 수리<\/td>\n<td>10일 <b class=\"k\">연장<\/b>가능<\/td>\n<td>Ex. APU<\/td>\n<\/tr>\n<tr>\n<td><mark><strong>D<\/strong><\/mark><\/td>\n<td><b class=\"k\">120일<\/b> 내에 수리<\/td>\n<td><\/td>\n<td>Ex. Logo light<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Crew Defer(미루다) Procedure<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>시점<\/th>\n<th>상황<\/th>\n<th>판단<\/th>\n<th>조치<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><mark>Door Close <strong>전<\/strong><\/mark><\/td>\n<td>Mechanic on Duty<\/td>\n<td><\/td>\n<td><b class=\"k\">T/O thrust<\/b> Advance 전까지<\/td>\n<\/tr>\n<tr>\n<td><mark>Door Close <strong>후<\/strong><\/mark><\/td>\n<td>MEL (X)<\/td>\n<td>Airworthiness, Flight safety 라면<\/td>\n<td>Return to Gate<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td>관련 없다면<\/td>\n<td>Dispatch / Continue Flight<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>MEL (O)<\/td>\n<td><b class=\"k\">No Dispatch<\/b> — <b class=\"k\">필수 Fail<\/b> →<\/td>\n<td>Return to Gate<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><mark><strong>O<\/strong><\/mark> <b class=\"k\">Operator<\/b><\/td>\n<td>Crew Defer 판단 후 Dispatch / Continue Flight<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><mark><strong>M<\/strong><\/mark> <b class=\"k\">Maintenance<\/b><\/td>\n<td>Return to Gate<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s12-06", "ch": 12, "num": "12.6", "title": "Fail Operational / Fail Passive (787POM 245p)", "pages": [30], "merged": false, "html": "<p><strong>AH — Alert Height<\/strong> (보통 100~200ft)\n- <mark><b class=\"k\">Fail Operation<\/b><\/mark> 항공기가 <b class=\"k\">Fail Passive로 다운그레이드<\/b> 되었을 때, 조종사에게 알려주는 <b class=\"k\">최저고도<\/b>\n- CAT3의 경우 No DH이지만, AH는 존재함\n- → LAND2(Fail Passive)경우, Go-Around\n- → 바뀐 새로운 minimum을 판단하고 적용할 수 있으면 Continue Approach 가능<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>구분<\/th>\n<th>내용<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Fail Operation<\/strong><\/td>\n<td><b class=\"k\">Single Fault<\/b> — <b class=\"k\">2 Auto Pilot<\/b> / <b class=\"k\">3 inertial Sources<\/b> / <b class=\"k\">Associated sensors<\/b><br>이 중 하나의 Fault가 생겨도 <b class=\"k\">Fail Passive로 다운그레이드<\/b> 되고 여전히 <b class=\"k\">Auto Land &amp; Auto Roll-out<\/b>이 가능한 옵션의 항공기 — CAT1 / CAT2 모두 가능<\/td>\n<\/tr>\n<tr>\n<td><strong>Fail Passive<\/strong> (강등된 fail passive)<\/td>\n<td>Fail 되었을 때 Passive(수동적) 해진다 — <b class=\"k\">Single Fault<\/b> → <b class=\"k\">자세유지정도 해줄 수 있다.<\/b><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Fail Operation ONLY<\/th>\n<th>Fault<\/th>\n<th>기능<\/th>\n<th>비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td>Fail Passive는 “Command”라고 나옴<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>LAND3 / CAT3 dual<\/td>\n<td>No fail<\/td>\n<td>Auto Land &amp; Auto Roll-out 가능<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>LAND2 / CAT3 single<\/td>\n<td>Single Fault<\/td>\n<td>Auto Land &amp; Auto Roll-out 가능<\/td>\n<td>But minimum 변동<\/td>\n<\/tr>\n<tr>\n<td>No Auto Land<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>→ <b class=\"k\">Decision 1,000ft HAT<\/b> 까지는 해야함 → higher minimum 적용 및 브리핑, 보고기상치 minimum이상 확인<\/li>\n<li>→ 하나 더 fail되면 자세유지정도만 가능해진다.<\/li>\n<li>→ AH에서 fail 확인되면 Go-Around<\/li>\n<\/ul>"}, {"id": "s12-07", "ch": 12, "num": "12.7", "title": "가스터빈엔진", "pages": [67], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>종류<\/th>\n<th>사용<\/th>\n<th>원리<\/th>\n<th>장점<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>터보제트<\/strong><\/td>\n<td>전투기<\/td>\n<td>흡입 → 압축기 → 연소실 → 터빈 → 배기노즐<\/td>\n<td>구조 단순<\/td>\n<td>높은 속도 효율/저속 별로<\/td>\n<\/tr>\n<tr>\n<td><strong>터보팬<\/strong><\/td>\n<td>B737 / A320<\/td>\n<td>고바이패스비 : 팬 공기 비율 높음<\/td>\n<td>소음 감소<\/td>\n<td>연료 효율 우수<\/td>\n<\/tr>\n<tr>\n<td><strong>터보프롭<\/strong><\/td>\n<td>ATR72 / C130<\/td>\n<td>가스터빈이 프로펠러를 구동<\/td>\n<td>저속/저고도 효율 좋음<\/td>\n<td>단거리/수송기<\/td>\n<\/tr>\n<tr>\n<td><strong>터보샤프트<\/strong><\/td>\n<td>헬리콥터<\/td>\n<td>터빈이 샤프트를 통해 회전력 전달<\/td>\n<td>헬리콥터/해상추진/발전기<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s12-08", "ch": 12, "num": "12.8", "title": "Compressor Stall", "pages": [67], "merged": false, "html": "<ul>\n<li>Compressor 공기 흐름이 갑자기 무너져 <b class=\"k\">역류<\/b>하거나 비정상 순환이 발생 → 압력 불균형<\/li>\n<\/ul>\n<ol>\n<li><b class=\"k\">Reduce<\/b> the throttle — IDLE<\/li>\n<li>Engine Monitor<\/li>\n<li><b class=\"k\">Slowly Advance<\/b> throttle<\/li>\n<li><b class=\"k\">Decrease<\/b> AOA<\/li>\n<\/ol>"}, {"id": "s12-09", "ch": 12, "num": "12.9", "title": "Engine Failure / Spoiler", "pages": [67], "merged": false, "html": "<ul>\n<li><strong>Engine Failure<\/strong> : 죽어있는 Engine 쪽으로 yawing → 살아있는 Engine 쪽 Rudder<\/li>\n<li><strong>Spoiler (스포일러)<\/strong> : 속도 증가 없이 Descent → 강하율 증가<\/li>\n<\/ul>"}, {"id": "s12-10", "ch": 12, "num": "12.10", "title": "Anti-ice System", "pages": [67], "merged": false, "html": "<div class=\"figs\"><figure><img src=\"img/i-067-037.webp\" alt=\"터보팬 엔진 단면 (Fan, LPC, HPC, Combustion chamber, HPT, LPT)\" loading=\"lazy\"><figcaption>터보팬 엔진 단면 (Fan, LPC, HPC, Combustion chamber, HPT, LPT)<\/figcaption><\/figure><\/div>\n<ul>\n<li><strong>2 Spool<\/strong> — 2축으로 구동 / N1먼저 구동<\/li>\n<li>Fan(N1) → <b class=\"k\">LPC<\/b> → <b class=\"k\">HPC<\/b> → CC → <b class=\"k\">HPT<\/b> → <b class=\"k\">LPT<\/b> — 바깥쪽 <b class=\"k\">Bypass air 70~80%<\/b> / 안쪽 축 N2(HPC-HPT), N1(Fan-LPC-LPT)<\/li>\n<li>Compressor (압축) → Combustion Chamber (연소) → Turbine (배기)<\/li>\n<\/ul>\n<p><strong><b class=\"k\">Bleed Air<\/b> + 외기온도<\/strong> (Climb, Cruise)<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>시스템<\/th>\n<th>작동 조건<\/th>\n<th><\/th>\n<th>비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1.<\/td>\n<td><b class=\"k\">Engine<\/b> Anti-ice<\/td>\n<td><b class=\"k\">존재 또는 존재 예상<\/b><\/td>\n<td>Exist / Expect Exist<\/td>\n<td>SAT -40℃ 일 때는 작동금지<\/td>\n<\/tr>\n<tr>\n<td>2.<\/td>\n<td><b class=\"k\">Wing<\/b> Anti-ice<\/td>\n<td><b class=\"k\">실제 조우<\/b><\/td>\n<td>Encounter<\/td>\n<td>착륙할 때까지 못 끄기 때문에<\/td>\n<\/tr>\n<tr>\n<td>3.<\/td>\n<td><b class=\"k\">Windscreen<\/b> Anti-ice<\/td>\n<td>→ <b class=\"k\">Electrical<\/b><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Anti-ice ON 조건<\/strong> : <mark><b class=\"k\">OAT (or TAT) +10℃ 이하<\/b><\/mark> <mark><b class=\"k\">+ Visible Moisture<\/b><\/mark>\n- Visible Moisture → cloud, fog, rain, snow / Ice crystal\n- Movement area → snow, standing water, slush\n- SAT = TAT – Ram rise — OAT 예측한 온도<\/p>"}, {"id": "s12-11", "ch": 12, "num": "12.11", "title": "Holdover Time / De-icing · Anti-icing", "pages": [67], "merged": false, "html": "<ul>\n<li><strong>Holdover Time<\/strong> : <b class=\"k\">마지막<\/b> 용액을 뿌리기 <b class=\"k\">시작<\/b>하는 시점부터<\/li>\n<li><strong>만료<\/strong>\n  1. 용액의 <b class=\"k\">효과가 없어질<\/b> 때 — 광택이 사라졌을 때 / 위에 오염물이 쌓였을 때\n  2. Holdover <b class=\"k\">Time 을 초과<\/b>할 때 — OAT / Precipitation 종류 따라 다름<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>용어<\/th>\n<th>의미<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>De-icing<\/td>\n<td>제빙<\/td>\n<\/tr>\n<tr>\n<td>Anti-icing<\/td>\n<td>방빙<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>※ OAT(<b class=\"k\">0℃<\/b>) 이상일 때는 <b class=\"k\">Heated Water<\/b> 사용가능<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>방식<\/th>\n<th>내용<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>One-step<\/strong><\/td>\n<td>De/Anti-icing <b class=\"k\">하나<\/b>의 용액<\/td>\n<\/tr>\n<tr>\n<td><strong>Two-step<\/strong><\/td>\n<td><b class=\"k\">De-icing 후<\/b>에, <b class=\"k\">Anti-icing 용액<\/b><\/td>\n<\/tr>\n<tr>\n<td><strong>Secondary De/Anti-Icing<\/strong><\/td>\n<td>장시간 지연, 지속적인 강수, Holdover Time 만료 → <b class=\"k\">전체적<\/b>으로 다시 수행<br>오염된 용액 반드시 De-icing으로 제거 후, <b class=\"k\">반드시 Two-step<\/b>으로 수행<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Fluid<\/th>\n<th>색<\/th>\n<th>용도<\/th>\n<th>특성<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><mark>Type 1<\/mark><\/td>\n<td><mark>Orange<\/mark><\/td>\n<td>De-icing<\/td>\n<td>Anti 효과 미미<\/td>\n<td>흘러내림<\/td>\n<\/tr>\n<tr>\n<td>Type 2<\/td>\n<td>White<\/td>\n<td>De/Anti-icing<\/td>\n<td>잘 달라붙음<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><mark>Type 4<\/mark><\/td>\n<td><mark>Green<\/mark><\/td>\n<td>De/Anti-icing<\/td>\n<td>잘 달라붙음<\/td>\n<td>가장 비쌈<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>※ 연료가 외기온도보다 높으면, Holdover Time 감소시키지 않음<\/li>\n<li>※ 착빙 → 박리지연 → Lift 감소 → 이를 <b class=\"k\">속도로 보충<\/b> → <b class=\"k\">Stall Speed 증가<\/b><\/li>\n<\/ul>"}, {"id": "s12-12", "ch": 12, "num": "12.12", "title": "Pitot / Static Block", "pages": [67], "merged": false, "html": "<ul>\n<li>고도상승 → 기압감소<\/li>\n<li>Total P – Static P = 속도로 환산<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>막힘<\/th>\n<th><\/th>\n<th>속도계<\/th>\n<th>고도계<\/th>\n<th>VSI<\/th>\n<th>비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Pitot (X)<\/td>\n<td><\/td>\n<td>“0” 표시<\/td>\n<td>정상<\/td>\n<td>정상<\/td>\n<td>공기 빠져나감 — ‘입’만 막히면 침묵(“0”)<\/td>\n<\/tr>\n<tr>\n<td>Pitot (X)<\/td>\n<td>Drain (X)<\/td>\n<td>고도계 처럼<\/td>\n<td>정상<\/td>\n<td>정상<\/td>\n<td>고도 상승시 속도 상승 / 반대로 움직임<\/td>\n<\/tr>\n<tr>\n<td>Static (X)<\/td>\n<td><\/td>\n<td>부정확<\/td>\n<td>고정<\/td>\n<td>“0” 지시<\/td>\n<td>상승시 감소(과대) / 하강시 상승(과소)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>여압항공기 정압관 (X) → 실제 고도보다 낮게 지시<\/li>\n<li>기압고도 = 진고도 → 표준대기 상태일 경우<\/li>\n<\/ul>"}, {"id": "s12-13", "ch": 12, "num": "12.13", "title": "Gyro Instrument / Pendulous Vane", "pages": [70], "merged": false, "html": "<p><strong>Gyro Instrument — HAT<\/strong> (Vacuum Driven)<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>계기<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>H<\/strong><\/td>\n<td>Heading Indicator<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>A<\/strong><\/td>\n<td>Attitude Indicator<\/td>\n<td>항상 지표면과 수직을 이루는 Rotor — Gyro<\/td>\n<\/tr>\n<tr>\n<td><strong>T<\/strong><\/td>\n<td>Turn Coordinator<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>특성<\/th>\n<th>내용<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Precession<\/strong><\/td>\n<td>90도 전방에서 힘이 작용<\/td>\n<td>세차성 / 섭동성<\/td>\n<\/tr>\n<tr>\n<td><strong>Rigidity in Space<\/strong><\/td>\n<td>항공기 자세와 관계없이 항상 특정 축을 기준으로 회전하는 특성<\/td>\n<td>강직성<\/td>\n<\/tr>\n<tr>\n<td><strong>Pendulous Vane<\/strong><\/td>\n<td>Gyro가 수직을 이룰 수 있도록 자세를 다시 유지시켜주는 기능<\/td>\n<td>평형을 이루어주는 air hole<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s12-14", "ch": 12, "num": "12.14", "title": "IRU / IRS", "pages": [32], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>구분<\/th>\n<th>명칭<\/th>\n<th>구성<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>IRU<\/strong><\/td>\n<td>Inertial Unit<\/td>\n<td>Gyro<\/td>\n<\/tr>\n<tr>\n<td><strong>IRS<\/strong><\/td>\n<td>Inertial System<\/td>\n<td>Accelerometer<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s12-15", "ch": 12, "num": "12.15", "title": "Fuel Dumping", "pages": [32], "merged": false, "html": "<ul>\n<li>최소 <strong>6,000ft<\/strong><\/li>\n<li>Thunderstorm 피해서 (화재위험)<\/li>\n<li>도시 피해서 Water 위 추천<\/li>\n<li>고도 보고 / 소요시간 보고<\/li>\n<\/ul>"}, {"id": "s12-16", "ch": 12, "num": "12.16", "title": "EFB (Electronic Flight Bag)", "pages": [80], "merged": false, "html": "<ul>\n<li>회사에서 지급하는 iPAD (ex. Chart Minima, FAF Course 확인 등의 용도)<\/li>\n<\/ul>"}, {"id": "s13-01", "ch": 13, "num": "13.1", "title": "MAYDAY / PAN-PAN", "pages": [70], "merged": false, "html": "<p><strong>MAYDAY — Distress<\/strong> (<mark><b class=\"k\">조난<\/b><\/mark> <b class=\"k\">즉각적인 도움<\/b>) — <b class=\"k\">댄공 FOM 549p 필수참고<\/b>\n- 다른 모든 활동을 중단하고 <b class=\"k\">즉시 구조<\/b>를 시작하도록 요청\n- All engine out / 2 Eng - One Engine out 등 급박한 도움이 필요한 경우에 선언\n- <b class=\"k\">여압 상실<\/b> / <b class=\"k\">Medical Emergency<\/b> / <b class=\"k\">Fire<\/b> / <b class=\"k\">COM/NAV 상당히 파손<\/b> / <b class=\"k\">난동등급 3~4등급<\/b>\n- <b class=\"k\">1Eng fail for 2ENG<\/b> / <b class=\"k\">2Eng fail for 4ENG<\/b> / <b class=\"k\">Fuel Emergency<\/b>\n- <b class=\"k\">TA RA<\/b> → 여전히 상승 퍼포먼스는 나오기 때문에 / <b class=\"k\">Eng Fail시 TA only<\/b><\/p>\n<p><strong>PAN-PAN — Urgency<\/strong> (<mark><b class=\"k\">긴급<\/b><\/mark> 아직은 즉각적인 도움 필요 없음)\n- <b class=\"k\">“Possible Assistance Needed”<\/b>\n- 응급구조대에게 긴급한 문제가 있음을 알림 → ATC로부터 나에게 집중하도록 도움을 받는 것\n- 현재 상황에서 더 악화된다면 MAYDAY를 선언\n- PAN-PAN x3 → “All Station” x3 / “특정 ATC” x3 반복 후 Call sign / 위치 / 상황 / 필요한 지원 요청<\/p>\n<ol>\n<li><b class=\"k\">4 Eng → 1 Eng fail<\/b> — <b class=\"k\">PAN-PAN 상황임<\/b><\/li>\n<li><b class=\"k\">Weather Deviation<\/b> — <b class=\"k\">PAN-PAN 상황임<\/b> — 해양공역 / CPDLC가능하지만, 반응속도 느림<\/li>\n<\/ol>"}, {"id": "s13-02", "ch": 13, "num": "13.2", "title": "경보단계 비상상황 (Emergency Phase)", "pages": [73], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>단계<\/th>\n<th>조건<\/th>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Uncertainty Phase<\/strong><br>불확실상황<\/td>\n<td><b class=\"k\">연락<\/b> 있어야 할 시간<\/td>\n<td>첫 번째 <b class=\"k\">교신실패<\/b> 시간<\/td>\n<td>더 <b class=\"k\">이른<\/b> 시간 <b class=\"k\">30분<\/b> 연락두절<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>마지막 통보 <b class=\"k\">도착 예정시간<\/b><\/td>\n<td>예상한 <b class=\"k\">도착 예정시간<\/b><\/td>\n<td>더 <b class=\"k\">늦은<\/b> 시간 <b class=\"k\">30분<\/b> 연락두절<\/td>\n<\/tr>\n<tr>\n<td><strong>Alert Phase<\/strong><br>경보상황<\/td>\n<td>교신시도 · 관계 부서 조회<\/td>\n<td>해당 항공기 위치 확인 곤란한 경우<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>착륙허가 · 착륙 예정시간<\/td>\n<td>5분 이내 착륙(X)<\/td>\n<td>무선교신 두절<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>비행능력 상실<\/td>\n<td>불시착 가능성 없음<\/td>\n<td>안전 우려 명백한 증거 제외<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><b class=\"k\">테러 등 불법간섭<\/b><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Distress Phase<\/strong><br>조난상황<\/td>\n<td>경보상황 · 교신 실패<\/td>\n<td>조난당하였을 가능성<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>탑재연료 고갈 +<\/td>\n<td>안전 유지 불가능<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>비행능력 상실<\/td "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>의미<\/th>\n<th>요격항공기<\/th>\n<th>피요격항공기<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>따라오라<\/strong><\/td>\n<td>날개 흔들고 / 항행등 불규칙 점멸 / 좌측으로 완만하게 선회<\/td>\n<td>날개 흔들고 / 항행등 불규칙 점멸<\/td>\n<\/tr>\n<tr>\n<td><strong>가던길 가라<\/strong><\/td>\n<td>90도 이상 급격 상승 / 경로 가로지르지 않고 이탈<\/td>\n<td>날개 흔든다<\/td>\n<\/tr>\n<tr>\n<td><strong>여기 랜딩하라<\/strong><\/td>\n<td>랜딩기어 내리고 / 착륙등 켠다<\/td>\n<td>랜딩기어 내리고 / 착륙등 켠다<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>항공보안 위험등급<\/th>\n<th>색<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>평시<\/td>\n<td>Green<\/td>\n<\/tr>\n<tr>\n<td>관심<\/td>\n<td>Blue<\/td>\n<\/tr>\n<tr>\n<td>주의<\/td>\n<td>Yellow<\/td>\n<\/tr>\n<tr>\n<td>경계<\/td>\n<td>Orange<\/td>\n<\/tr>\n<tr>\n<td>심각<\/td>\n<td>Red<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>협약<\/th>\n<th>대상<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>헤이그 협약<\/td>\n<td><b class=\"k\">항공기내<\/b> 불법납치<\/td>\n<\/tr>\n<tr>\n<td>동경협약<\/td>\n<td><b class=\"k\">항공기내<\/b> 불법행위<\/td>\n<\/tr>\n<tr>\n<td>몬트리올(<b class=\"k\">공항포함<\/b>)<\/td>\n<td>민간항공 불법행위<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s13-07", "ch": 13, "num": "13.7", "title": "CRM (Crew Resource Management) / TEM — 구)공중항법", "pages": [83], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>세대<\/th>\n<th>명칭<\/th>\n<th>관련<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1세대<\/td>\n<td><b class=\"k\">Cockpit<\/b> Resource Management<\/td>\n<td>Human (5명)<\/td>\n<\/tr>\n<tr>\n<td>2세대<\/td>\n<td><b class=\"k\">Crew<\/b> Resource Management<\/td>\n<td>조종사, 객실승무원, 운항관리사, 정비사, ATC<\/td>\n<\/tr>\n<tr>\n<td>3세대<\/td>\n<td><b class=\"k\">Advanced<\/b> Crew Resource Management<\/td>\n<td>Hardware<\/td>\n<\/tr>\n<tr>\n<td>4세대<\/td>\n<td><b class=\"k\">Integrated<\/b> CRM<\/td>\n<td>FMC (Automation) 다루는 능력<\/td>\n<\/tr>\n<tr>\n<td>5세대<\/td>\n<td><b class=\"k\">Error<\/b> Management<\/td>\n<td>Information<\/td>\n<\/tr>\n<tr>\n<td>6세대<\/td>\n<td><b class=\"k\">Threat<\/b> &amp; Error Management<\/td>\n<td>Chart 등 Manual<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong><b class=\"k\">TEM<\/b><\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>구분<\/th>\n<th>정의<\/th>\n<th>예<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><mark><strong>Threat<\/strong><\/mark><\/td>\n<td><b class=\"k\">통제할 수 없는 Event / 사람의지 무관<\/b><\/td>\n<td>악기상, 시스템 고장<\/td>\n<\/tr>\n<tr>\n<td><mark><strong>Error<\/strong><\/mark><\/td>\n<td><b class=\"k\">Action 또는 Inaction / 사람의 실수<\/b><\/td>\n<td>과조작 / 미조작 Deviation<\/td>\n<\/tr>\n<tr>\n<td><strong>UAS<\/strong><\/td>\n<td>Undesired Aircraft State 방지<\/td>\n<td>Safety Margin 감소한 상태<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<blockquote>\n<p><mark><b class=\"k\">Threat / Error에 대해서 SOP를 기반으로 5 Skill을 활용해서 Safety와 Efficiency 추가하는 것<\/b><\/mark><\/p>\n<\/blockquote>\n<ul>\n<li>TO/APP Briefing에서 사용 — <b class=\"k\">승무원 상호협력<\/b> / <b class=\"k\">의사소통<\/b> / 운항기술기준<\/li>\n<li>Threat 관리 Error 감소 및 관리<\/li>\n<li><mark>SOP (규칙) 숙지<\/mark> / <mark>Checklist<\/mark> / <mark>Standard Callout<\/mark> / <mark>Briefing<\/mark><\/li>\n<li>Threat/Error는 불가피하지만, 인정하고 예방하기 위해 적절히 대응하자<\/li>\n<li>계획 – 실행 – 검토 → Safety Margin 확보<\/li>\n<\/ul>\n<p><strong><b class=\"k\">5 SKILL<\/b> — <mark><b class=\"k\">STD CT<\/b><\/mark><\/strong> (SOP를 바탕으로)<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>Skill<\/th>\n<th>내용<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>S<\/strong><\/td>\n<td><b class=\"k\">S<\/b>ituation Awareness<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>T<\/strong><\/td>\n<td><b class=\"k\">T<\/b>ask Allocation<\/td>\n<td>(Workload Management)<\/td>\n<\/tr>\n<tr>\n<td><strong>D<\/strong><\/td>\n<td><b class=\"k\">D<\/b>ecision Making<\/td>\n<td>Action 이전 <b class=\"k\">“I have control”<\/b><\/td>\n<\/tr>\n<tr>\n<td><strong>C<\/strong><\/td>\n<td><b class=\"k\">C<\/b>ommunication Skill<\/td>\n<td>ATC에 “Going Around”를 말해버린다<\/td>\n<\/tr>\n<tr>\n<td><strong>T<\/strong><\/td>\n<td>(제주) <b class=\"k\">T<\/b>eamwork (Leadership)<\/td>\n<td>PM / PF의 역할분담 / Medical Emergency 객실-관제 의사소통<\/td>\n<\/tr>\n<tr>\n<td>(제주)<\/td>\n<td><b class=\"k\">A<\/b>utomation Management<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"figs\"><figure><img src=\"img/i-083-043.webp\" alt=\"THREATS — Airport / ATC / Aircraft / Environment / Weather / Operations / Crew / Terrain\" loading=\"lazy\"><figcaption>THREATS — Airport / ATC / Aircraft / Environment / Weather / Operations / Crew / Terrain<\/figcaption><\/figure><\/div>"}, {"id": "s13-08", "ch": 13, "num": "13.8", "title": "Auto Pilot의 장점 (에프FOM 95p) / PM과 PF의 임무", "pages": [80], "merged": false, "html": "<ul>\n<li><b class=\"k\">정밀함, Auto Land시 Minimum 감소, Work Load 감소, 안전성<\/b> 향상<\/li>\n<li>결함시, 상황파악에 불리함<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>임무<\/th>\n<th><\/th>\n<th><\/th>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>PF<\/strong><\/td>\n<td><strong>Aviate<\/strong><\/td>\n<td><strong>Navigate<\/strong><\/td>\n<td><strong>Monitoring<\/strong><\/td>\n<td>PM에게 지시<\/td>\n<td>Briefing<\/td>\n<\/tr>\n<tr>\n<td><strong>PM<\/strong><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td>Communicate<\/td>\n<td>Checklist / ATC<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s13-09", "ch": 13, "num": "13.9", "title": "상호확인 (중요 기재취급)", "pages": [80], "merged": false, "html": "<ul>\n<li>중요 기재취급 : Pneumatic(공압/Gyro, anti/de-icing, Door, Bleed air, 냉난방, cooling 등) 아님 주의<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>상호확인 대상<\/th>\n<th><\/th>\n<th><\/th>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Flap<\/td>\n<td>L/G Landing Gear<\/td>\n<td>S/B Speed Brake<\/td>\n<td>P/B Parking Brake<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Overhead Panel : Fuel<\/td>\n<td>Electric<\/td>\n<td>Hydraulic<\/td>\n<td>Fire Fighting<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s13-10", "ch": 13, "num": "13.10", "title": "Sterile Cockpit Rule", "pages": [80], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>비행중요단계<\/th>\n<th>Pushback, Taxi 포함<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><b class=\"k\">10,000ft 이하<\/b>의 순항을 제외한 <b class=\"k\">모든 운항<\/b><\/td>\n<td><b class=\"k\">불필요한 대화 행동 금지<\/b><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s13-11", "ch": 13, "num": "13.11", "title": "UPRT (Upset Prevention & Recovery Training)", "pages": [80], "merged": false, "html": "<p><strong>Upset · Prevention · Recovery · Training<\/strong> (Ex. 737FCTM 347p)<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Upset 기준<\/th>\n<th><\/th>\n<th>비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Pitch Up<\/td>\n<td>25° 초과<\/td>\n<td>Intention(의도적으로 당겨야 할 경우) upset이 아님!<\/td>\n<\/tr>\n<tr>\n<td>Pitch Down<\/td>\n<td>10° 초과 (level-5° 정도)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Bank Angle<\/td>\n<td>45° 초과<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Airspeed 비정상<\/td>\n<td>Inappropriate for the condition<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>회피기동<\/th>\n<th>GPWS<\/th>\n<th>WS (wind shear)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>초기 Pitch<\/td>\n<td>20° → initial buffet<\/td>\n<td>15°<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>더 심각한 상황<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s13-12", "ch": 13, "num": "13.12", "title": "SMS (Safety Management System) — 시행규칙 264p", "pages": [83], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>요소<\/th>\n<th>내용<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>정<\/strong><\/td>\n<td>항공안전에 대한 정책 및 달성목표<\/td>\n<td>조직구성 및 역할, 책임 부여<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>보<\/strong><\/td>\n<td>항공안전 보증<\/td>\n<td>지속 모니터링, 감사, 평가, 성과분석<\/td>\n<td>점검과 피드백<\/td>\n<\/tr>\n<tr>\n<td><strong>위<\/strong><\/td>\n<td>항공안전 위험도 관리<\/td>\n<td>위험식별, 분석 및 평가, 통제 및 완화<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>증<\/strong><\/td>\n<td>항공안전 증진<\/td>\n<td>안전교육 및 훈련, 의사소통 활성화<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s13-13", "ch": 13, "num": "13.13", "title": "Hypoxia (저산소증)", "pages": [83], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>종류<\/th>\n<th>원인<\/th>\n<th>예<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Hypoxic<\/strong><\/td>\n<td>환경적 산소농도 부족<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Hypemic<\/strong><\/td>\n<td>피의 문제 (피의 부족)<\/td>\n<td>일산화탄소 중독<\/td>\n<\/tr>\n<tr>\n<td><strong>Stagnant<\/strong><\/td>\n<td>피의 흐름의 문제<\/td>\n<td>급상승 / 급강하<\/td>\n<\/tr>\n<tr>\n<td><strong>Histotoxic<\/strong><\/td>\n<td>세포의 문제 — 피(O) / 산소(O)<\/td>\n<td>알콜, 독, 약물 — 알콜 0.02% / 8시간<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s13-14", "ch": 13, "num": "13.14", "title": "비행착각 (Spatial Disorientation & Illusions) — PHAK 433p", "pages": [87], "merged": false, "html": "<p><strong>기본 정리<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th>내용<\/th>\n<th>결과 / 대처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Collision Avoidance<\/td>\n<td>Outside 15sec / Inside 5sec<\/td>\n<td>맹점방지 → 천천히 스캔<\/td>\n<\/tr>\n<tr>\n<td>Spatial Disorientation<\/td>\n<td>방향감각 상실<\/td>\n<td>→ 계기에 의존하는게 효과적이다.<\/td>\n<\/tr>\n<tr>\n<td>Somatogravic Illusion<\/td>\n<td>급격한 가속<\/td>\n<td>→ pitch up하는 착각<\/td>\n<\/tr>\n<tr>\n<td>Autokinesis<\/td>\n<td>고정된 불빛<\/td>\n<td>→ 움직이는 걸로 착각<\/td>\n<\/tr>\n<tr>\n<td>Narrow Runway<\/td>\n<td>높게 착각<\/td>\n<td>→ 잘 안보이면 높게 느껴짐<\/td>\n<\/tr>\n<tr>\n<td>Dark Area<\/td>\n<td>높게 착각<\/td>\n<td>→ 잘 안보이면 높게 느껴짐<\/td>\n<\/tr>\n<tr>\n<td>Rain on wind screen<\/td>\n<td>높게 착각<\/td>\n<td>→ 잘 안보이면 높게 느껴짐<\/td>\n<\/tr>\n<tr>\n<td>Haze<\/td>\n<td>멀어보인다<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Fog / Cloud 통과시<\/td>\n<td>→ pitch up하는 착각<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>전정기관(Vestibular) 착각<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>착각<\/th>\n<th>상황<\/th>\n<th>착각 내용<\/th>\n<th><\/th>\n<th>대처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Leans<\/strong><\/td>\n<td>회전 후 멈춤(레벨)<\/td>\n<td>반대로 기울어져 있다고 착각<\/td>\n<td><\/td>\n<td>천천히 회복 / 계기 신뢰<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><em>Slow bank recovery leads to false sensation of banking when flying level<\/em><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Coriolis illusion<\/strong><\/td>\n<td>회전 중 머리 움직임<\/td>\n<td>Overwhelming 뒤집히는 느낌<\/td>\n<td><\/td>\n<td>회전 중 머리나 몸 돌리지 않기<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><em>Head movement during constant turn causes overwhelming tumbling sensation<\/em><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Graveyard Spiral<\/strong><\/td>\n<td>하강 회전 중<\/td>\n<td>수평으로 착각 (Level → pitch up)<\/td>\n<td>조종간 당겨 추락<\/td>\n<td>고도계/속도계 지속 확인 / 계기 신뢰<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><em>Perceived level flight during descending spiral; pulling back increases descent rate<\/em> — Wind Shear / GPWS Escape maneuver<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Graveyard Spin<\/strong><\/td>\n<td>회전 후 멈춤<\/td>\n<td>반대 회전 착각<\/td>\n<td>반대 재진입<\/td>\n<td>고도계/속도계 지속 확인 / 계기 신뢰<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><em>After spin recovery, feels like spinning the opposite direction; may re-enter spin<\/em><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Somatogyral illusion<\/strong><\/td>\n<td>회전 / 가속 중<\/td>\n<td>전정기관<\/td>\n<td>잘못 전달<\/td>\n<td>고도계/속도계 지속 확인 / 계기 신뢰<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><em>Inner ear misinterprets angular acceleration or deceleration, leading to disorientation<\/em><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Inversion illusion<\/strong><\/td>\n<td>급격 상승 후 수평비행<\/td>\n<td>뒤로 가는 느낌<\/td>\n<td><\/td>\n<td>급격한 자세변화 피하고 천천히<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><em>Abrupt change from climb to level flight gives backward tumbling sensation<\/em><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Elevator illusion<\/strong><\/td>\n<td>상승/하강 기류<\/td>\n<td>피치업/다운 착각<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><em>Updraft/downdraft<\/em><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Head-up illusion<\/strong><\/td>\n<td>급격 가속 시<\/td>\n<td>피치업<\/td>\n<td>기수를 누름<\/td>\n<td>계기 신뢰<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><em>Rapid acceleration causes false pitch-up sensation, leading to nose-down input<\/em><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Head-down illusion<\/strong><\/td>\n<td>급격 감속 시<\/td>\n<td>피치다운<\/td>\n<td>기수를 들어버림<\/td>\n<td>계기 신뢰<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><em>Sudden deceleration causes sensation of pitch down, pilot may pitch up mistakenly<\/em><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Somatogravic illusion<\/strong><\/td>\n<td>급감속시<\/td>\n<td>피치 착각<\/td>\n<td><\/td>\n<td>수평유지 시 계기 확인<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><em>Linear acceleration or deceleration misinterpreted as pitch change<\/em><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>시각 착각 (Visual illusion)<\/strong> — 야간 / 시계불량 → 시각정보 → 잘못된 자세/고도 → 계기 신뢰<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>착각<\/th>\n<th>느낌<\/th>\n<th>결과 / 대처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Narrow Runway<\/strong><\/td>\n<td>높게 느껴짐<\/td>\n<td>낮게 접근<\/td>\n<\/tr>\n<tr>\n<td><strong>Downhill Runway<\/strong><\/td>\n<td>높게 느껴짐<\/td>\n<td>낮게 접근<\/td>\n<\/tr>\n<tr>\n<td><strong>Black Hole Approach<\/strong><\/td>\n<td>높게 느껴짐<\/td>\n<td>낮게 접근 — *야간 바다 / 평지<\/td>\n<\/tr>\n<tr>\n<td><strong>Autokinesis<\/strong><\/td>\n<td>어두운 곳 / 고정불빛 → 움직이는 걸로 느껴짐<br><em>Stationary light appears to move when stared at in darkness<\/em><\/td>\n<td>뚫어지게 보지 않고, 주변 자주 스캔<\/td>\n<\/tr>\n<tr>\n<td><strong>False Horizon<\/strong><\/td>\n<td>구름, 불빛, 지형 → 실제 수평선으로 착각<\/td>\n<td>자세계 확인 / 계기 신뢰<\/td>\n<\/tr>\n<tr>\n<td><strong>Flicker Vertigo<\/strong><\/td>\n<td>프로펠러, 점멸등 깜빡 → 현기증 유발<\/td>\n<td>시선 돌리고, 주의집중 분산<\/td>\n<\/tr>\n<tr>\n<td><strong>Structural illusion<\/strong><\/td>\n<td>유리창 굴절 → 시각왜곡<\/td>\n<td>계기 신뢰<\/td>\n<\/tr>\n<tr>\n<td><strong>Size-Distance illusion<\/strong><\/td>\n<td>작은 물체 → 멀리 있다고 착각<\/td>\n<td>착시 교정<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s14-01", "ch": 14, "num": "14.1", "title": "항공법 구성 / 국제조약", "pages": [87], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>법령<\/th>\n<th>제정<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>항공법<\/td>\n<td>국회 입법<\/td>\n<\/tr>\n<tr>\n<td>시행령<\/td>\n<td>대통령령<\/td>\n<\/tr>\n<tr>\n<td><mark>시행규칙<\/mark><\/td>\n<td><mark>국토부장관령<\/mark><\/td>\n<\/tr>\n<tr>\n<td>운항기술기준<\/td>\n<td>FSR (Flight Safety Regulation)<\/td>\n<\/tr>\n<tr>\n<td>AOC(운항증명)<\/td>\n<td>OPS SPEC(운영기준) → 바탕으로 사내규정(FOM)제작<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>조약<\/th>\n<th>시기<\/th>\n<th>성격<\/th>\n<th>내용<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><b class=\"k\">파리조약<\/b><\/td>\n<td><b class=\"k\">1919년 1차 세계대전 후<\/b><\/td>\n<td><mark>국제항공조약<\/mark><\/td>\n<td><mark>국제 항공기 사용과 비행 규제<\/mark><\/td>\n<\/tr>\n<tr>\n<td><b class=\"k\">시카고 조약<\/b><\/td>\n<td><b class=\"k\">1939년 2차 세계대전 후<\/b> <span class=\"fix\" title=\"정리하면서 확인·수정한 부분\">✎ 시카고 협약 실제 체결은 1944년<\/span><\/td>\n<td><mark>국제적 협력<\/mark><\/td>\n<td><mark>국제교통권, 상업권<\/mark><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>1) 영공주권의 원칙<\/td>\n<td>영공 배타적 권리<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>2) 부정기 영공통과 자유<\/td>\n<td>무상 부정기<\/td>\n<td>유상 부정기<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>협약<\/th>\n<th>대상<\/th>\n<th>범위<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>동경 협약(1963)<\/td>\n<td>항공기내 범죄 및 기타행위<\/td>\n<td>비행중<\/td>\n<td>이륙목적 시동~착륙활주<\/td>\n<\/tr>\n<tr>\n<td>헤이그 협약(1970)<\/td>\n<td>항공기 불법납치 억제<\/td>\n<td>비행중<\/td>\n<td>탑승 도어 Close ~ 하기 도어 Open<\/td>\n<\/tr>\n<tr>\n<td><mark>몬트리올 협약(1971)<\/mark><\/td>\n<td><mark>민간항공 불법적 행위 억제<\/mark><\/td>\n<td><mark>기내를 벗어난 포괄적 범위<\/mark><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s14-02", "ch": 14, "num": "14.2", "title": "ICAO ANNEX 1~19 (면규기지단 운국감간통 교수사비정 환보위안)", "pages": [78], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Annex<\/th>\n<th>암기<\/th>\n<th>내용<\/th>\n<th>연상<\/th>\n<th>키워드<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Annex 1<\/td>\n<td><mark><strong>면<\/strong><\/mark><\/td>\n<td>항공종사자 <b class=\"k\">면<\/b>허<\/td>\n<td>123 중요순서<\/td>\n<td>자격<\/td>\n<\/tr>\n<tr>\n<td>Annex 2<\/td>\n<td><mark><strong>규<\/strong><\/mark><\/td>\n<td>항공 <b class=\"k\">규<\/b>칙<\/td>\n<td><\/td>\n<td>규칙<\/td>\n<\/tr>\n<tr>\n<td>Annex 3<\/td>\n<td><mark><strong>기<\/strong><\/mark><\/td>\n<td>국제항공항행용 <b class=\"k\">기<\/b>상업무<\/td>\n<td><\/td>\n<td>기상<\/td>\n<\/tr>\n<tr>\n<td>Annex 4<\/td>\n<td><mark><strong>지<\/strong><\/mark><\/td>\n<td>항공 <b class=\"k\">지<\/b>도<\/td>\n<td>4 → 동서남북<\/td>\n<td>지도<\/td>\n<\/tr>\n<tr>\n<td>Annex 5<\/td>\n<td><mark><strong>단<\/strong><\/mark><\/td>\n<td>공중, 지상업무에 상용하기 위한 측정 <b class=\"k\">단<\/b>위<\/td>\n<td>손가락 다섯개 → 잴 수 있으니깐<\/td>\n<td>측정단위<\/td>\n<\/tr>\n<tr>\n<td>Annex 6<\/td>\n<td><mark><strong>운<\/strong><\/mark><\/td>\n<td>항공기 <b class=\"k\">운<\/b>항<\/td>\n<td>이륙<\/td>\n<td>운항<\/td>\n<\/tr>\n<tr>\n<td>Annex 7<\/td>\n<td><mark><strong>국<\/strong><\/mark><\/td>\n<td>항공기 <b class=\"k\">국<\/b>적 및 등록 기호<\/td>\n<td>7777<\/td>\n<td>국적 및 등록기호<\/td>\n<\/tr>\n<tr>\n<td>Annex 8<\/td>\n<td><mark><strong>감<\/strong><\/mark><\/td>\n<td>항공기 <b class=\"k\">감<\/b>항성<\/td>\n<td>무한대 → 감항 받으면 무한비행<\/td>\n<td>감항<\/td>\n<\/tr>\n<tr>\n<td>Annex 9<\/td>\n<td><mark><strong>간<\/strong><\/mark><\/td>\n<td>출입국 <b class=\"k\">간<\/b>소화<\/td>\n<td>9분만 간소화<\/td>\n<td>간소화<\/td>\n<\/tr>\n<tr>\n<td>Annex 10<\/td>\n<td><mark><strong>통<\/strong><\/mark><\/td>\n<td>항공 <b class=\"k\">통<\/b>신<\/td>\n<td>010<\/td>\n<td>통신<\/td>\n<\/tr>\n<tr>\n<td>Annex 11<\/td>\n<td><mark><strong>교<\/strong><\/mark><\/td>\n<td>항공 <b class=\"k\">교<\/b>통 업무<\/td>\n<td>도로모양<\/td>\n<td>교통<\/td>\n<\/tr>\n<tr>\n<td>Annex 12<\/td>\n<td><mark><strong>수<\/strong><\/mark><\/td>\n<td><b class=\"k\">수<\/b>색 및 구조<\/td>\n<td>112<\/td>\n<td>수색 및 구조<\/td>\n<\/tr>\n<tr>\n<td>Annex 13<\/td>\n<td><mark><strong>사<\/strong><\/mark><\/td>\n<td>항공기 <b class=\"k\">사<\/b>고조사<\/td>\n<td>13일의 금요일<\/td>\n<td>사고조사<\/td>\n<\/tr>\n<tr>\n<td>Annex 14<\/td>\n<td><mark><strong>비<\/strong><\/mark><\/td>\n<td><b class=\"k\">비<\/b>행장<\/td>\n<td>김포 R14<\/td>\n<td>비행장<\/td>\n<\/tr>\n<tr>\n<td>Annex 15<\/td>\n<td><mark><strong>정<\/strong><\/mark><\/td>\n<td>항공 <b class=\"k\">정<\/b>보업무<\/td>\n<td>IS<\/td>\n<td>정보업무<\/td>\n<\/tr>\n<tr>\n<td>Annex 16<\/td>\n<td><mark><strong>환<\/strong><\/mark><\/td>\n<td><b class=\"k\">환<\/b>경보호 및 항공기 소음<\/td>\n<td>1 to 6 새벽<\/td>\n<td>환경<\/td>\n<\/tr>\n<tr>\n<td>Annex 17<\/td>\n<td><mark><strong>보<\/strong><\/mark><\/td>\n<td>항공 <b class=\"k\">보<\/b>안<\/td>\n<td>갈고리 모양<\/td>\n<td>보안<\/td>\n<\/tr>\n<tr>\n<td>Annex 18<\/td>\n<td><mark><strong>위<\/strong><\/mark><\/td>\n<td><b class=\"k\">위<\/b>험물의 항공 안전 수송<\/td>\n<td>십팔 욕<\/td>\n<td>위험물<\/td>\n<\/tr>\n<tr>\n<td>Annex 19<\/td>\n<td><mark><strong>안<\/strong><\/mark><\/td>\n<td><b class=\"k\">안<\/b>전 관리<\/td>\n<td>119<\/td>\n<td>안전<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s14-03", "ch": 14, "num": "14.3", "title": "항공자유 (Freedoms of the Air)", "pages": [78], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>자유<\/th>\n<th>노선<\/th>\n<th>의미<\/th>\n<th>비고<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>제1의 자유<\/td>\n<td>A → B / Non-stop<\/td>\n<td>영공통과(협약)<\/td>\n<td><b class=\"k\">Item18 RMK<\/b> <b class=\"k\">OVRFLT PERMIT<\/b><\/td>\n<\/tr>\n<tr>\n<td>제2의 자유<\/td>\n<td>A → B / Re-fuel<\/td>\n<td>기술착륙(<b class=\"k\">Emergency<\/b>)<\/td>\n<td>Permit Number<\/td>\n<\/tr>\n<tr>\n<td>제3의 자유<\/td>\n<td>Drop-off / A → B<\/td>\n<td>드랍오프<\/td>\n<td>상대국 하기<\/td>\n<\/tr>\n<tr>\n 필요<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>* CATA (Civil Aircraft Training Area)<\/li>\n<li>* MOA (Military Operating Area)<\/li>\n<li>* UA (Ultralight vehicle flight Area)<\/li>\n<\/ul>"}, {"id": "s14-06", "ch": 14, "num": "14.6", "title": "항공종사자 / 한정자격 (형식증명)", "pages": [80], "merged": false, "html": "<ul>\n<li><strong>항공종사자<\/strong> : 항공 자격증명을 취득한 사람<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>한정자격<\/th>\n<th>내용<\/th>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>2인이상 필요한 항공기<\/td>\n<td><\/td>\n<td><\/td>\n<td>종 등 형 → 종류 등급 형식<\/td>\n<\/tr>\n<tr>\n<td>Jet 항공기<\/td>\n<td>무조건 필요하지는 않음<\/td>\n<td>1인 Jet<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>육상다발<\/td>\n<td>육상단발 <b class=\"k\">COVER 안됨<\/b><\/td>\n<td><\/td>\n<td>ㅂㅂㅎㅎㅎ<\/td>\n<\/tr>\n<tr>\n<td>자가용<\/td>\n<td>형식증명 가능<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"id": "s14-07", "ch": 14, "num": "14.7", "title": "운항중 / 승무시간 / 비행근무시간 / 근무시간 정의", "pages": [78], "merged": false, "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>구분<\/th>\n<th>시작<\/th>\n<th>종료<\/th>\n<th>정의<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>보안법<\/strong> (운항중)<\/td>\n<td><mark><b class=\"k\">승객 탑승 후<\/b><\/mark> Door Close<\/td>\n<td><mark><b class=\"k\">Door Open<\/b><\/mark><\/td>\n<td>승객이 탑승한 후, 항공기의 모든 문이 닫힐 때부터 내리기 위해 문을 열 때까지<\/td>\n<\/tr>\n<tr>\n<td><strong>운항기술기준<\/strong> (운항중)<\/td>\n<td><mark><b class=\"k\">이륙 목적 최초 움직<\/b><\/mark> (Pushback · Taxi start)<\/td>\n<td><mark><b class=\"k\">Engine Stop<\/b><\/mark><\/td>\n<td>이륙을 목적으로 최초 움직이기 시작할 때부터 최종적으로 비행기가 정지된 후, 발동기 완전 정지까지<\/td>\n<\/tr>\n<tr>\n<td><strong>승무시간<\/strong><\/td>\n<td><mark><b class=\"k\">바퀴 움직일 때<\/b><\/mark> — Actual Off Block Time (<b class=\"k\">AOBT<\/b>)<\/td>\n<td><mark><b class=\"k\">바퀴 멈출 때<\/b><\/mark> — Actual In Block Time (<b class=\"k\">AIBT<\/b>) / Chocks<\/td>\n<td>이륙을 목적으로 비행기가 최초로 움직이기 시작한 때부터 비행이 종료되어 최종적으로 비행기가 정지한 때<\/td>\n<\/tr>\n<tr>\n<td><strong>비행근무시간<\/stron
