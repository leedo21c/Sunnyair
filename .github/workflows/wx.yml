name: 기상·NOTAM 갱신
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wx
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .github/scripts/fetch_wx.py
      - name: 변경 시 커밋
        run: |
          git config user.name "wx-bot"
          git config user.email "wx-bot@users.noreply.github.com"
          git add wx/latest.json
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "기상·NOTAM 자동 갱신"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
