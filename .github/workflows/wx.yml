name: 기상·NOTAM 갱신
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/wx.yml
      - .github/scripts/fetch_wx.py
permissions:
  contents: write
concurrency:
  group: wx
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .github/scripts/fetch_wx.py
        env:
          FAA_CLIENT_ID: ${{ secrets.FAA_CLIENT_ID }}
          FAA_CLIENT_SECRET: ${{ secrets.FAA_CLIENT_SECRET }}
          ICAO_API_KEY: ${{ secrets.ICAO_API_KEY }}
          FORCE_NOTAM: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
      - name: 변경 시 커밋
        run: |
          git config user.name "wx-bot"
          git config user.email "wx-bot@users.noreply.github.com"
          git add wx/latest.json
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "기상·NOTAM 자동 갱신"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs -q origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "푸시 실패"; exit 1
